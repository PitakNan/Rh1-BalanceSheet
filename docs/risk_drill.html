// ส่วนของกลุ่มนั้นที่เลือก "ไม่จ่ายเงินสด" = ยอด 9 บัญชีเจ้าหนี้การค้า × (1 − %จ่าย) — เฉพาะโหมด 69p
function exMoeGrpStretch(h,gid){
  if(exMoeVer()!=='69p') return 0;
  return ((h.moeP9&&h.moeP9[gid])||0)*(1-exPayPct()/100);
}
// % ปรับต่อกลุ่ม (−100% = งดจ่ายทั้งหมด · 0% = ตาม run-rate ค่าเฉลี่ยจริง · +100% = จ่ายเพิ่มเป็นสองเท่า)
function exMoePct(g){ return EXST.moePct[g]!=null?EXST.moePct[g]:0; }
// % ปรับ MOE รายแห่ง (override) > ค่ากลุ่ม > 0 — เหมือน exPct ของรายรับ
function exMoePctFor(hc,g){
  const o=EXST.moeOvr[hc];
  if(o && o[g]!=null) return o[g];
  return exMoePct(g);
}
function exXmoeOn(){ return EXST.xmoe!==false; }   // ค่าใช้จ่ายนอกนิยาม MOE (run-rate)
// รพ. ที่แสดงตามฟิลเตอร์
function exRows(){
  return EX.hosp.filter(h=>EXST.types[h.type] && (EXST.crisis==='all' || (h.risk||0)>=6) && (EXST.prov==='all' || h.prov===EXST.prov));
}
// รายชื่อจังหวัดในเขต (unique จาก EX.hosp) เรียงตามอักษรไทย — สำหรับตัวกรองจังหวัด
function exProvs(){ return [...new Set(EX.hosp.map(h=>h.prov))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'th')); }
// ── ตามจ่าย: เกลี่ยภาระฝั่งเจ้าหนี้ (รพศ./รพท.) ตามสัดส่วนลูกหนี้นอก CUP ในจังหวัดเดียวกัน ──
function exTjCalc(){
  if(EXST.tj.mode==='off') return {debtors:new Set(), shares:{}, byProv:{}, total:0, uncovered:0};
  const scope=EXST.tj.scope;
  const debtors=EX.hosp.filter(h=>h.type==='รพช.' && h.tj.payIn>0 && (scope==='all' || (h.risk||0)>=6));
  const byProv={};
  debtors.forEach(h=>{ byProv[h.prov]=(byProv[h.prov]||0)+h.tj.payIn; });
  const shares={}; let uncovered=0;
  for(const prov in byProv){
    // ⚠️ ใช้ exArIn (ลูกหนี้ "หลังปรับ %") ไม่ใช่ h.tj.arIn ดิบ — แก้ 7 ส.ค. 69
    // เดิมใช้ยอดดิบ ทำให้แผง Option เกลี่ยภาระเสมือนเชียงใหม่มีลูกหนี้ 200.7M
    // ขณะที่ทุกที่อื่นในหน้าบอกว่าเก็บได้จริง 104.8M = ตัวเลขคนละชุดในหน้าเดียวกัน
    // (เจ้าของงานทัก "ไม่ใช่แค่เปลี่ยนที่เดียวนะ") · วัดผลแล้วระดับ ณ ก.ย. ไม่เปลี่ยนสักแห่ง (0/103)
    // แต่ยอด "เกลี่ยไม่ได้" เพิ่มขึ้นจริง ซึ่งซื่อตรงกว่า: หนี้ที่ไม่มีลูกหนี้เก็บได้จริงมารองรับ
    const creds=EX.hosp.filter(h=>exIsCred(h) && h.prov===prov && exArIn(h)>0);
    const w=creds.reduce((s,h)=>s+exArIn(h),0);
    if(!w){ uncovered+=byProv[prov]; continue; }
    let left=byProv[prov];
    creds.forEach(h=>{ const s=Math.min(exArIn(h), byProv[prov]*exArIn(h)/w); shares[h.hcode]=(shares[h.hcode]||0)+s; left-=s; });
    if(left>1) uncovered+=left;
  }
  return {debtors:new Set(debtors.map(h=>h.hcode)), shares, byProv,
          total:debtors.reduce((s,h)=>s+h.tj.payIn,0), uncovered};
}
// ── เงินที่ "ยกให้/ได้รับ" ต่อ รพ. จาก Option ตามจ่าย ──
// forgive: รพช.(ลูกหนี้)=ได้รับยกหนี้เต็ม (payIn) · ผู้รับภาระ(เจ้าหนี้)=ยกหนี้ให้ตามสัดส่วน (shares)
//   ⚠️ รพช. hub (EXTJHUB) เป็นได้ทั้งสองบทบาทพร้อมกัน (ค้างเองด้วย + เป็นผู้รับภาระของ รพช. เล็กด้วย)
//   จึงต้องหักลบกันเป็นค่าสุทธิ (ได้รับเต็ม − ยกให้ตามสัดส่วน) ไม่ใช่แค่เช็คว่าเป็นลูกหนี้แล้วคืนเลย
// smart(ยกหนี้เจาะจง): รพช.=ได้รับเงินคืนเฉพาะที่จำเป็น (refund R, 0 ถ้าระดับ≤3 หลังจ่าย) · เจ้าหนี้=0 (ได้รับชำระแล้ว เงินคืนมาจากเขต)
// off/pay: 0 (ไม่มีการยกให้)
function exTjGive(h){
  if(!EXTJ) return 0;
  if(EXST.tj.mode==='forgive'){
    const got=EXTJ.debtors.has(h.hcode)?h.tj.payIn:0, away=EXTJ.shares[h.hcode]||0;
    return Math.abs(got-away);
  }
  if(EXST.tj.mode==='smart'){ return EXTJ.debtors.has(h.hcode) ? ((EXTJ.refund&&EXTJ.refund[h.hcode])||0) : 0; }
  return 0;
}
function exTjRole(h){
  if(!EXTJ) return '';
  if(EXST.tj.mode==='forgive'){
    const got=EXTJ.debtors.has(h.hcode)?h.tj.payIn:0, away=EXTJ.shares[h.hcode]||0, net=got-away;
    return net>0?'got':net<0?'give':'';
  }
  if(EXST.tj.mode==='smart'){ return (EXTJ.debtors.has(h.hcode) && ((EXTJ.refund&&EXTJ.refund[h.hcode])||0)>0) ? 'got' : ''; }
  return '';
}
// ── ยกหนี้เจาะจง (smart): หา "เงินคืนขั้นต่ำ" ต่อ รพช. (0..payIn) ให้ระดับ ณ ก.ย. ≤ 3 ──
// จ่ายเต็มแล้ว ≤3 อยู่แล้ว → R=0 (ระดับ 0-3 ไม่ได้รับ) · คืนเต็มยังไม่ถึง → คืนเต็ม (best effort) · เก็บใน EXTJ.refund[hcode]
function exTjSolveRefunds(){
  EXTJ.refund={};
  const L=3;
  EXTJ.debtors.forEach(hc=>{
    const h=EX.hosp.find(x=>x.hcode===hc); if(!h) return;
    const D=h.tj.payIn;
    const sep=R=>{ EXTJ.refund[hc]=R; return exSimPath(h,0).sepRisk; };
    const s0=sep(0); if(s0==null || s0<=L){ EXTJ.refund[hc]=0; return; }
    if(sep(D)>L){ EXTJ.refund[hc]=D; return; }
    let lo=0, hi=D;
    while(hi-lo>SV_STEP){ const mid=Math.round((lo+hi)/2/SV_STEP)*SV_STEP; if(mid<=lo||mid>=hi) break; if(sep(mid)<=L) hi=mid; else lo=mid; }
    EXTJ.refund[hc]=hi;
  });
}
// ── NI จำลอง/เดือน (บัญชี) = Σรายรับ×(1+%) − MOE − ค่าเสื่อม run-rate ──
// revOff/moeOff: ปิดรายการทั้งเขต (ไม่นับรวมเข้าคำนวณเลย) — คนละแกนกับ % ปรับ (ปิดแล้วเปิดใหม่ค่า % เดิมยังอยู่)
function exRevOff(k){ return !!EXST.revOff[k]; }
function exMoeOff(g){ return !!EXST.moeOff[g]; }
function exRevMo(h){
  const mo=h.bs.mo; let s=0;
  for(const p of EX.revOrder){ const r=h.rev[p]; if(!r) continue;
    for(const g of ['op','ip','pp','oth']){ const v=r[g]||0; if(!v) continue;
      const k=exKey(p,g); if(exRevOff(k)) continue;
      s += v/mo*(1+exPct(h.hcode,p,g)/100); } }
  return s;
}
// ── MOE 2 ตัวเลข ที่ต้องไม่สับกัน (แบบ A · CFO 6 ส.ค. 69 · RISK_EXEC_MODEL.md 3.14) ──
//   exMoeAccMo    = ตามเกณฑ์คงค้าง (accrual) → ใช้หักใน NI เท่านั้น · ไม่ขึ้นกับ %จ่ายหนี้การค้า
//   exMoeMo       = เงินสดที่จ่ายจริง/เดือน  → ใช้ทุกเส้นทางเงินสด + คอลัมน์ "MOE/เดือน" ในตาราง
//   exMoeStretchMo= ผลต่างของสองตัวข้างบน = ส่วนที่เลือกยืดเป็นเจ้าหนี้การค้า (ไม่มีเงินออก)
// ⛔ ห้ามเอา exMoeMo ไปหักใน NI — จะทำให้ "ยืดหนี้" กลายเป็นกำไรที่ไม่มีอยู่จริง
function exMoeAccMo(h){
  const mo=h.bs.mo; let s=0;
  for(const g of EX.moeGroups){ if(exMoeOff(g.id)) continue; const v=exMoeGrpRaw(h,g.id)/mo; if(!v) continue; s+=v*(1+exMoePctFor(h.hcode,g.id)/100); }
  return Math.max(0,s);
}
function exMoeStretchMo(h){
  const mo=h.bs.mo; let s=0;
  for(const g of EX.moeGroups){ if(exMoeOff(g.id)) continue; const v=exMoeGrpStretch(h,g.id)/mo; if(!v) continue; s+=v*(1+exMoePctFor(h.hcode,g.id)/100); }
  return Math.max(0,s);
}
function exMoeMo(h){ return Math.max(0, exMoeAccMo(h)-exMoeStretchMo(h)); }
// MOE ส่วนที่ "ยืดไม่ได้" ต่อเดือน = กลุ่มที่ธง cash=true (ค่าจ้าง/ค่าตอบแทน + สาธารณูปโภค)
// เป็นฐานของเงินสำรอง MOE — ไม่มีใครให้เครดิตค่าแรง/ค่าน้ำค่าไฟ ต้องมีเงินสดจ่ายตามรอบเดือน
// ⚠️ ธง cash มาจาก export_exec.py (MOE_CASH_G) — ห้าม hardcode รายชื่อกลุ่มซ้ำที่นี่ (จะหลุดกันเวลาผังเปลี่ยน)
// คิด %ปรับ/ปิดกลุ่ม แบบเดียวกับ exMoeMo เพื่อให้เงินสำรองขยับตามสมมติฐานที่ผู้ใช้ตั้งไว้
// (ธง cash อยู่คนละแกนกับ 9 บัญชีเจ้าหนี้การค้า — กลุ่มยืดไม่ได้ไม่มีบัญชีในชุด 9 ตัวนั้นเลย
//  เลือกจ่ายหนี้การค้ากี่ % ก็ไม่กระทบเงินสำรอง ซึ่งถูกต้องตามความหมาย: ค่าแรง/ค่าน้ำค่าไฟยืดไม่ได้)
function exMoeCashMo(h){
  const mo=h.bs.mo; let s=0;
  for(const g of EX.moeGroups){ if(!g.cash || exMoeOff(g.id)) continue; const v=exMoeGrpRaw(h,g.id)/mo; if(!v) continue; s+=v*(1+exMoePctFor(h.hcode,g.id)/100); }
  return Math.max(0,s);
}
// ค่าใช้จ่ายเงินสดนอกนิยาม MOE = คชจ.รวม − MOE ทางการ − non-cash (เงินเดือน ขรก./ค่าตอบแทนอื่น/ตามจ่าย/ค่าใช้สอยอื่น ฯลฯ)
function exXmoeMo(h){
  const mo=h.bs.mo;
  let exp=0, nc=0;
  for(const p in h.exp){ exp+=h.exp[p]; if(EX_NONCASH[p]) nc+=h.exp[p]; }
  // ⚠️ ต้องหัก MOE "ของเวอร์ชันที่เลือก" (ยอดดิบ ไม่คิด %ปรับ/ไม่คิดการยืดหนี้) ไม่ใช่ h.moe ตรง ๆ
  //    ไม่งั้นบัญชีที่อยู่คนละเวอร์ชันจะหายไปจากค่าใช้จ่ายทั้งก้อน แล้ว NI จำลองดีขึ้นเองแบบผิด ๆ
  //    (สลับเวอร์ชัน = ย้ายบัญชีข้ามถัง MOE ↔ นอกนิยาม เท่านั้น ผลรวมค่าใช้จ่ายต้องเท่าเดิมเสมอ)
  let moe=0; for(const g of EX.moeGroups) moe+=exMoeGrpRaw(h,g.id);
  return Math.max(0,(exp-moe-nc))/mo;
}
// ── ตัวคูณกันนับซ้ำปัจจัยฤดูกาล (เพิ่ม 11 ส.ค. 69 ตอนงวดขยับจาก ด.9 → ด.10) ──────────
// bs.niYE = "ส่วนต่าง NI ต่อเดือนช่วงปิดบัญชี เทียบ run-rate ต้นปี" (วัดจากปี 67+68 ใน export_exec.py)
// แต่ niM = ni/mo คิดจากยอดสะสม ซึ่งพอถึงงวด ด.10 ขึ้นไปมีเดือนปิดบัญชี "ของจริง" ปนอยู่แล้ว k เดือน
//   niM = ต้นปี + k·niYE/mo  → ถ้าบวก niYE เต็มอีก จะนับส่วนที่ซึมเข้า niM แล้วซ้ำ
//   ที่ควรบวกจริง = (ต้นปี + niYE) − niM = niYE·(1 − k/mo)
// งวด ด.9 (k=0) ได้ตัวคูณ 1.0 = พฤติกรรมเดิมเป๊ะ · งวด ด.10 ได้ 0.9 · ด.11 ได้ 0.818
function exYeAdj(mo){ const m=+mo||0, k=Math.max(0,m-9); return m?Math.max(0,1-k/m):1; }
// NI ใช้ MOE ตามเกณฑ์คงค้าง → เลือกจ่ายหนี้การค้ากี่ % NI ก็ไม่ขยับ (ค่าใช้จ่ายเกิดแล้ว เพียงยังไม่จ่าย)
function exNiMo(h){ return exRevMo(h)-exMoeAccMo(h)-(exXmoeOn()?exXmoeMo(h):0)-h.bs.depMo; }
// ── จำลองเส้นทางถึง horizon (ก.ย. + ext เดือน) — anchor คะแนนทางการแบบเดียวกับ Simulator เดิม ──
// inj = เงินก้อนเดือน 0 · บวก = เงินสนับสนุนที่ได้รับ · ลบ = ใช้เงินเกินแผน (โหมดเพดาน)
// รับรู้เข้า NI ด้วย (2026-07-27 ตามที่ CFO กำหนด): เงินสนับสนุนจากเขต = "รายได้เงินอุดหนุนจาก
// หน่วยงานภาครัฐ" ตามผัง MOPH จึงเข้า NI เหมือน Option ยกหนี้ (4301020105.256) ที่ทำอยู่แล้ว
// ฝั่งกลับกัน inj ติดลบ = ใช้เงินเกินแผน → เป็นค่าใช้จ่าย ทำให้ NI ลดลง — ถูกหลักทั้งสองทิศทาง
// sc (optional) = สถานการณ์เสี่ยงสำหรับตาราง "ปัจจัยที่ทำให้ตกระดับ" — คนละช่องทางบัญชีกับ inj
//   {ap:d} ก่อหนี้ค้างจ่าย d บาท (ยังไม่จ่ายเงิน): หนี้สินหมุนเวียน +d · NI −d · เงินสดไม่ลด (ตัวส่วนโตขึ้น)
//   {ar:d} ลูกหนี้เก็บไม่ได้/ถูกตัดรายได้ d บาท: CA+สินทรัพย์เร็ว −d · NI −d · เงินสดไม่ลด
function exSimPath(h, inj, sc){
  const bs=h.bs;
  // 🔄 เงินโยกช่วยสุทธิ รวมเข้ากับ inj ตรงนี้ที่เดียว → ทุกคอลัมน์/Solver/เพดาน รับผลอัตโนมัติ
  //    ผู้รับ (net บวก) = ได้เงินอุดหนุน · ผู้ให้ (net ลบ) = จ่ายเงินอุดหนุนออก (กลไก drain เดิมรองรับสองทิศอยู่แล้ว)
  //    ⚠️ Solver (exSolveFor) จึงหา "เงินที่ยังต้องขอเพิ่มนอกเหนือจากที่โยกกันเองแล้ว" ซึ่งเป็นความหมายที่ต้องการ
  inj=(+inj||0)+exXferNet(h)+exRgIn(h);   // เงินเขตที่ได้รับจัดสรร = เงินอุดหนุน (เข้า NI เหมือนเงินสนับสนุน)
  let st={cca:bs.ca, ccl:bs.cl, cqn:bs.qn, ccn:bs.cn, ni:bs.ni, mo:bs.mo};
  // 🏦 หักเงินของเขตที่ฝากไว้ออกจากยอดตั้งต้น — ไม่ใช่เงินของ รพ. เอง
  //    ⛔ ห้ามรวมเข้า inj เพราะ inj เข้า NI ด้วย — การหักเงินฝากไม่ใช่ค่าใช้จ่าย ไม่ควรกด NI
  { const d=exRgDep(h); if(d>0){ st.cca-=d; st.cqn-=d; st.ccn-=d; } }
  // ── กลไกเงินสดไม่พอ ตามหลักเกณฑ์คงค้าง (CFO กำหนด 28 ก.ค. 69) ──────────────────
  // ยอดคงเหลือติดลบเป็นไปไม่ได้ทางบัญชี (เงินสดติดลบ = ไม่มีเงินจ่ายแต่ยังจ่าย) และ รพ. ต้อง
  // กันเงินสดไว้จ่าย "ค่าใช้จ่ายจำเป็น (MOE)" ของเดือนที่เหลือถึงสิ้นปีงบก่อนเสมอ
  // รายจ่ายที่จ่ายไม่ได้ → ค้างเป็นเจ้าหนี้ (หนี้สินหมุนเวียนโต) ไม่ใช่ปล่อยเงินสดติดลบ
  const moeMoV=exMoeMo(h);
  const clGrow=EXST.clGrow!==false;                 // ให้หนี้สินหมุนเวียนเดินตาม run-rate (ค่าเริ่มต้น: เปิด)
  const clMoV=clGrow?(+bs.clMo||0):0;
  const seas=EXST.seas!==false;                    // ปัจจัยฤดูกาลปลายปีงบ (ค่าเริ่มต้น: เปิด)
  const niYEV=(+bs.niYE||0)*exYeAdj(bs.mo), clYEV=clGrow?(+bs.clYE||+bs.clMo||0):0;
  // ── โปรไฟล์ NI รายเดือนจากงบทดลองจริง (เจ้าของงานสั่ง 12 ส.ค. 69) — แทน niYE ทั้งหมด ──
  //   niProf[0..11] = ส่วนต่าง NI ของเดือน ต.ค.→ก.ย. เทียบค่าเฉลี่ยทั้งปี (ผลรวม 12 เดือน = 0)
  //   ทำไมต้องมี: niM เป็น run-rate แบน (ยอดสะสม ÷ เดือนที่ผ่านมา) ซึ่งไม่ใช่ NI ของเดือนไหนเลย
  //     งวด 256910 ทั้งเขต run-rate = +202.7 ลบ./ด. แต่ ก.ค. จริง = −299.8 ลบ. (สลับทิศ 58/103 แห่ง)
  //     ของเดิม niYE แก้ให้เฉพาะ ด.10-12 ด้วย "ค่าเดียวใช้เหมือนกันทั้ง 3 เดือน" → ยอดสะสม ณ ก.ย.
  //     ถูก แต่เดือนกลางทางผิด และเดือนของปีงบถัดไป (เลือกเดือนเป้าได้ถึง 14 เดือน) ไม่ปรับเลย
  //     ทั้งที่ ต.ค. เป็นเดือนที่ NI สูงสุดของปีจริง (+866 ลบ. เหนือค่าเฉลี่ย) = คลาด 772.6 ลบ.
  //   ⚠️ ต้องหัก profOff ออกเสมอ เพราะ niM คิดจากยอดสะสมของ ด.1..mo ซึ่ง "ซึมซับ" ฤดูกาลของ
  //     เดือนที่ผ่านมาไปแล้ว — เป็นรูปทั่วไปของ exYeAdj เดิม และใช้ได้ข้ามรอยต่อปีงบด้วย
  //     (ต่างจาก exYeAdj ที่ตรึงตัวคูณของปีนี้ไปใช้กับปีหน้าด้วย = ทอนฤดูกาลปีหน้าผิด)
  const niProf=(Array.isArray(bs.niProf)&&bs.niProf.length===12)?bs.niProf:null;
  const profOff=niProf?niProf.slice(0,bs.mo).reduce((a,b)=>a+(+b||0),0)/Math.max(1,bs.mo):0;
  // ── โปรไฟล์ CL รายเดือน (เจ้าของงานสั่ง 12 ส.ค. 69) — เหตุผลเดียวกับ niProf ──────────
  //   NWC = CA − CL · ฝั่ง CA เดินตามกระแสเงินสด ส่วน CL เดินตาม clMo ที่เป็น "ค่าเฉลี่ยแบน"
  //   → NWC จึงแบนตาม CL เป็นข้อผิดเดียวกับที่ NI เคยเป็น (clYE = แพตช์บล็อก 3 เดือน เหมือน niYE)
  //   วัดจริงทั้งเขต: ธ.ค. +114 · พ.ค. −106 · มี.ค. −104 ลบ. = ไม่แบนเลย
  //   ⛔ NWC/CR/QR/Cash/SU ไม่มีการพยากรณ์ของตัวเอง — ทุกตัวเป็นผลลัพธ์ของ 2 ตัวขับนี้เท่านั้น
  //      (กระแสเงินสด → CA/QN/CN · clMo+clProf → CL) แก้ที่ตัวขับที่เดียว ทุกอัตราส่วนขยับตาม
  //   🪤 ตัวหักกันนับซ้ำของ CL ใช้ช่วงเดือน "ไม่เท่ากับ" ของ NI — พลาดตรงนี้แล้วโมเดลมองโลกสวยเกิน
  //      niM มาจากยอดสะสม ÷ mo = ครอบคลุมเดือน 1..mo ครบ → ตัวหักใช้ niProf[0..mo-1]
  //      clMo มาจาก (cl ณ ด.mo − cl ณ ด.1) ÷ (mo−1) = วัดจาก "ช่วงห่าง" = เดือน 2..mo เท่านั้น
  //      → ตัวหักต้องเป็น clProf[1..mo-1] ไม่ใช่ [0..mo-1] (ต่างกันจริง 13.6 ลบ./2 เดือน ที่งวด 256910)
  //      จับได้ด้วย test_exec_backtest: ใช้ช่วงผิดแล้ว "แย่ลง ณ ก.ย." ร่วงจาก 7 เหลือ 5 แห่ง
  const clProf=(Array.isArray(bs.clProf)&&bs.clProf.length===12)?bs.clProf:null;
  const clProfOff=(clProf&&bs.mo>1)?clProf.slice(1,bs.mo).reduce((a,b)=>a+(+b||0),0)/(bs.mo-1):0;
  // ── การเปลี่ยนแปลงเงินทุนหมุนเวียน (12 ส.ค. 69 · เจ้าของงานสั่ง) ─────────────────────
  // กรอบบัญชี: งบกระแสเงินสด **วิธีทางอ้อม** ที่สมบูรณ์ต้องมี 3 ส่วน
  //     กำไรสุทธิ
  //   + รายการที่ไม่ใช่เงินสด (ค่าเสื่อมราคา/ตัดจำหน่าย/หนี้สงสัยจะสูญ − รายได้รับบริจาคสินทรัพย์)
  //   ± การเปลี่ยนแปลงในสินทรัพย์และหนี้สินดำเนินงาน   ← **ของเดิมไม่มีบรรทัดนี้เลย**
  //   = เงินสดสุทธิจากกิจกรรมดำเนินงาน
  // ของเดิมบวกกำไรทั้งก้อนเข้าเงินสดตรง ๆ = สมมติว่าเรียกเก็บเป็นเงินสดได้ทันที 100%
  // ทั้งที่ลูกหนี้ + สินค้าคงเหลือ = 54% ของสินทรัพย์หมุนเวียนทั้งเขต (5,853 + 1,542 จาก 13,598 ลบ.)
  // ผลคือ CA/สินทรัพย์เร็ว/เงินสด ขยับเท่ากันเป๊ะ → ระยะห่าง CR–QR–Cash ไม่มีวันเปลี่ยน
  // และเงินสดถูกทำนายสูงเกินจริง (backtest ปี 68: +53.4%)
  const arProf=(Array.isArray(bs.arProf)&&bs.arProf.length===12)?bs.arProf:null;
  const invProf=(Array.isArray(bs.invProf)&&bs.invProf.length===12)?bs.invProf:null;
  // ตัวหักกันนับซ้ำใช้ช่วงเดือน 2..mo เหมือน clProf (ทั้งคู่วัดจาก "ผลต่างของยอดคงเหลือ" ไม่ใช่ยอดสะสม)
  const wcOff=a=>(a&&bs.mo>1)?a.slice(1,bs.mo).reduce((x,y)=>x+(+y||0),0)/(bs.mo-1):0;
  const arOff=wcOff(arProf), invOff=wcOff(invProf);
  let wcAR=0, wcINV=0;   // ยอดสะสมที่ย้ายเข้าลูกหนี้/สินค้าคงเหลือ (ใช้อธิบายในป็อปอัป)
  let owedAdd=0;                                    // เจ้าหนี้ที่เพิ่มจากการจ่ายไม่ได้ (แสดงในแผงเจาะเกณฑ์)
  // ── ตัวเลือก "MOE.Ver69 + จ่ายหนี้การค้า X%" (แบบ A ที่ CFO เลือก 6 ส.ค. 69) ──
  // ส่วนที่เลือกไม่จ่าย = ตั้งใจยืดเครดิตผู้ขาย (คนละเรื่องกับ owedAdd ที่เป็น "จ่ายไม่ได้เพราะเงินไม่มี")
  //   • ไม่มีเงินสดออก  → บวกกลับเข้ากระแสเงินสดรายเดือน (เหมือน depMo แต่เป็นหนี้ที่ยังไม่จ่าย)
  //   • ค่าใช้จ่ายยังอยู่ครบใน NI (exMoeAccMo) → NI/คะแนน ST-SU ไม่ดีขึ้นจากการยืดหนี้
  //   • เจ้าหนี้การค้าโตทุกเดือน → ตัวส่วนของ CR/QR/Cash ratio โตตาม = ต้นทุนของการยืดหนี้
  const stretchMo=exMoeStretchMo(h);
  let apStretch=0;                                  // ยอดเจ้าหนี้การค้าที่สะสมจากการยืด (ตลอดช่วงจำลอง)
  // ── เงินสำรอง MOE: กันตาม "รอบจ่ายจริง" แยกตามชนิดเจ้าหนี้ (CFO อนุมัติ 29 ก.ค. 69 · 3.13) ──
  //   = MOE ส่วนที่ยืดไม่ได้ (ค่าจ้าง/ค่าตอบแทน + สาธารณูปโภค) × MOE_MIN_MO เดือน
  //   + คชจ.บุคลากร/สาธารณูปโภค "ค้างจ่าย" ที่ครบกำหนดแล้ว (bs.apAccr) — ต้องจ่ายด้วยเงินสด
  // ⛔ ไม่กันเจ้าหนี้การค้า (bs.apTrade) ด้วยเหตุผล 2 ชั้น:
  //   ① ผู้ขายให้เครดิตอยู่จริง — วัดจากงบ 256909: รอบค้างมัธยฐาน 4.72 เดือน (ยา/เวชภัณฑ์/วัสดุ)
  //      ต่างกับ คชจ.ค้างจ่าย 1.84 เดือน · การบังคับให้กันเงินสดจ่ายค่ายา 3 เดือนล่วงหน้า
  //      ไม่ตรงวิธีจัดซื้อจริงของ รพ. เลย (ซื้อด้วยเครดิต ไม่ใช่เงินสด)
  //   ② จะนับซ้ำ — เจ้าหนี้การค้าเป็น "ตัวส่วน" ของ CR/QR/Cash ratio อยู่แล้ว ความเสี่ยงจากการ
  //      ค้างเจ้าหนี้ยาวจึงถูกลงโทษในคะแนนไปแล้ว ไม่ต้องลงโทษซ้ำผ่านเงินสำรอง
  // เดิม (29 ก.ค. เช้า) ใช้ moeMo ทั้งก้อน × 3 → ทั้งเขต 4,174 ลบ. · 29/103 แห่งใช้จ่ายอื่นได้ 0 บาท
  // ใหม่ → 1,560 ลบ. · เหลือ 4 แห่ง (เทิง · ทุ่งหัวช้าง · ขุนตาล · เวียงเชียงรุ้ง) = ชี้เป้าคมกว่า
  // ⚠️ ยังคงคงที่ ไม่ผูกปฏิทินปีงบ (เหตุผลเดียวกับ MOE_MIN_MO — ดู 3.6)
  const resCashV=exMoeCashMo(h), resAccrV=Math.max(0,bs.apAccr||0);
  const resNeedV=resCashV*MOE_MIN_MO+resAccrV;
  // ดึงเงินสดออก amt บาท · useRes=false → ห้ามแตะเงินสำรอง (รายจ่ายนอกแผน/ปัจจัยเสี่ยง)
  //                        useRes=true  → ใช้เงินสำรองได้ (การดำเนินงานปกติ ซึ่ง MOE อยู่ในนั้นเอง)
  const drain=(amt,useRes)=>{
    if(amt<=0) return;
    const avail=Math.max(0, st.ccn-(useRes?0:resNeedV));
    const paid=Math.max(0,Math.min(amt,avail));
    st.ccn-=paid; st.cca-=paid; st.cqn-=paid;
    const owe=amt-paid; st.ccl+=owe; owedAdd+=owe;   // ส่วนที่จ่ายไม่ได้ = เจ้าหนี้ค้างจ่าย
  };
  const resNeed0=resNeedV, cashAvail0=Math.max(0,bs.cn-resNeed0);

  st.ni+=inj;                                       // เงินอุดหนุน = รายได้ · ใช้เกินแผน = ค่าใช้จ่าย
  if(sc){
    if(sc.ap){ st.ccl+=sc.ap; st.ni-=sc.ap; owedAdd+=sc.ap; }    // ค่าใช้จ่ายค้างจ่าย → เจ้าหนี้เพิ่ม
    if(sc.ar){
      // ตัดลูกหนี้/รายได้ที่ตั้งไว้แต่เก็บไม่ได้ — ตัดได้ไม่เกินยอดลูกหนี้ที่มีจริง
      // (สินทรัพย์เร็ว − เงินสด) · ส่วนที่เกินยอดลูกหนี้ถือเป็นรายได้เงินสดที่ไม่เข้า → เข้ากลไก drain
      const arAvail=Math.max(0, st.cqn-st.ccn);
      const cut=Math.min(sc.ar, arAvail);
      st.cca-=cut; st.cqn-=cut; st.ni-=sc.ar;
      if(sc.ar>cut) drain(sc.ar-cut, false);
    }
  }
  if(EXST.tj.mode!=='off'){
    if(EXTJ.debtors.has(h.hcode)){
      const D=h.tj.payIn;
      if(EXST.tj.mode==='pay'){ st.cca-=D; st.cqn-=D; st.ccn-=D; st.ccl=Math.max(0,st.ccl-D); }
      else if(EXST.tj.mode==='smart'){ const R=(EXTJ.refund&&EXTJ.refund[h.hcode])||0; st.cca-=(D-R); st.cqn-=(D-R); st.ccn-=(D-R); st.ccl=Math.max(0,st.ccl-D); st.ni+=R; }  // จ่าย D ก่อน แล้วคืน R (ยกหนี้บางส่วน): R=D เท่ายกหนี้เต็ม, R=0 เท่าจ่ายจริง
      else { st.ccl=Math.max(0,st.ccl-D); st.ni+=D; }   // ยกหนี้ = รายได้ (4301020105.256) เข้า NI ตามบัญชีจริง
    }
    const S=EXTJ.shares[h.hcode]||0;
    if(S>0){
      if(EXST.tj.mode==='pay'||EXST.tj.mode==='smart'){ st.ccn+=S; }   // เจ้าหนี้ได้รับชำระเป็นเงินสด (smart: เงินคืนลูกหนี้มาจากเขต ไม่ดึงคืนจากเจ้าหนี้)
      else { st.cca-=S; st.cqn-=S; st.ni-=S; }          // ยกหนี้ = ตัดลูกหนี้ + คชจ.อุดหนุน (5107) เข้า NI

  // Option ตามจ่าย/ยกหนี้ด้านบนอาจดันเงินสดต่ำกว่า 0 ได้ (กรณี "จ่ายจริง" ที่เงินไม่พอ)
  // → ย้ายส่วนที่จ่ายไม่ได้กลับเป็นเจ้าหนี้ ด้วยหลักเดียวกัน (ไม่ปล่อยยอดติดลบ)
  if(st.ccn<0){ const d=-st.ccn; st.ccn=0; st.cca+=d; st.cqn+=d; st.ccl+=d; owedAdd+=d; }

  // ⚠️ ต้องบวกที่ niM ตัวเดียวตรงนี้ เพื่อให้ไปถึงทั้ง 2 ทาง: ① NI สะสม (st.ni += niM) ② กระแสเงินสด
  //    (c = niM + non-cash) — ถ้าไปแก้ที่ st.ni ตรง ๆ เงินสดจะไม่ขยับ = ไม่ใช่กำไรจริง
  // ⚠️ ต่างจาก inj ที่เป็นก้อนเดียวเดือน 0 อย่างสำคัญ: dni เข้าทุกเดือน จึง **ข้ามรอยต่อปีงบได้**
  //    (NI สะสมรีเซ็ต 1 ต.ค. ทำให้เงินก้อนปีนี้ไม่มีผลกับ NI ปีหน้า แต่กำไรรายเดือนมีผล)
  const niM=exNiMo(h)+((sc&&+sc.dni)||0), depMo=bs.depMo, donMo=bs.donMo||0;
  // ⚠️ scoreOf คืน null เมื่อ cl=0 (ตัวส่วนของทุก ratio) — ไม่ใส่ตัวกันแล้ว .risk จะ throw
  //    ทำให้ทั้งแท็บ #exec ว่างเปล่า ไม่ใช่แค่แถวเดียวหาย · เกิดได้จริงเวลางวดสดมาไม่ครบ
  //    (ดู reference: งวดล่าสุดใน mdb แถวน้อยกว่าปกติ ~22% เป็นเรื่องปกติของ HFO)
  //    ไม่มี base → anchor ไม่ได้ ให้ถอยไปใช้คะแนนดิบตรง ๆ แทนการล้มทั้งหน้า
  const base0=scoreOf(bs.ca,bs.cl,bs.qn,bs.cn,bs.ni,bs.mo);
  const base=base0?base0.risk:(h.risk!=null?h.risk:0);
  const anc=v=>Math.max(0,Math.min(7,(h.risk!=null?h.risk:0)+(v-base)));
  // ── เดือนที่ใช้ "ตัดสินระดับวิกฤต" = เดือนที่เลือกในตัวกรอง 🗓️ (เจ้าของงานสั่ง 11 ส.ค. 69) ──────
  // เดิมตรึงไว้ที่สิ้นปีงบ (ก.ย.) เสมอ → คอลัมน์ระดับ/เงินสนับสนุนไม่ขยับตามตัวกรองที่ผู้ใช้เลือก
  // ตอนนี้ผูกกับ exMoeMonths() ตัวเดียวกับคอลัมน์ "เงินสดคงเหลือหลังภาระ MOE / ส่วนขาด"
  // → ทั้งครึ่งขวาของตารางประเมิน ณ เดือนเดียวกันหมด (ค่าเริ่มต้น = สิ้นปีงบ ผลจึงเท่าเดิม)
  // ⚠️ horMo (ช่วงจำลอง ext) กับ tgtMo (เดือนเป้า) แยกกันโดยตั้งใจ — จำลองถึงเดือนที่ไกลกว่าเสมอ
  //    แต่ endRisk ยังหมายถึง "ปลายช่วงจำลอง" เท่าเดิม ไม่ใช่เดือนเป้า
  // ⭐ 11 ส.ค. 69 (รอบ 2): รวม dropdown "ช่วงจำลอง (ext)" เข้ากับ "เดือนเป้า" เป็นตัวเลือกเดียว
  //    ตามที่เจ้าของงานสั่ง โดย **คงการคุมสิ้นปีงบไว้เป็นพื้นเสมอ** (เจ้าของงานเคาะ)

  //    ⛔ ห้ามเปลี่ยนเป็นเช็คจุดเดียวตามเดือนที่เลือก — วัดแล้วเงินสนับสนุนหายไป 10–21 ลบ.
  //       และ รพ. หลุดจากรายชื่อ 3–4 แห่ง (เกาะคา/ดอยเต่า เหลือ 0) เพราะปัญหาของเขาอยู่ที่สิ้นปีงบ
  //       ไม่ใช่เดือนที่เลือก = โมเดลมองโลกสวยขึ้น ซึ่งเป็นทิศที่ห้าม
  const fyMo=12-bs.mo;              // สิ้นปีงบ = พื้นที่ต้องคุมเสมอ (แทน horMo เดิมที่ผูกกับ ext)
  const tgtMo=exMoeMonths();        // เดือนเป้าจากตัวกรองเดียวที่เหลืออยู่
  const months=Math.max(fyMo,tgtMo);
  let sc0=scoreOf(st.cca,Math.max(st.ccl,1),st.cqn,st.ccn,st.ni,st.mo);
  let r=anc(sc0.risk);
  let sepRisk=(tgtMo<=0?r:null), endRisk=r, cashOut=st.ccn<=0?0:null;
  // sepBreak = เกณฑ์ย่อย (cr/qr/cash/nwc/ni/li/st/su) ณ เดือนเป้า — ใช้กางแผงเจาะเกณฑ์ 7 คะแนน (exBrkHtml)
  // ⭐ 11 ส.ค. 69: แนบ "ตัวเลขดิบ" ที่ใช้คำนวณมาด้วย (ca/cl/qn/cn/owed) เพื่อให้ป็อปอัปพิสูจน์ที่มา
  //    ของเงินก้อนได้ทีละบรรทัด — ถ้ามีแต่ค่า ratio จะกางสมการย้อนกลับไม่ได้
  const brk=(sc,niV,moV)=>({...sc,ni:niV,mo:moV,ca:st.cca,cl:st.ccl,qn:st.cqn,cn:st.ccn,owed:owedAdd});
  let sepBreak=(tgtMo<=0?brk(sc0,st.ni,st.mo):null);
  for(let k=1;k<=months;k++){
    if(st.mo>=12){st.mo=1; st.ni=0;} else st.mo++;
    st.ni+=niM;
    // กระแสเงินสดของเดือน = NI + รายการไม่ใช่เงินสดฝั่งค่าใช้จ่าย − รายการไม่ใช่เงินสดฝั่งรายได้
    //   +depMo  ค่าเสื่อม/ตัดจำหน่าย/หนี้สูญ — หักใน NI แต่ไม่มีเงินออก จึงบวกกลับ
    //   −donMo  รับบริจาค "สินทรัพย์" — บวกใน NI แต่ไม่มีเงินเข้า จึงหักออก (CFO 29 ก.ค. 69 · 3.10)
    //           NI/คะแนน ST-SU ยังนับรายการนี้ตามบัญชี ที่ตัดออกคือ "เงินสด" อย่างเดียว
    //   +stretchMo ส่วนของ MOE ที่เลือกยืดเป็นเจ้าหนี้การค้า — หักใน NI แต่ไม่มีเงินออกเดือนนี้
    const c=niM+depMo-donMo+stretchMo;
    // ขาดดุลรายเดือนใช้เงินสำรองได้ (เป็นการดำเนินงานปกติที่เงินสำรองมีไว้เพื่อสิ่งนี้)
    // แต่ยังห้ามเงินสดติดลบ — ส่วนที่จ่ายไม่ได้ค้างเป็นเจ้าหนี้
    if(c>=0){ st.cca+=c; st.cqn+=c; st.ccn+=c; } else drain(-c,true);
    // ── บรรทัด "การเปลี่ยนแปลงในสินทรัพย์ดำเนินงาน" ของงบกระแสเงินสดวิธีทางอ้อม ──────────
    // เป็นการ **จัดประเภทใหม่ภายในสินทรัพย์หมุนเวียน** ไม่ได้เปลี่ยนยอด CA รวม
    //   ลูกหนี้เพิ่ม     → เงินสดลด (ขายเชื่อ ยังไม่ได้รับเงิน) · สินทรัพย์เร็วเท่าเดิม (ลูกหนี้อยู่ใน 1002X)
    //   สินค้าคงเหลือเพิ่ม → เงินสดลด และสินทรัพย์เร็วลด (สินค้าคงเหลือไม่อยู่ใน 1002X)
    // → CR ไม่ขยับ · QR ขยับตามสินค้าคงเหลือ · Cash ratio ขยับตามทั้งสอง = ระยะห่างสามตัวเปลี่ยนได้จริง
    // ⚠️ ดูดเกินเงินสดที่มีไม่ได้ (จะให้เครดิตลูกค้าเกินกว่าเงินที่มีไม่ได้) → เกลี่ยตามสัดส่วน
    if(seas&&(arProf||invProf)){
      let sAR=arProf?((+arProf[st.mo-1]||0)-arOff):0, sINV=invProf?((+invProf[st.mo-1]||0)-invOff):0;
      // 🚨 เพดาน 2 ทาง — ไม่ใส่แล้วได้ QR > CR ซึ่ง**เป็นไปไม่ได้ทางบัญชี**
      //   (สินทรัพย์เร็ว ⊆ สินทรัพย์หมุนเวียน เสมอ) เจอจริงตอนเทสต์: ฮอด QR 1.142 > CR 1.075
      //   ขาขึ้น: ดูดเป็นลูกหนี้/สินค้าคงเหลือเกิน "เงินสดที่มี" ไม่ได้
      //   ขาลง: ปล่อยลูกหนี้/สินค้าคงเหลือคืนเป็นเงินสด เกิน "ยอดที่มีอยู่จริง" ไม่ได้
      //         สินค้าคงเหลือคงเหลือ = cca − cqn · ลูกหนี้คงเหลือ = cqn − ccn
      const invOn=Math.max(0,st.cca-st.cqn), arOn=Math.max(0,st.cqn-st.ccn);
      if(sINV<-invOn) sINV=-invOn;
      if(sAR<-arOn)  sAR=-arOn;
      const tot=sAR+sINV;
      if(tot>0&&tot>st.ccn){ const k=Math.max(0,st.ccn)/tot; sAR*=k; sINV*=k; }
      st.ccn-=sAR+sINV; st.cqn-=sINV;
      wcAR+=sAR; wcINV+=sINV;
    }
    if(stretchMo>0){ st.ccl+=stretchMo; apStretch+=stretchMo; }   // หนี้ที่ยืดไว้กองขึ้นเป็นเจ้าหนี้การค้า
    // ══ ปัจจัยฤดูกาลปลายปีงบ (เจ้าของงานเคาะ 6 ส.ค. 69 หลัง backtest) ══════════════════
    // ⚠️ โมเดลเดิมตรึง CL คงที่ + ลาก NI ต้นปีต่อไปดื้อ ๆ → ทำนายผิดทิศชัดเจน:
    //    ของจริง ด.9→ด.12  ปี67 แย่ลง 33 แห่ง · ปี68 แย่ลง 65 แห่ง
    //    โมเดลเดิม         แย่ลง 0 แห่ง (ดีขึ้นอย่างเดียว)
    // สาเหตุหลัก: NI ไตรมาสสุดท้ายพลิกลบหนักทุกปีจากการปิดบัญชีปลายปี
    //    (ตั้งค่าใช้จ่ายค้างจ่าย · ตัดลูกหนี้ · ค่าเสื่อมงวดสุดท้าย)
    //    ปี67 −328 · ปี68 −843 ลบ./ด. ทั้งเขต  แต่โมเดลใช้ +259 ต่อไป
    // ทั้ง niYE และ clYE วัดจากข้อมูลจริงรายแห่ง (เฉลี่ยปี 67+68) ใน export_exec.py
    //    ⛔ ห้ามให้ niYE ไปลดเงินสดด้วย — รายการปิดบัญชีส่วนใหญ่เป็นเกณฑ์คงค้าง ไม่ใช่เงินสดออก
    //       ผลต่องบดุลวัดแยกที่ clYE ซึ่งเก็บจากข้อมูลจริงเช่นกัน จึงไม่นับซ้ำกัน
    const isYE=(st.mo>=10);                       // ก.ค.-ก.ย. = ช่วงปิดบัญชีปลายปีงบ (ยังใช้กับ clYE)
    // NI ตามฤดูกาลจริงรายเดือน (ไม่แตะเงินสด) — มีโปรไฟล์ใช้โปรไฟล์ ไม่มีค่อยถอยไปใช้ niYE เดิม
    if(seas) st.ni+=niProf?(+niProf[st.mo-1]||0)-profOff:(isYE?niYEV:0);
    // CL: มีโปรไฟล์ → ฐาน clMo + ทิศทางของเดือนนั้น · ไม่มี → ถอยไปพฤติกรรมเดิม (clYE แทน clMo)
    if(clGrow){
      let clAdd=clMoV;
      if(seas) clAdd=clProf?clMoV+((+clProf[st.mo-1]||0)-clProfOff):(isYE?clYEV:clMoV);
      st.ccl=Math.max(1, st.ccl+clAdd);
    }
    const sc=scoreOf(st.cca,Math.max(st.ccl,1),st.cqn,st.ccn,st.ni,st.mo);
    r=anc(sc.risk);
    if(k===tgtMo){ sepRisk=r; sepBreak=brk(sc,st.ni,st.mo); }   // เดือนเป้าที่เลือกในตัวกรอง (เดือนเดียว ไม่ใช่ "ก.ย. แรกที่เจอ")
    if(st.ccn<=0 && cashOut==null) cashOut=k;
    if(k<=fyMo) endRisk=r;   // endRisk = ระดับ ณ "สิ้นปีงบ" (พื้นที่คุมเสมอ) — ถ้าเดือนเป้าไกลกว่า ห้ามเลื่อนตาม
  }
  return {sepRisk,endRisk,cashOut,niM,wcAR,wcINV,rgDep:exRgDep(h),rgIn:exRgIn(h),revMo:exRevMo(h),moeMo:moeMoV,moeAccMo:exMoeAccMo(h),
          stretchMo,apStretch,xmoeMo:exXmoeOn()?exXmoeMo(h):0,sepBreak,
          owedAdd,resNeed0,resCash:resCashV,resAccr:resAccrV,cashAvail0,cnEnd:st.ccn,clEnd:st.ccl};
}
// ── Solver: เงินก้อนขั้นต่ำ (เดือน 0) ให้ ระดับ ณ ก.ย.≤เป้า และปลาย horizon≤เป้า และเงินสดไม่หมด ──
function exSolve(h){ return exSolveFor(h, EXST.tgt); }
// เป้าระดับ L ใดก็ได้ (แผงเจาะเกณฑ์รายแห่งใช้เลือกดูระดับอื่น) — ตรรกะเดิมของ exSolve ทั้งหมด
function exSolveFor(h, L){
  const pass=v=>{ const r=exSimPath(h,v); return (r.sepRisk==null||r.sepRisk<=L)&&r.endRisk<=L&&r.cashOut==null; };
  if(pass(0)) return 0;
  const HI=Math.max(2*h.bs.cl, 400e6);
  if(!pass(HI)) return null;
  let lo=0, hi=HI;
  while(hi-lo>SV_STEP){
    const mid=Math.round((lo+hi)/2/SV_STEP)*SV_STEP;
    if(mid<=lo||mid>=hi) break;
    if(pass(mid)) hi=mid; else lo=mid;
  }
  return hi;
}
// ── เงินสนับสนุนขั้นต่ำที่ทำให้ "เกณฑ์รายตัว" ผ่าน ณ เดือนเป้า (เจ้าของงานสั่ง 11 ส.ค. 69) ─────
// ต่างจากคอลัมน์ "เงินสนับสนุนที่ต้องใช้" (exSolveFor) ที่เล็ง "ระดับรวม ≤ เป้า" —
// ชุดนี้ตอบว่าแต่ละเกณฑ์ใน 7 คะแนนต้องใช้เงินเท่าไหร่ถึงจะผ่านทีละตัว = เกณฑ์ไหนเป็น "ตัวคุม" ที่แพงสุด
// ⛔ ห้ามบวก 6 คอลัมน์รวมกัน — เงินก้อนเดียวรับรู้เป็นรายได้เงินอุดหนุน ดัน CA/สินทรัพย์เร็ว/เงินสด/NWC/NI
//    ขึ้นพร้อมกันเท่ากันหมด ยอดจริงที่ต้องใช้ ≈ ค่าที่ "มากที่สุด" ของเกณฑ์ที่ต้องแก้ ไม่ใช่ผลบวก
//    (จึงเป็นเหตุให้ CR = NWC + 0.5×CL เสมอ — CR แพงกว่า NWC อยู่ครึ่งหนึ่งของหนี้สินหมุนเวียนตายตัว)
// ⚠️ เดินด้วย Solver จริงบน exSimPath (เจ้าของงานเลือก 11 ส.ค. 69) ไม่ใช่สูตรปิดจากงบงวดล่าสุด
//    จึงนับผลของเจ้าหนี้ค้างจ่ายที่จะก่อขึ้นระหว่างทาง + หนี้สินหมุนเวียนที่เดินตาม run-rate ครบ
// ⚠️ เกณฑ์ผ่านใช้ ok() ชุดเดียวกับแผงเจาะเกณฑ์ 7 คะแนน (EX_CRIT) ไม่ใช่ค่าที่ปัด 2 ตำแหน่งใน scoreOf
//    เพื่อให้เซลล์นี้ไม่ขัดกับเครื่องหมาย ✓/✗ ที่ผู้ใช้เห็นในแผงเดียวกัน (ต่างกันไม่เกิน 0.005×CL)
// (นิยาม EX_NEEDC อยู่เหนือ EX_SORT_GETTERS เพราะ getter ชุดนั้นวนสร้างคีย์จากมันตอน eval)
// cache ผูกกับ "สถานะที่มีผลต่อ exSimPath ทั้งชุด" — 6 เกณฑ์ × 103 แห่ง คือ Solver 618 ตัวต่อการเรนเดอร์
// ถ้าไม่แคช การคลิกเรียงลำดับ/กางแถวจะคำนวณใหม่ทั้งหมดทุกครั้ง
// ⚠️ ตัดคีย์ที่เป็นมุมมองล้วน (ตัวกรอง/ย่อคอลัมน์/ลำดับ) ออกจาก signature — ไม่กระทบตัวเลขรายแห่ง
//    ถ้าเอาเข้าไปด้วย แค่เปลี่ยนจังหวัดที่กรองก็ทิ้งแคชทั้งก้อนทั้งที่ผลไม่เปลี่ยน
let _exCritCache={sig:null,map:null};
function exCritCache(){
  const {prov,types,crisis,wide,provSort,open,...rest}=EXST;
  const sig=JSON.stringify([EX&&EX.period,rest]);
  if(_exCritCache.sig!==sig||!_exCritCache.map) _exCritCache={sig,map:{}};
  return _exCritCache.map;
}
function exSolveCrit(h, c, r0){
  const mp=exCritCache(), key=h.hcode+'|'+c.k;
  if(key in mp) return mp[key];
  const b0=(r0||exSimPath(h,0)).sepBreak;
  let out;
  if(!b0) out=null;                       // งวดนี้ไม่มีค่าดิบงบดุล จำลองไม่ได้
  else if(c.ok(b0,b0)) out=0;             // ผ่านอยู่แล้ว ณ เดือนเป้า (SU: su=0 เข้าเงื่อนไขนี้เพราะ su<=-1 เป็นเท็จ → ดักด้านล่าง)
  else if(c.k==='su'&&b0.su===0) out=0;
  else {
    const pass=v=>{ const b=exSimPath(h,v).sepBreak; return !!b&&c.ok(b,b0); };
    const HI=Math.max(2*h.bs.cl, 400e6);
    if(!pass(HI)) out=null;                // เงินก้อนอย่างเดียวไม่พอ (เกณฑ์นี้ต้องแก้ NI/รายรับร่วม)
    else { let lo=0, hi=HI;
      while(hi-lo>SV_STEP){
        const mid=Math.round((lo+hi)/2/SV_STEP)*SV_STEP;
        if(mid<=lo||mid>=hi) break;
        if(pass(mid)) hi=mid; else lo=mid;
      }
      out=hi; }
  }
  mp[key]=out; return out;
}
// ── ทางเลือกแทนเงินก้อน: "กำไรต่อเดือนขั้นต่ำ" ที่ทำให้เกณฑ์นั้นผ่าน ณ เดือนเป้า ─────────────
// เจ้าของงานสั่ง 11 ส.ค. 69: ทุกช่องต้องตอบว่า "เติมเงินหรือดำเนินการอย่างไร" ไม่ใช่เงินก้อนอย่างเดียว
// ⭐ ตัวนี้แก้ได้ในเคสที่เงินก้อนแก้ไม่ได้ด้วย — เกณฑ์ NI เมื่อเดือนเป้าอยู่ปีงบถัดไป
//    (NI สะสมรีเซ็ต 1 ต.ค. เงินก้อนปีนี้จึงหายไปจาก NI ปีหน้า แต่กำไรรายเดือนเข้าทุกเดือน)
// ⚠️ ไม่ใช่ "ต้องทำทั้งสองทาง" — เป็นทางเลือก อ่านว่า "เติมเงิน X ครั้งเดียว หรือ ทำกำไรเพิ่ม Y ทุกเดือน"
function exSolveCritNi(h, c, r0){
  const mp=exCritCache(), key=h.hcode+'|'+c.k+'|dni';
  if(key in mp) return mp[key];
  const b0=(r0||exSimPath(h,0)).sepBreak;
  let out;
  if(!b0) out=null;
  else if(c.ok(b0,b0)||(c.k==='su'&&b0.su===0)) out=0;
  else {
    const pass=d=>{ const b=exSimPath(h,0,{dni:d}).sepBreak; return !!b&&c.ok(b,b0); };
    const HI=Math.max(2*h.bs.cl, 400e6);
    if(!pass(HI)) out=null;
    else { let lo=0, hi=HI;
      while(hi-lo>SV_STEP){
        const mid=Math.round((lo+hi)/2/SV_STEP)*SV_STEP;
        if(mid<=lo||mid>=hi) break;
        if(pass(mid)) hi=mid; else lo=mid;
      }
      out=hi; }
  }
  mp[key]=out; return out;
}
// ระดับวิกฤต ณ เดือนเป้า ถ้า "ทำเฉพาะข้อนี้" — ใช้ตอบว่าลงทุนทางนี้แล้วระดับขยับจริงไหม
// (แคชรวมกับชุดเดิม เพราะขึ้นกับสถานะชุดเดียวกัน)
function exCritLevel(h, c, v, dni){
  const mp=exCritCache(), key=h.hcode+'|'+c.k+'|lv'+(dni?'d':'m');
  if(key in mp) return mp[key];
  let out=null;
  if(dni!=null&&dni>0) out=exSimPath(h,0,{dni}).sepRisk;
  else if(v!=null&&v>0) out=exSimPath(h,v).sepRisk;
  mp[key]=out; return out;
}
function exInjOf(h, need){ const m=EXST.inj[h.hcode]; return m!=null?m:(need!=null?need:0); }
// ── ฝั่งขาลง: เป้าสูงกว่าระดับที่จะเป็นอยู่แล้ว = "เพดาน" ไม่ใช่แผนเติมเงิน ──
// หาขนาดปัจจัยเสี่ยงน้อยสุดที่จะทำให้ระดับ ณ ก.ย. ตกถึง L — คืน null = ไม่ตกถึงระดับนั้นแม้สุดขีด
// ch = ช่องทางบัญชีของปัจจัย: 'cash' (จ่ายเงินสด/เงินไม่เข้า · ค่าเริ่มต้น) · 'ap' (ก่อหนี้ค้างจ่าย) · 'ar' (ลูกหนี้เก็บไม่ได้)
// แนวคิดเดียวกับ svSolveDown ของ Simulator เดิม
function exSolveDown(h, L, ch){
  const sim=d=>ch==='ap'?exSimPath(h,0,{ap:d}):ch==='ar'?exSimPath(h,0,{ar:d}):exSimPath(h,-d);
  const hit=d=>{ const r=sim(d); return r.sepRisk!=null && r.sepRisk>=L; };
  if(hit(0)) return 0;
  const HI=Math.max(4*h.bs.cl, 1000e6);
  if(!hit(HI)) return null;
  let lo=0, hi=HI;
  while(hi-lo>SV_STEP){
    const mid=Math.round((lo+hi)/2/SV_STEP)*SV_STEP;
    if(mid<=lo||mid>=hi) break;
    if(hit(mid)) hi=mid; else lo=mid;
  }
  return hi;
}

    // ⛔ ค่าที่แปลงเป็นตัวเลขไม่ได้ = ไม่แตะค่าเดิม (ล้างค่าต้องพิมพ์ช่องว่างเท่านั้น ซึ่งชัดเจนกว่า)
    const n=Number(s.replace(/,/g,''));            // ยอมให้พิมพ์ 1,234.5 ได้

      ${warnAt<cap?` · <span class="tgt-warn">⚠️ ให้เกิน ${fmtM(warnAt)} ระดับจะเกิน ${EX_XF_WARN}</span>`:''}

function exXfSubmit(hc, fill){
  const h=EX.hosp.find(p=>p.hcode===hc); if(!h) return;
  const sel=document.getElementById('xfT_'+hc), inp=document.getElementById('xfA_'+hc);
  const t=sel&&sel.value; if(!t) return;
  const cap=exXferCap(h);
  const tp=EX.hosp.find(p=>p.hcode===t);
  const gap=tp?-exMoeLeft({h:tp,r0:exSimPath(tp,0)}):0;
  let a=fill?Math.min(cap,Math.max(0,gap)):Math.round((+(inp&&inp.value)||0)*1e6);
  if(!(a>0)) a=Math.min(cap,Math.max(0,gap));      // เว้นว่าง = เติมเต็มส่วนขาด (ไม่เกินเพดาน)
  a=Math.min(a,cap);                                // ⛔ กันเกินเพดานเสมอ แม้ผู้ใช้พิมพ์เกิน
  if(a>0) exXferAdd(hc,t,a); else exRender();
}

  {g:'LI',n:'QR',d:'สินทรัพย์เร็ว (ไม่รวมสินค้าคงเหลือ) ÷ หนี้สินหมุนเวียน',th:'≥ 1.00',v:b=>b.qr,f:fmtR,ok:b=>b.qr>=1.0},
  {g:'LI',n:'Cash ratio',d:'เงินสด+เทียบเท่า ÷ หนี้สินหมุนเวียน',th:'≥ 0.80',v:b=>b.cash,f:fmtR,ok:b=>b.cash>=0.8},
  {g:'ST',n:'NWC',d:'สินทรัพย์หมุนเวียน − หนี้สินหมุนเวียน',th:'≥ 0',v:b=>b.nwc,f:fmtM,ok:b=>b.nwc>=0},
  {g:'ST',n:'NI',d:'กำไร/ขาดทุนสุทธิสะสมทั้งปีงบ (มีค่าเสื่อม)',th:'≥ 0',v:b=>b.ni,f:fmtM,ok:b=>b.ni>=0},
];
// เดือนอยู่รอด/ฟื้นตัวของ SU (ตามสูตร 4-quadrant ใน scoreOf) — คืน null เมื่อ NWC/NI เป็นบวกทั้งคู่
function exSuMonths(b){
  const m=b.mo>0?b.mo:12, np=b.nwc>=0, ip=b.ni>=0;
  if(np&&ip) return null;
  if(!np&&!ip) return null;
  if(np&&!ip){ const a=Math.abs(b.ni)/m; return {lbl:'เดือนที่ NWC จะหมด',v:a?b.nwc/a:null}; }
  const a=b.ni/m; return {lbl:'เดือนที่กำไรดัน NWC กลับเป็นบวก',v:a?(-b.nwc)/a:null};
}

  const ratioNote=(b1&&injL>0)?`<div class="note" style="margin-top:4px">🧮 <b>ทำไม CR/QR/Cash ขยับเท่ากันทั้งสามตัว:</b> เงินก้อน ${fmtM(injL)} บวกเข้าทั้งสามตัวเศษ (สินทรัพย์หมุนเวียน · สินทรัพย์เร็ว · เงินสด) พร้อมกัน โดยตัวส่วนคือหนี้สินหมุนเวียน ${fmtM(bs.cl)} เท่าเดิม → ทั้งสามเพิ่มขึ้น <b>+${(injL/bs.cl).toFixed(4)}</b> เท่ากันเป๊ะ (= ${fmtM(injL)} ÷ ${fmtM(bs.cl)}) · ค่าในตารางปัด 2 ตำแหน่งจึงอาจอ่านได้ต่างกัน 0.01 — เลข Δ ที่แสดงคิดจากค่าจริงก่อนปัด · <b>NWC และ NI เพิ่มขึ้นเท่าเงินก้อนพอดี</b> เพราะรับรู้เงินสนับสนุนเป็น<b>รายได้เงินอุดหนุนจากหน่วยงานภาครัฐ</b> ตามผัง MOPH (หลักเดียวกับ Option ยกหนี้)</div>`:'';
  const anchorNote=(h.risk!==rawN)?`<div class="note" style="margin-top:4px">📎 badge ปัจจุบันแสดง ${h.risk} ขณะที่ผลรวมเกณฑ์จากงบทดลองคำนวณได้ ${rawN} — ระบบยึดคะแนนงวด ${nowLab} (${srcLab}) เป็นจุดตั้งต้น (anchor) แล้วบวก/ลบส่วนต่างที่จำลองได้ ตัวเลขในคอลัมน์จำลองจึงอ่านเป็น "ทิศทางการเปลี่ยนแปลง" เทียบกับ badge</div>`:'';
  // ── ตาราง "ปัจจัยที่จะทำให้ตกระดับ" — ทุกระดับที่แย่กว่าระดับที่จะเป็น (sep0+1 … 7) × 3 ช่องทางบัญชี ──
  // ตอบคำถาม: ใช้เงินเพิ่มกี่บาท / รายได้ลดกี่บาท / ทั้งสองปัจจัยรวมกันเท่าไหร่ ถึงจะตกไปแต่ละระดับ
  // 3 ช่องทางให้ตัวเลขต่างกันจริงเพราะกระทบ ratio ต่างจุด (เงินสดลด vs ตัวส่วนโต vs สินทรัพย์เร็วลด)
  const riskTbl=(sep0!=null&&sep0<7)?(()=>{

    const cell=v=>v==null?'<span class="tgt-note">ไม่ตกถึงระดับนี้</span>'

    return `<div class="tgt-row" style="font-weight:600;margin-top:6px">⚠️ ปัจจัยที่จะทำให้ตกไประดับแย่กว่านี้ (ภายใน ${sepLab})</div>

            <th>② ค่าใช้จ่ายเพิ่ม<br><span class="tgt-note">แบบก่อหนี้ค้างจ่าย</span></th>
            <th>③ รายได้หาย<br><span class="tgt-note">แบบตัดลูกหนี้ที่เก็บไม่ได้</span></th>
            <th>เจ้าหนี้ที่จะเพิ่ม<br><span class="tgt-note">(กรณี ① ส่วนที่จ่ายไม่ได้)</span></th>
            <th>เกณฑ์ที่จะพลิก<br><span class="tgt-note">(กรณี ①)</span></th></tr>
          ${lv.map(x=>`<tr><td class="l"><span class="badge" style="background:${riskColor(x.L)}">${x.L}</span></td>
            <td>${cell(x.dc)}</td><td>${cell(x.da)}</td><td>${cell(x.dr)}</td>
            <td>${x.owed==null?'<span class="tgt-note">–</span>':(x.owed>0?'<span class="brk-no">'+fmtM(x.owed)+'</span>':'<span class="tgt-note">จ่ายสดได้ทั้งหมด</span>')}</td>
            <td class="l">${x.flip.length?'<span class="brk-no">'+x.flip.join(' · ')+'</span>':'<span class="tgt-note">–</span>'}</td></tr>`).join('')}
        </table>
      </div>

        const same=lv.every(x=>x.dc===x.da&&x.da===x.dr);
        const f=lv[0];
        const mix=f.dc!=null?`เช่น ตกระดับ ${f.L} ที่ ${fmtM(f.dc)} — จ่ายเกินเป้า ${fmtM(Math.round(f.dc*0.6/SV_STEP)*SV_STEP)} <b>บวก</b> รายได้ไม่เข้า ${fmtM(f.dc-Math.round(f.dc*0.6/SV_STEP)*SV_STEP)} ก็ตกเท่ากัน`:'';
        return `<div class="note">📐 <b>ถ้าเกิดหลายปัจจัยพร้อมกัน</b> ให้รวมยอดเทียบกับคอลัมน์ที่ตรงกับช่องทางนั้น ${mix} (ทั้งสองลดเงินสดและกำไรเท่ากัน จึงบวกกันได้ตรงๆ)

  })():'';
  // อธิบายกลไกเงินสดไม่พอ → เจ้าหนี้ (แสดงเมื่อมีการค้างจ่ายเกิดขึ้นจริงในสถานการณ์ที่กำลังดู)
  const cashNote=(()=>{

  // ต่างจากปัจจัยเสี่ยงอื่นในตารางข้างบน: อันนั้นถามว่า "ต้องเกิดเท่าไหร่จึงตกระดับ" (สมมติขึ้น)
  // อันนี้เป็น "ปัจจัยที่มีขนาดจริงวัดได้จากงบทดลอง" — เงินที่ สสจ./รพ. อื่นโอนมาให้ ซึ่ง baseline
  // สมมติว่าจะโอนต่อในอัตราเดิมถึงสิ้นปีงบ · ถ้าหยุด NI/สภาพคล่องหายไปทันที
  // trf.op = 4313010199.114/115/117/119-123 (เงินดำเนินงาน/สินค้า/วัสดุ) — ไม่รวม .116/.118
  // (ครุภัณฑ์-ที่ดิน/งบลงทุน) เพราะไม่ใช่เงินหมุนเวียน · บัญชีชุดนี้อยู่ใน rev แล้ว ไม่ได้บวกซ้ำ

      — ถ้าหยุดโอนตั้งแต่เดือนนี้ถึง ${sepLab} จะหายไป <b class="brk-no">${fmtM(stop)}</b> →

  })();

  let modeBox;

      <div class="note">💡 อ่านค่านี้เป็น <b>วินัยการใช้เงิน</b>: ${fmtM(down)} คือส่วนที่ยังรองรับได้ ถ้าเบิกจ่าย/ลงทุนเกินกว่านี้ (หรือรายรับเข้าช้ากว่าคาด) ระดับวิกฤตจะแย่ลงทันที</div>

    <div class="acctbl-wrap" style="max-height:none">
      <table class="acctbl brktbl">
        <tr><th>เกณฑ์ (7 คะแนนเต็ม)</th><th>ผ่านเมื่อ</th><th>ค่าปัจจุบัน<br>(${nowLab})</th><th>ณ ${sepLab}<br>ก่อนช่วย</th><th>${col5}</th><th>${scoreHd}</th></tr>

// สรุปที่มาของคะแนนตั้งต้นทั้งชุด — ใช้ในข้อความ "ที่มา" ทุกจุดของแท็บ กันการเรียก "ทางการ" ผิด
// (งวดที่ risk_scores ยังไม่ส่งข้อมูล ทุกแห่งจะเป็น gl = คำนวณจากงบทดลอง ไม่ใช่ค่าที่ รพ. รายงาน)
function exRiskSrcLab(){
  const hs=EX.hosp||[], n=hs.length, c={};
  hs.forEach(h=>{ c[h.src||'?']=(c[h.src||'?']||0)+1; });
  if(!n) return 'Risk Score';
  // งวดที่ไม่มีไฟล์ risk score ทางการ (HFO ไม่แจกในชุด .mdb — ต้องเข้าเว็บโหลดเอง) เราคำนวณด้วย
  // สูตรทางการจากงบทดลองงวดเดียวกับที่ HFO ใช้ · พิสูจน์กับไฟล์ทางการงวด พ.ค.69 ตรง 103/103
  // และ มี.ค.69 ตรง 103/103 (ดู RISK_EXEC_MODEL.md 3.11) — จึงบอกได้ว่าเทียบเท่า ไม่ใช่ค่าประมาณ
  if(c.gl===n) return `คะแนนที่คำนวณด้วยสูตรทางการจากงบทดลองงวดนี้ (ยังไม่มีไฟล์คะแนนทางการของงวดนี้ — สูตรตรงกับไฟล์ทางการงวดก่อน 103/103 แห่ง)`;
  if(c.rep===n) return 'Risk Score ทางการที่ รพ. รายงาน';
  return `คะแนนตั้งต้นแบบผสม — ทางการที่ รพ. รายงาน ${c.rep||0} แห่ง · คำนวณจากงบทดลอง ${c.gl||0} แห่ง`;
}
function exSepT(){ return Math.floor(EX.hosp[0].bs.t/100)*100+12; }   // สิ้นปีงบ (ก.ย.) — ใช้เฉพาะที่หมายถึง "สิ้นปีงบ" จริง ๆ

function exSetMoePct(g,v){

}

  const sur=Math.max(0, exMoeLeft({h, r0:exSimPath(h,0)}));

function exXferAuto(){

  EXXF_SHORT=[];
  const need=[], cap={};

  }
  EXST.xfer=plan; exSave(); exRender();
}

function exRenderProvTj(items){
  const box=document.getElementById('exProvTjBox'); if(!box) return;
  // ปิดป็อปอัปรายชื่อ รพ. ทุกครั้งที่ตัวเลขถูกคำนวณใหม่ — กันไม่ให้ค้างแสดงยอดของสถานะเก่า
  exProvCapClose();
  const P={};
  items.forEach(x=>{
    const pv=x.h.prov||'(ไม่ระบุจังหวัด)';
    const p=P[pv]||(P[pv]={n:0,pay:0,arRaw:0,ar:0,nPay:0,nAr:0,cap:0,nCap:0,short:0,nShort:0,gross:0,got:0,give:[],need:[]});
    const pay=exPayIn(x.h), arRaw=exArRaw(x.h), ar=exArIn(x.h);
    p.n++; p.pay+=pay; p.arRaw+=arRaw; p.ar+=ar;
    if(pay>0) p.nPay++; if(ar>0) p.nAr++;
    // ── 🔄 เงินช่วยภายในจังหวัด + ส่วนขาดสภาพคล่อง(MOE) (เจ้าของงานสั่ง 8 ส.ค. 69) ──
    // ทั้งสองก้อนมาจาก exMoeLeft ตัวเดียวกัน = คอลัมน์ "เงินสดคงเหลือหลังภาระ MOE" ของตารางล่างเป๊ะ ๆ
    //   left > 0 → เป็น "ผู้ให้ได้" · เพดาน = exXferCap (คุมระดับวิกฤตไม่เกิน EX_XF_HARD)
    //   left < 0 → เป็น "ผู้ขาด"  · ยอดขาด = exTopUp
    // จึงเป็นคนละแห่งกันเสมอ (แห่งเดียวเป็นได้แค่ฝั่งเดียว) เทียบสองคอลัมน์นี้ได้ตรง ๆ = ฐานเดียวกัน
    // xin/xout = โยกเข้า/โยกออกไปแล้วจริงของแห่งนี้ — ติดไปกับรายการทั้งสองฝั่ง เพื่อให้ป็อปอัป
    // ตอบได้ว่า "ให้ไปแล้วเท่าไหร่ · ยังให้ได้อีกเท่าไหร่" และ "รับมาแล้วเท่าไหร่ · ยังขาดอีกเท่าไหร่"
    const left=exMoeLeft(x), xin=exXferIn(x.h), xout=exXferOut(x.h), gross=exTopUpGross(x);
    if(left>0){
      const c=exXferCapC(x.h);
      // ⚠️ เงื่อนไข c>0 เท่านั้น — ห้ามใส่แห่งที่ "ยกจนหมดเพดานแล้ว" เข้ามาในลิสต์นี้
      //    เพราะ p.nCap/p.cap คือคอลัมน์ "เงินช่วยภายในจังหวัด" = กำลังช่วย**ที่ยังเหลือ**
      //    แห่งที่ยกไปแล้วดูได้ที่ตาราง "โยกกันไปแล้ว" ในป็อปอัป ซึ่งไล่จากแผนโยกโดยตรง
      if(c>0){ p.cap+=c; p.nCap++;
        p.give.push({name:x.h.name,hcode:x.h.hcode,type:x.h.type,cap:c,left,risk:x.r0.sepRisk,out:xout,got:xin}); }
    } else {
      const up=exTopUp(x);
      if(up>0){ p.short+=up; p.nShort++;
        p.need.push({name:x.h.name,hcode:x.h.hcode,type:x.h.type,up,risk:x.r0.sepRisk,got:xin,gross}); }

    // ต้องนับนอก if/else เพราะแห่งที่รับโยกจนพลิกเป็นบวกแล้วจะไปอยู่ฝั่งผู้ให้ แต่ยังมี gross ค้างอยู่
    p.gross+=exTopUpGross(x);
    // 🐞 เงินที่ "รับโยกมาแล้ว" ต้องใช้ exXferIn (ยอดที่โอนเข้าจริง) — **ห้ามคำนวณจาก gross − short**
    //    (บั๊กที่เจ้าของงานจับได้ 8 ส.ค. 69) เพราะผู้รับมัก "ได้เกินยอดที่ขาด": กติกาจัดสรรข้อ ③
    //    เติมเกินอีก 100K ต่อแห่ง + ปุ่ม "เติมเต็มส่วนขาด" ก็ปัดขึ้นได้ · พอ short ถูกตัดที่ 0
    //    ส่วนเกินจึงหายไป → gross−short น้อยกว่าที่โอนจริง = ตัวเลขสองที่บนหน้าเดียวกันไม่ตรง
    //    (งวด 256909 · 3 เดือน: หายไป 3.1 ลบ. จาก 31 แห่ง)
    p.got+=exXferIn(x.h);

  // ⚠️ ทุกอย่างที่ไล่ตาม provs (capIdx ของป็อปอัป + ไฟล์ TSV) เรียงตามนี้ด้วยอัตโนมัติ — ตั้งใจ

  const cutTot=T.arRaw-T.ar;
  // ── ป้ายบอกว่ากำลังใช้ค่าจากตัวควบคุม "📥 ลูกหนี้ที่เก็บได้: __%" ของตารางหลักอยู่ ──
  // ตัวเลขเชื่อมกันอยู่แล้วผ่าน exArIn() → exArPct()/arOvr (exSetArPct เรียก exRender → exRenderProvTj)

  // (เจ้าของงานถาม 7 ส.ค. 69) · nOvr นับเฉพาะ รพ. ที่อยู่ในชุด items ที่กำลังแสดง ไม่ใช่ทั้งเขต
  const arPct=exArPct();

  // ── ป้าย "พอ/ไม่พอ" ใต้ยอดเงินช่วย — เทียบกับส่วนขาดสภาพคล่อง(MOE) ของกลุ่มเดียวกัน ──

function narrative(s, h){
  const trig=s.triggers||[];
  const TRIG_TH={cr:'Current Ratio',qr:'Quick Ratio',cash:'Cash Ratio',nwc:'เงินทุนหมุนเวียนสุทธิติดลบ',ni:'ขาดทุนสะสม',survival:'ระยะเวลาอยู่รอดสั้น'};
  const d=(s.risk||0)-(s.riskPrev3??s.risk??0);
  const trend = d>0?`แย่ลงจาก ${s.riskPrev3} เป็น ${s.risk} ใน 3 เดือน`:d<0?`ดีขึ้นจาก ${s.riskPrev3} เป็น ${s.risk} ใน 3 เดือน`:`คงที่ที่ ${s.risk} คะแนน มา 3 เดือน`;
  let cause='';
  const acc=(h.topAccounts[periodMode]||h.topAccounts.mom||{}).accounts||[];
  if(acc.length){
    const top=acc[0];
    cause=` สาเหตุหลักที่ขยับแรงสุด: ${top.name} (${top.cls==='CA'?'สินทรัพย์':'หนี้สิน'}) เปลี่ยน ${top.delta>0?'+':''}${fmtM(top.delta)} บาท`;
  }
  const cls = (s.risk||0)>=6?'bad':(s.risk||0)>=3?'mid':'good';
  const trigTxt = trig.length? `จุดที่พลาดเกณฑ์: ${trig.map(t=>TRIG_TH[t]||t).join(', ')}.` : 'ผ่านทุกเกณฑ์ในงวดนี้';
  return {cls, text:`${h.name} ระดับความเสี่ยง ${s.risk??'-'}/7 (${trend}) — ${trigTxt}${cause}`};
}

      <h2>${h.name} <span style="font-size:13px;color:var(--mut);font-weight:400">${h.prov||''} · ${h.grp||''}${h.typeSer?' · '+h.typeSer:''}${h.bed?' · '+h.bed+' เตียง':''}</span></h2>
      <span class="badge" style="background:${riskColor(s.risk)};font-size:16px;height:30px;min-width:34px">${s.risk??'-'}</span>
      <span class="meta">งวด ${h.periodLabel} ${h.period} ${s.source==='gl'?'· <b style="color:var(--gold)">คำนวณจาก GL (ยังไม่มีรายงานคะแนนทางการ)</b>':''}</span>
    </div>

    <div id="headline" class="${nar.cls}">${nar.text}</div>

    <div class="chips" id="chips">${TRIGGERS.map(t=>`<span class="chip${trig.has(t.k)?' on':''}">${trig.has(t.k)?'✗':'✓'} ${t.label} ${tip(t.tt)}</span>`).join('')}</div>

    <div class="panel">
      <h3>🎯 ต้องทำเท่าไหร่ถึงหลุดเกณฑ์ (Gap-to-Target) ${tip('**คืออะไร**: แปลงเกณฑ์ Risk Score 6 ตัวเป็นช่องว่างเชิงบาทที่ต้องปิด\n**สูตร**: จำลองคะแนนด้วย scoreOf() (LI/ST/SU 4-quadrant) สูตรเดียวกับ pipeline\n**ข้อมูลจาก**: งบทดลองหมวด1/2 (1001X สินทรัพย์หมุนเวียน, 1001Y หนี้สินหมุนเวียน, 1002X/1003X) + รายได้-ค่าใช้จ่ายรวม (3006Y/3010X) งวดล่าสุด')}<span class="sp"></span></h3>
      <div class="src-note">📌 แปลงเกณฑ์ Risk Score ทั้ง 6 ตัวเป็น "ช่องว่างเชิงบาท" จากค่าดิบงบทดลองงวดล่าสุด (ตัวเศษ/ตัวส่วนตามผัง RatioItemID 1001X/1001Y/1002X/1003X และรายได้-ค่าใช้จ่ายรวม 3006Y/3010X) — แล้วจำลอง (simulate) ว่าถ้าปิดช่องว่างแต่ละก้อน คะแนน Risk จะลดเหลือเท่าไหร่ พร้อมแยก <b>FLOW</b> (กำไรรายเดือน—อยู่ในมือ รพ.) จาก <b>STOCK</b> (ต้องใช้เงินก้อน/ปรับโครงสร้างหนี้) · SU จำลองด้วยสูตร 4 quadrant เดียวกับ pipeline</div>
      <div id="gapBox"></div>
    </div>

    <div class="panel">
      <h3>จำลองอัตราความอยู่รอด (Survival Simulator) ${tip('**คืออะไร**: จำลองคะแนน Risk ล่วงหน้า 24 เดือน ถ้าปรับ กำไร/เดือน · เงินก้อน · แผนจ่ายหนี้ · เร่งเก็บลูกหนี้\n**สูตร**: ทุกเดือนคำนวณ scoreOf() ใหม่จากค่าคาดการณ์ (NI สะสมรีเซ็ต ต.ค., กระแสเงินสด=NI+ค่าเสื่อม)\n**ข้อมูลจาก**: ค่าดิบงบดุล/P&L งวดล่าสุด (1001X/1001Y/1002X/1003X/3006Y/3010X/3330Y) — เป็นการจำลองเชิงสถานการณ์ ไม่ใช่พยากรณ์')}<span class="sp"></span></h3>
      <div class="src-note">📌 เลื่อนสมมติฐาน<b>กำไร/ขาดทุนต่อเดือน</b>และ<b>เงินก้อนเสริมสภาพคล่อง</b> → ดูว่าคะแนน Risk จะลดแต่ละขั้นเมื่อไหร่ และเงินสดจะหมดเมื่อไหร่ · อิงสูตร SU ทางการ (recovery/depletion) เดียวกับ pipeline · ⚠️ เป็นการ<b>จำลองเชิงสถานการณ์ ไม่ใช่พยากรณ์</b> ดูสมมติฐานท้ายกล่อง</div>
      <div id="survBox"></div>
    </div>

    <div style="display:flex;justify-content:flex-end;align-items:center;gap:8px">
      <span class="note">เปรียบเทียบกับงวด:</span>
      <div class="seg" style="width:160px"><button id="pdMom" class="${periodMode==='mom'?'on':''}" onclick="setPeriodMode('mom')">MoM</button><button id="pdYoy" class="${periodMode==='yoy'?'on':''}" onclick="setPeriodMode('yoy')">YoY</button></div>
    </div>

    <div class="panel">
      <h3>เทรนด์ Ratio เทียบกลุ่มเปรียบเทียบ ${tip('**คืออะไร**: เทรนด์ 3 อัตราส่วนสภาพคล่อง เทียบแถบ P25-P75+median ของกลุ่มเปรียบเทียบ\n**อ่านยังไง**: แถบเทาเข้ม = ช่วง P25–P75 คือ "ครึ่งกลางของกลุ่ม" ไม่ใช่ช่วงที่ควรอยู่ — ตามนิยามจะมี รพ. อยู่นอกแถบราวครึ่งหนึ่งเสมอ (ต่ำกว่า P25 ราว 25% + สูงกว่า P75 ราว 25%) เส้นอยู่ใต้แถบ = อยู่ใน 25% ล่างของกลุ่ม\n**สูตร**: CR=สินทรัพย์หมุนเวียน÷หนี้สินหมุนเวียน · QR=สินทรัพย์เร็ว÷หนี้สินหมุนเวียน · Cash=เงินสด+เงินฝาก÷หนี้สินหมุนเวียน\n**ข้อมูลจาก**: ค่ารายงานจริงตาราง risk_scores หรืองบทดลอง RatioItemID 1001X/1001Y/1002X/1003X ถ้าไม่มีรายงาน')}<span class="sp"></span>
        <div class="metric-tabs">
          <button class="mtab${ratioMetric==='cr'?' on':''}" onclick="setRatioMetric('cr')">Current Ratio</button>
          <button class="mtab${ratioMetric==='qr'?' on':''}" onclick="setRatioMetric('qr')">Quick Ratio</button>
          <button class="mtab${ratioMetric==='cash'?' on':''}" onclick="setRatioMetric('cash')">Cash Ratio</button>
        </div>
      </h3>
      <div style="display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-bottom:6px">
        ${tip('**คืออะไร**: กลุ่มเปรียบเทียบ (peer) 4 มิติ ใช้หาแถบ P25-P75/median ในกราฟด้านบน\n**สูตร**: กลุ่ม = ระดับ+ลักษณะบริการ (พี่ตาล) · ระดับ = A/S/M1/M2/F1/F2/F3 · จังหวัด = สังกัดจริง · ทั้งเขต = 103 รพ. ทุกระดับรวมกัน\n**ใช้ "ทั้งเขต" เมื่อไร**: เหมาะกับการดูว่าอยู่ตรงไหนของเขตในภาพรวม และใช้แทนได้เมื่อกลุ่มย่อยเล็กเกินไป (21 แห่งมีกลุ่มต่ำกว่า 5) — แต่เพราะรวมทุกระดับเข้าด้วยกัน แถบจะกว้างและ รพศ./รพท. จะอยู่เหนือ P75 แทบตลอดโดยธรรมชาติ (CR กลาง รพศ.A 2.86 vs รพช.F1 1.14) ไม่ได้แปลว่าเก่งกว่า\n**ข้อมูลจาก**: meta.json (org.grp/level/prov) — percentile คำนวณต่องวดจากทุก รพ.ในกลุ่มเดียวกัน')}
        <div class="peer-tabs">
          <button class="mtab${peerDim==='grp'?' on':''}" onclick="setPeerDim('grp')">กลุ่ม ${h.grp||''}</button>
          <button class="mtab${peerDim==='level'?' on':''}" onclick="setPeerDim('level')">ระดับ ${h.level||''}</button>
          <button class="mtab${peerDim==='prov'?' on':''}" onclick="setPeerDim('prov')">จังหวัด ${h.prov||''}</button>
          ${(SUMMARY&&SUMMARY.peerAll)?`<button class="mtab${peerDim==='all'?' on':''}" onclick="setPeerDim('all')">ทั้งเขต</button>`:''}
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-bottom:6px">
        ${tip('**คืออะไร**: เลือกว่าจะวาดขอบเขตกลุ่มกว้างแค่ไหนเป็นเงาจาง ๆ นอกแถบ P25–P75\n**ทำไมค่าเริ่มต้นเป็น P10–P90**: Min–Max มี รพ. สุดขั้วดึงสเกลแกน Y จนกราฟแบน (บางกลุ่มค่าสูงสุดเป็น 26 เท่าของ P75) — P10–P90 กว้างกว่า P75 เฉลี่ยแค่ 1.4 เท่า จึงอ่านง่ายกว่า\n**ข้อมูลจาก**: เพอร์เซ็นไทล์/ค่าต่ำสุด-สูงสุดต่องวด คำนวณจาก รพ. ทุกแห่งในกลุ่มเดียวกัน (export_risk_link.py)')}
        <div class="peer-tabs">
          <button class="mtab${bandMode==='p25'?' on':''}" onclick="setBandMode('p25')">P25–P75</button>
          <button class="mtab${bandMode==='p10'?' on':''}" onclick="setBandMode('p10')">+ P10–P90</button>
          <button class="mtab${bandMode==='mm'?' on':''}" onclick="setBandMode('mm')">+ Min–Max</button>
        </div>
      </div>
      <div class="chartbox"><canvas id="ratioChart"></canvas></div>
      <div class="note">เส้นทึบ = รพ.นี้ · เส้นประ = median กลุ่ม · แถบเทาเข้ม = ช่วง P25–P75${bandMode==='p25'?'':' · เงาจาง = ช่วง '+(bandMode==='mm'?'Min–Max':'P10–P90')}${peerN(h)?' · กลุ่มเทียบ '+peerN(h)+' แห่ง':''}</div>
      <div class="note" style="margin-top:4px">ℹ️ แถบ P25–P75 คือ<b>ครึ่งกลางของกลุ่ม ไม่ใช่ช่วงที่ควรอยู่</b> — ตามนิยามจะมี รพ. อยู่นอกแถบราวครึ่งหนึ่งเสมอ (วัดจริงทั้งเขต: ในแถบ 48% · ต่ำกว่า P25 26% · สูงกว่า P75 26%) เส้นอยู่ใต้แถบตลอด = อยู่ใน 25% ล่างของกลุ่มจริง ๆ ไม่ใช่กราฟผิด</div>
      ${peerN(h)!=null&&peerN(h)<5?`<div class="note" style="margin-top:4px;color:var(--orange)">⚠️ กลุ่มเทียบมีแค่ ${peerN(h)} แห่ง — เพอร์เซ็นไทล์จากกลุ่มเล็กไม่เสถียร (รพ. แห่งเดียวขยับก็ทำให้แถบเลื่อนทั้งแถบ) ลองกด <b>"ทั้งเขต"</b> ดูประกอบ</div>`:''}
      ${peerDim==='all'?`<div class="note" style="margin-top:4px;color:var(--orange)">⚠️ มิติ "ทั้งเขต" รวม รพ. ทุกระดับเข้าด้วยกัน (รพศ. ถึง รพช.F3) แถบจึงกว้างกว่าปกติมาก — ${h.level||'รพ.'} อยู่เหนือหรือใต้แถบนี้ส่วนหนึ่งมาจาก<b>ขนาดและระดับ ไม่ใช่ฝีมือบริหารล้วน ๆ</b> (CR กลางของ รพศ.A = 2.86 เทียบ รพช.F1 = 1.14) ใช้ดูตำแหน่งในภาพรวมเขตได้ แต่ถ้าจะตัดสินผลงานควรกลับไปดูมิติ "กลุ่ม" หรือ "ระดับ"</div>`:''}
      <div class="src-note">📌 ที่มาข้อมูล: ค่า Current/Quick/Cash Ratio ที่ รพ. รายงานจริง (ตาราง <code>risk_scores</code>) — ถ้างวดใดไม่มีรายงาน (ขึ้น "คำนวณจาก GL" ที่หัวหน้าเพจ) จะคำนวณแทนจากงบทดลอง <code>balance_sheet</code> ตามผังบัญชี RatioItemID 1001X/1001Y (CR), 1002X (QR), 1003X (Cash) ของกองเศรษฐกิจสุขภาพ</div>
    </div>

    <div class="panel">
      <h3>รายได้และค่าใช้จ่าย — สาเหตุที่ทำให้กำไร/เงินสดเปลี่ยน ${tip('**คืออะไร**: สะพานกำไร (NI Bridge) + waterfall หมวดย่อยรายได้/ค่าใช้จ่าย เทียบ MoM/YoY\n**สูตร**: ΔNI = Δรายได้ − Δค่าใช้จ่าย (ไม่ใช่ ratio จึงไม่หาร)\n**ข้อมูลจาก**: งบทดลองหมวด 4/5 (บัญชีรายได้/ค่าใช้จ่าย) ยอดสะสมตั้งแต่ต้นปีงบ ตามผัง RatioItemID 3006Y (รายได้รวม)/3010X (ค่าใช้จ่ายรวม) — จัดหมวดย่อยด้วย acc_hierarchy.Name2')}</h3>
      <div class="src-note">📌 ที่มาข้อมูล: งบทดลองหมวด 4 (บัญชีรายได้) และหมวด 5 (บัญชีค่าใช้จ่าย) เป็น<b>ยอดสะสมตั้งแต่ต้นปีงบ</b> (ต่างจากงบดุลด้านบนที่เป็นยอดคงเหลือปลายงวด) จับคู่บัญชีด้วยผัง RatioItemID <b>3006Y</b> (รายได้รวม, 168 บัญชี) และ <b>3010X</b> (ค่าใช้จ่ายรวม, 276 บัญชี) — ตัวเลขชุดเดียวกับที่ใช้คำนวณ <b>NI (Net Income)</b> ที่ป้อนเข้าเกณฑ์ Risk Score ฝั่ง ST (NI ติดลบ) และ SU (ระยะเวลาอยู่รอด) โดยตรง · จัดกลุ่มหมวดย่อยด้วย <code>acc_hierarchy.Name2</code> เช่นเดียวกับฝั่งงบดุล</div>
      <div id="niBridgeBox"></div>
      <div class="wf-cols" id="wfPLBox"></div>
      <div class="wf-title" style="margin-top:14px">บัญชีรายได้/ค่าใช้จ่ายที่ขยับแรงสุด (Top 20)</div>
      <div class="acctbl-wrap"><table class="acctbl" id="acctblPL"></table></div>
    </div>

    <div class="panel">
      <h3>สะพานกำไร 3 ชั้นทางการ — ทำไม Risk Score ใช้ NI ที่เข้มที่สุด ${tip('**คืออะไร**: นิยามกำไรทางการ 3 ชั้นของกองเศรษฐกิจสุขภาพ ไล่จากเข้มสุดไปหลวมสุด\n**สูตร**: NI มีค่าเสื่อม (3007X=3006Y−3010X, ตัวที่ Risk Score ใช้) → +ค่าเสื่อม → NI ไม่มีค่าเสื่อม (3006X=3006Y−3330Y) → −รายได้งบลงทุน → EBITDA (333=3330X−3330Y)\n**ข้อมูลจาก**: งบทดลอง RatioItemID 3006Y/3010X/3330X/3330Y — พิสูจน์ตรง 100% ถึงหลักบาท ไม่มีการปรับแต่งเพิ่ม')}</h3>
      <div class="src-note">📌 ที่มาข้อมูล: นิยามกำไรทางการของ<b>กองเศรษฐกิจสุขภาพและหลักประกันสุขภาพ</b> 3 ชั้น — <b>NI มีค่าเสื่อม (3007X = 3006Y−3010X)</b> คือตัวที่ป้อนเข้าเกณฑ์ Risk Score ฝั่ง ST/SU โดยตรง (เข้มสุด เพราะรวมค่าเสื่อมราคาที่ไม่ใช่เงินสด และรวมรายได้งบลงทุน), <b>NI ไม่มีค่าเสื่อม (3006X = 3006Y−3330Y)</b> บวกกลับค่าเสื่อม, และ <b>EBITDA (333 = 3330X−3330Y)</b> ตัดทั้งค่าเสื่อมและรายได้งบลงทุนออก — พิสูจน์ตรง 100% ถึงหลักบาท ทั้งสามชั้นเป็นนิยามทางการ ไม่มีการปรับแต่งเพิ่ม</div>
      <div id="niTierBox"></div>
    </div>

    <div class="panel">
      <h3>ทำไม Ratio เปลี่ยน — แยกจากสินทรัพย์ (ตัวเศษ) หรือหนี้สิน (ตัวส่วน) ${tip('**คืออะไร**: แยก ΔRatio (CR/QR/Cash) ว่ามาจากตัวเศษ (สินทรัพย์) หรือตัวส่วน (หนี้สินหมุนเวียน) เปลี่ยน\n**สูตร**: fromNumerator=(x1−x0)÷y0 · fromDenominator=x0×(1÷y1−1÷y0) — ใช้ y ของงวดฐานคุมตัวเศษ\n**ข้อมูลจาก**: ค่าดิบงบทดลอง 1001X/1001Y/1002X/1003X เทียบงวด MoM/YoY')}</h3>
      <div id="decompBox"></div>
    </div>

    <div class="panel">
      <h3>หนี้สิน/สินทรัพย์ เปลี่ยนจากหมวดย่อยไหน (Waterfall) ${tip('**คืออะไร**: Δ มูลค่าตามหมวดย่อยของสินทรัพย์หมุนเวียน (CA) และหนี้สินหมุนเวียน (CL) เทียบงวดก่อน\n**สูตร**: Δ = ยอดคงเหลืองวดนี้ − งวดฐาน ต่อหมวดย่อย เรียงจากขยับแรงสุด\n**ข้อมูลจาก**: งบทดลองหมวด 1/2 ยอดคงเหลือปลายงวด (1001X/1001Y) จัดกลุ่มด้วย acc_hierarchy.Name2')}</h3>
      <div class="src-note">📌 ที่มาข้อมูล: งบทดลองหมวด 1 (สินทรัพย์) และหมวด 2 (หนี้สิน) ยอดคงเหลือปลายงวด ตามผัง RatioItemID 1001X (สินทรัพย์หมุนเวียน) / 1001Y (หนี้สินหมุนเวียน) — จัดกลุ่มหมวดย่อยด้วย <code>acc_hierarchy.Name2</code></div>
      <div id="wfBox"></div>

// ── Gap-to-Target Solver ────────────────────────────────────
// จำลองคะแนน Risk จากค่าดิบงบดุล+P&L ตามสูตรเดียวกับ pipeline (export_risk_link.py)
function scoreOf(ca, cl, qn, cn, ni, mo){
  if(!cl) return null;
  const cr=ca/cl, qr=qn/cl, cash=cn/cl, nwc=ca-cl;
  // ปัด 2 ตำแหน่งก่อนเทียบเกณฑ์ให้ตรงกับที่ HFO ทำ (ดู RISK_EXEC_MODEL.md 3.11)
  // เคสจริง: เชียงกลาง งวด 256908 QR 0.996 → ไฟล์ทางการแสดง 1.00 และให้ 0 คะแนน
  const r2=v=>Math.round(v*100)/100;
  const li=(r2(cr)<1.5?1:0)+(r2(qr)<1.0?1:0)+(r2(cash)<0.8?1:0);
  const st=(nwc<0?1:0)+(ni<0?1:0);
  const m=mo>0?mo:12;
  const np=nwc>=0, ip=ni>=0;
  let su;
  if(np&&ip) su=0;
  else if(!np&&!ip) su=2;
  else if(np&&!ip){ const a=Math.abs(ni)/m; const s=a?nwc/a:1e9; su=s<3?2:s<6?1:0; }
  else { const a=ni/m; const r=a?(-nwc)/a:1e9; su=r<3?0:r<6?1:2; }
  return {cr,qr,cash,nwc,li,st,su,risk:li+st+su};
}
// ลำดับปิดช่องว่าง flow-first → คืน milestone + คะแนนที่จำลองได้
function buildLadder(t, mo){
  let ca=t.ca, cl=t.cl, qn=t.qn, cn=t.cn, ni=t.ni;
  const steps=[]; let flow=0, stock=0;
  if(ni<0){ flow+=(-ni); ni=0;
    steps.push({label:'หยุดเลือด — ทำ NI สะสมให้ ≥ 0', type:'FLOW', flow, stock, sc:scoreOf(ca,cl,qn,cn,ni,mo)}); }
  if(ca-cl<0){ const d=cl-ca; stock+=d; ca+=d; cn+=d; qn+=d;
    steps.push({label:'พ้นกับดักอยู่รอด — ล้าง NWC ให้เป็นบวก', type:'STOCK', flow, stock, sc:scoreOf(ca,cl,qn,cn,ni,mo)}); }
  const s2=scoreOf(ca,cl,qn,cn,ni,mo);
  if(s2 && s2.li>0){
    const need=Math.max(1.5*cl-ca, 0.8*cl-cn, cl-qn, 0);
    if(need>0){ stock+=need; ca+=need; cn+=need; qn+=need; }
    steps.push({label:'เข้าเกณฑ์สภาพคล่องครบ (CR/QR/Cash)', type:'STOCK', flow, stock, sc:scoreOf(ca,cl,qn,cn,ni,mo)});
  }
  return steps;
}
function monthlyNI(tr){
  const out=[];
  for(let i=0;i<tr.length;i++){
    const mm=tr[i].t%100;
    if(tr[i].ni==null){out.push(null);continue}
    if(mm===1){out.push(tr[i].ni);continue}
    const p=tr[i-1];
    out.push(p&&p.t===tr[i].t-1&&p.ni!=null?tr[i].ni-p.ni:null);
  }
  return out;
}

  let hl, ladderHtml='', noteHtml='';
  if(sRisk<=0){
    hl=`<div class="gap-hl done">✓ ${h.name} ผ่านทุกเกณฑ์ในงวดนี้ (Risk 0) — ตารางด้านล่างแสดง "ระยะห่างเหนือเกณฑ์" ของแต่ละตัว เพื่อเฝ้าระวังไม่ให้หลุดกลับ</div>`;
  }else{
    const first=steps[0];
    if(first && first.type==='FLOW'){
      const monthsLeft=Math.max(1,12-mo);
      const req=(-s.ni)/monthsLeft;
      hl=`<div class="gap-hl flow">เกณฑ์แรกที่ควรโจมตี = <b>NI (กำไร)</b> ซึ่งอยู่ในมือ รพ. — ห่างเป้าแค่ <b>${fmtM(-s.ni)}</b> ≈ +${fmtM(req)}/เดือน อีก ${monthsLeft} เดือน แล้วคะแนนจะลดจาก ${sRisk} → ${anc(first.sc.risk)} ทันที (ST ลด 1)</div>`;
    }else if(first){
      hl=`<div class="gap-hl stock">งวดนี้เกณฑ์ที่เหลือเป็น <b>STOCK</b> (ต้องใช้เงินก้อน/ปรับหนี้) — ก้อนแรก ${fmtM(first.stock)} จะลดคะแนน ${sRisk} → ${anc(first.sc.risk)}</div>`;
    }
    // ladder rungs: เริ่มจากคะแนนทางการ (badge) แล้วไล่ตาม milestone (คะแนน = ฐานทางการ + delta จำลอง)
    const startBadge=`<div class="rung">
      <div class="rbadge" style="background:${riskColor(sRisk)}">${sRisk}</div>
      <div class="rmain"><div class="rl">คะแนนปัจจุบัน (LI ${s.li} + ST ${s.st} + SU ${s.su})</div>
      <div class="rs">พลาด ${(s.li||0)+(s.st||0)+((s.su||0)>0?1:0)} กลุ่มเกณฑ์</div></div>
      <div class="rcost"></div></div>`;
    const rungs=steps.map((st_,i)=>{
      const prevDisp=i===0?sRisk:anc(steps[i-1].sc.risk);
      const disp=anc(st_.sc.risk);
      const drop=prevDisp-disp;
      const costHtml=`${st_.flow>0?`<span class="cf">กำไร +${fmtM(st_.flow)}</span>`:''}${st_.flow>0&&st_.stock>0?'<br>':''}${st_.stock>0?`<span class="cs">เงินก้อน +${fmtM(st_.stock)}</span>`:''}<span class="cl">สะสมรวม</span>`;
      return `<div class="rung">
        <div class="rbadge" style="background:${riskColor(disp)}">${disp}</div>
        <div class="rmain"><div class="rl">${st_.label}</div>
          <div class="rs">${st_.type==='FLOW'?'FLOW · ทำเองได้':'STOCK · ต้องการทรัพยากร'} → ลด ${drop} คะแนน${drop>=2?' · <b>ลดหลายคะแนนพร้อมกันเพราะปลดล็อก SU</b>':''}</div></div>
        <div class="rcost">${costHtml}</div></div>`;
    }).join('');
    ladderHtml=`<div class="wf-title" style="margin-top:14px">บันไดลดคะแนน Risk (จำลอง)</div><div class="ladder">${startBadge}${rungs}</div>`;
  }

  // ── NI capability note (เฉพาะเมื่อ NI ยังติดลบ) ──
  if(s.ni<0){
    const mn=monthlyNI(h.trend).slice(-6);
    const vals=mn.filter(v=>v!=null);
    const mx=Math.max(1,...vals.map(v=>Math.abs(v)));
    const spark=`<span class="spark">${mn.map(v=>{
      if(v==null)return '<i style="height:2px;background:var(--line)"></i>';
      const hgt=Math.round(Math.abs(v)/mx*18)+2;
      return `<i title="${fmtM(v)}" style="height:${hgt}px;background:${v>=0?'var(--green)':'var(--red)'}"></i>`;
    }).join('')}</span>`;
    const last3=monthlyNI(h.trend).slice(-3).map(v=>v==null?'—':(v>0?'+':'')+fmtM(v));
    noteHtml=`<div class="gap-note">💡 <b>NI เป็นคันโยก FLOW เพียงตัวเดียว</b> — กำไรรายเดือน 6 งวดล่าสุด ${spark} (เขียว=กำไร แดง=ขาดทุน) · 3 เดือนล่าสุด: ${last3.join(' / ')} ล้านบาท<br>
    เมื่อ NI สะสมพลิกบวก คะแนน ST จะลด 1 แต่ <b>SU มักยังค้างที่ 2</b> เพราะเวลาที่กำไรจะดัน NWC กลับบวกยังนานเกิน 6 เดือน — ต้องแก้ NWC (STOCK) ควบคู่ SU จึงจะปลดล็อก</div>`;
  }

  box.innerHTML=hl+tbl+ladderHtml+noteHtml;
}

// ── NI Bridge: สะพานกำไร 3 ชั้นทางการ (กองเศรษฐกิจสุขภาพ) ────────
function renderNITiers(h, s){
  const box=document.getElementById('niTierBox'); if(!box) return;
  const t=h.trend[h.trend.length-1];
  if(!t || t.rev==null || t.e33y==null){ box.innerHTML='<div class="note">งวดนี้ไม่มีค่าดิบรายได้/ค่าใช้จ่ายทางการ (shard เก่า)</div>'; return; }
  const niDep=t.rev-t.exp;        // 3007X = NI มีค่าเสื่อม (Risk ST/SU)
  const niNoDep=t.rev-t.e33y;     // 3006X = NI ไม่มีค่าเสื่อม
  const ebitda=t.e33x-t.e33y;     // 333  = EBITDA
  const dep=t.exp-t.e33y;         // ค่าเสื่อม (บวกกลับ)
  const invRev=t.rev-t.e33x;      // รายได้งบลงทุน (ตัดออก)
  const cls=v=>v>=0?'pos':'neg';
  const tiers=`<div class="ni-bridge">
    <div class="ni-tier ${cls(niDep)}"><div class="lbl">NI มีค่าเสื่อม ${tip('**สูตร**: 3007X = รายได้รวม (3006Y) − ค่าใช้จ่ายรวม (3010X)\n**ใช้ที่ไหน**: ตัวที่ป้อนเข้าเกณฑ์ Risk Score ฝั่ง ST/SU โดยตรง (เข้มสุด)')}<br><span>3007X · Risk ST/SU</span></div><div class="val">${fmtM(niDep)}</div></div>
    <div class="ni-op">+ ค่าเสื่อม<br><b>${fmtM(dep)}</b></div>
    <div class="ni-tier ${cls(niNoDep)}"><div class="lbl">NI ไม่มีค่าเสื่อม ${tip('**สูตร**: 3006X = รายได้รวม (3006Y) − ค่าใช้จ่ายไม่รวมค่าเสื่อม (3330Y)\n**ใช้ที่ไหน**: บวกค่าเสื่อม (ไม่ใช่เงินสด) กลับเข้าไป — ไม่ใช่เกณฑ์ Risk Score')}<br><span>3006X</span></div><div class="val">${fmtM(niNoDep)}</div></div>
    <div class="ni-op">− รายได้งบลงทุน<br><b>${fmtM(invRev)}</b></div>
    <div class="ni-tier ${cls(ebitda)}"><div class="lbl">EBITDA ${tip('**สูตร**: 333 = รายได้ไม่รวมงบลงทุน (3330X) − ค่าใช้จ่ายไม่รวมค่าเสื่อม (3330Y)\n**ใช้ที่ไหน**: ตัดทั้งค่าเสื่อมและรายได้งบลงทุนออก — วัดการดำเนินงานล้วนๆ')}<br><span>333</span></div><div class="val">${fmtM(ebitda)}</div></div>
  </div>`;
  let vtxt, vcls;
  if(niDep>=0){
    vcls='good'; vtxt=`<b>NI เป็นบวก ${fmtM(niDep)}</b> — ผ่านเกณฑ์ NI ของ ST อยู่แล้ว`;
    if(ebitda<0) vtxt+=` แต่ EBITDA ติดลบ ${fmtM(ebitda)} (พึ่งรายได้งบลงทุน ${fmtM(invRev)}) — ควรจับตาความยั่งยืน`;
  }else if(niNoDep>=0){
    if(ebitda>=0){ vcls='mid'; vtxt=`<b>ขาดทุน NI ${fmtM(niDep)} เกิดจากค่าเสื่อมราคา (ไม่ใช่เงินสด) ${fmtM(dep)} เป็นหลัก</b> — ทั้ง NI ไม่มีค่าเสื่อม (+${fmtM(niNoDep)}) และ EBITDA (${fmtM(ebitda)}) เป็นบวก การดำเนินงานยังสร้างเงินสดได้ · เกณฑ์ ST ยึดชั้นบนสุด (มีค่าเสื่อม) จึงจับติดลบ`; }
    else { vcls='mid'; vtxt=`<b>NI ${fmtM(niDep)} ติดลบเพราะค่าเสื่อม ${fmtM(dep)}</b> — NI ไม่มีค่าเสื่อมเป็นบวก (+${fmtM(niNoDep)}) แต่ EBITDA กลับติดลบ ${fmtM(ebitda)} เพราะกำไรก้อนนี้พึ่ง<b>รายได้งบลงทุน ${fmtM(invRev)}</b> ที่ไม่ประจำ — การดำเนินงานหลักเกือบเท่าทุน/ขาดทุนเล็กน้อย`; }
  }else{
    vcls='bad'; vtxt=`<b>ขาดทุนทุกชั้น</b> — แม้บวกกลับค่าเสื่อม (NI ไม่มีค่าเสื่อม ${fmtM(niNoDep)}) และตัดงบลงทุนเป็น EBITDA (${fmtM(ebitda)}) ก็ยังติดลบ — เป็นปัญหาการดำเนินงานจริง ไม่ใช่แค่ค่าเสื่อม/งบลงทุน`;
  }
  const hint = niDep<0 ? `<div class="note" style="margin-top:6px">📎 ถ้าเกณฑ์ ST ใช้ EBITDA แทน NI มีค่าเสื่อม รพ.นี้จะ${ebitda>=0?'<b style="color:var(--green)">ผ่าน</b>':'<b style="color:var(--red)">ยังไม่ผ่าน</b>'} — แต่เกณฑ์ทางการยึด NI มีค่าเสื่อม จึงยังนับเป็นความเสี่ยง</div>` : '';
  box.innerHTML=tiers+`<div class="ni-verdict ${vcls}">${vtxt}</div>`+hint;
}

// ── D: Survival Simulator — จำลองเส้นทางอยู่รอด (อิงสูตร SU ทางการ) ──
const SHOW_NET_CASH=false;  // ซ่อนส่วนเปรียบเทียบ "เงินบำรุงสุทธิหลังหักหนี้" ไว้ก่อน — ปรับเป็น true เพื่อเปิดกลับ
let SURV=null;
// สเกลแกน NI (±ล้าน/เดือน) และเงินก้อน (ล้าน) ตามระดับหน่วยบริการ — ค่าเป็นล้านบาท
function survLimits(h){
  const m=(h.grp||'').match(/\.(A|S|M1|M2|F1|F2|F3)(?=\s|$)/)||(h.grp||'').match(/(A|S|M1|M2|F1|F2|F3)/);
  const cls=m?m[1]:null;
  const T={A:[500,100],S:[300,100],M1:[150,100],M2:[100,100],F1:[60,100],F2:[40,100],F3:[25,100]};
  const [ni,inj]=T[cls]||[100,40];
  return {niLim:ni*1e6, injMax:inj*1e6, cls};
}
function buildSurvCtx(h, s){
  const t=h.trend[h.trend.length-1];
  if(!t || !t.cl || t.e33y==null) return null;
  const mo=t.t%100;
  const depMo=Math.max(0,(t.exp-t.e33y)/mo);   // ค่าเสื่อม/เดือน (run-rate ปัจจุบัน)
  const niRun=Math.round(t.ni/mo/50000)*50000; // NI/เดือน (ค่าเฉลี่ย YTD) ปัดหลักห้าหมื่น
  // anchor เดือน 0 ที่คะแนนทางการ (badge) — base = scoreOf(GL) ใช้คำนวณ delta จำลอง (กัน boundary mismatch)
  const base=scoreOf(t.ca,t.cl,t.qn,t.cn,t.ni,mo).risk;
  // หมวดรายได้/ค่าใช้จ่ายจริงของงวดนี้ (YTD) → อัตราเฉลี่ยต่อเดือน ใช้เป็นค่าตั้งต้นของป็อปอัปประมาณการรายหมวด
  // ใช้รหัส P ของ Planfin (map จากบัญชีจริง — export_planfin.py) ถ้ามี, ไม่งั้น fallback เป็นหมวดบัญชี (waterfall)
  let planRev=null, planExp=null, planSrc='gl';
  if(h.planfin && h.planfin.rev){
    const pm=(h.planfin.t%100)||mo;
    planSrc='planfin';
    planRev=h.planfin.rev.map(r=>({p:r.p,name:`${r.p} · ${r.name}`,mo:r.value/pm}));
    planExp=h.planfin.exp.map(r=>({p:r.p,name:`${r.p} · ${r.name}`,mo:r.value/pm}));
  } else {
    const wf=h.waterfall&&(h.waterfall.mom||h.waterfall.yoy);
    planRev=wf&&wf.rev?wf.rev.map(r=>({name:r.name,mo:r.value/mo})):null;
    planExp=wf&&wf.exp?wf.exp.map(r=>({name:r.name,mo:r.value/mo})):null;
  }
  // สเกลแกนปรับตามระดับหน่วยบริการ (A ใหญ่สุด → F3 เล็กสุด) เพื่อไม่ให้สเกลกว้างจนมองผลการเปลี่ยนแปลงไม่ออก
  const lim=survLimits(h);
  const NI_LIM=lim.niLim, INJ_MAX=lim.injMax;
  // หนี้สินหมุนเวียนรายหมวด (จ่ายชำระ/ก่อใหม่ ต่อเดือน) + ลูกหนี้ค้างรับ (เร่งเก็บ → เงินก้อน)
  const clbd=h.clBreakdown||null, recv=h.recv||null;
  const totalAR=recv?recv.reduce((s,r)=>s+(r.ar||0),0):0;
  // สเกลสไลด์ "จ่ายหนี้สุทธิ/เดือน": ±ความสามารถจ่ายรวม (Σ payMo) หรือ fallback ตามระดับ
  const DEBT_LIM=Math.max(clbd?Math.round((clbd.totalPay||0)/50000)*50000:0, INJ_MAX);
  return {ca:t.ca,cl:t.cl,qn:t.qn,cn:t.cn,ni:t.ni,mo,depMo,startT:t.t,official:(s.risk||0),base,planRev,planExp,planSrc,niLim:NI_LIM,injMax:INJ_MAX,cls:lim.cls,niRun,tgt:null,
        clbd,recv,totalAR,debtLim:DEBT_LIM,debtNetMo:0,acpFreed:0,acpMonth:1};
}
function renderSurvival(h, s){
  const box=document.getElementById('survBox'); if(!box) return;
  const ctx=buildSurvCtx(h,s);
  if(!ctx){ box.innerHTML='<div class="note">งวดนี้ไม่มีข้อมูลพอสำหรับจำลอง</div>'; return; }
  SURV=ctx;
  const curL=SURV.official, sepLab=svSepLabel(), moLeft=12-SURV.mo;
  const clampNi=v=>Math.max(-SURV.niLim,Math.min(SURV.niLim,v));
  const debtCtrl = SURV.clbd ? `

        <input type="range" id="svDebt" min="-${SURV.debtLim}" max="${SURV.debtLim}" step="50000" value="0">
        <span class="surv-base">+ = เร่งจ่าย (เงินสด↓ หนี้↓) · − = ค้างชำระนานขึ้น (เงินสด↑ หนี้↑) · หนี้คงเหลือ <b>${fmtM(SURV.clbd.total)}</b> · ปกติจ่าย ~<b>${fmtM(SURV.clbd.totalPay)}</b>/ก่อใหม่ ~<b>${fmtM(SURV.clbd.totalInc)}</b> ต่อเดือน · <a href="#" onclick="svReset('debt');return false">ล้างเป็น 0</a></span></div>` : '';
  const acpCtrl = (SURV.recv&&SURV.totalAR>0) ? `
      <div class="fld"><label>เร่งเก็บลูกหนี้ค้างรับ (เงินสดเข้าตามเดือนที่ตั้งเป้า): <b id="svAcpLab"></b> ${tip('**คืออะไร**: ตั้งเป้าจำนวนเงินที่จะเก็บลูกหนี้ได้เร็วขึ้น + เดือนที่คาดว่าจะได้รับเป็นเงินสด\n**สูตร**: เงินสดเข้าเป็นก้อนเดียว ณ เดือนที่ตั้งเป้า (ไม่ใช่ทันที) — CA/QN/NWC รวมไม่เปลี่ยน (ลูกหนี้ในนั้นอยู่แล้ว) เปลี่ยนเฉพาะเงินสด/Cash Ratio\n**ข้อมูลจาก**: ลูกหนี้สิทธิ UC/CSMBS/SSS (2610X/2620X/2630X) + ACP ที่คำนวณไว้')}
        <button type="button" class="planfin-btn" onclick="openAcpPlan()">✎ ตั้งเป้าจำนวนเงิน+เดือน รายกองทุน</button></label>
        <input type="range" id="svAcp" min="0" max="${Math.round(SURV.totalAR/50000)*50000}" step="50000" value="0">
        <span class="surv-base">ลูกหนี้ค้างรับรวม <b>${fmtM(SURV.totalAR)}</b> · เก็บได้เร็วขึ้น = เงินสด+Cash Ratio ดีขึ้น (CA/QN/NWC เท่าเดิม) — เข้าเดือนที่ ${SURV.acpMonth} เป็นค่าเริ่มต้น ปรับได้ในป็อปอัป · <a href="#" onclick="svReset('acp');return false">ล้างเป็น 0</a></span></div>` : '';
  box.innerHTML=`
    <div class="tgt-box">
      <div class="tgt-title">🎯 ตั้งเป้าระดับวิกฤตภายใน <b>${sepLab}</b> (สิ้นปีงบ${moLeft>0?` · เหลือ ${moLeft} เดือน`:' · งวดนี้คือ ก.ย. แล้ว'}) — กดเลขระดับที่ต้องการ</div>
      <div class="lvlbtns">${[0,1,2,3,4,5,6,7].map(L=>`<button type="button" class="lvlbtn${L===curL?' cur':''}" data-l="${L}" style="background:${riskColor(L)}" onclick="svTarget(${L})">${L}</button>`).join('')}</div>
      <div class="tgt-legend">เลข<b>ต่ำกว่า</b>ปัจจุบัน = ต้องทำกำไร/เติมเงินก้อนเท่าไหร่ถึงจะลดลงไปถึงภายใน ${sepLab} · เลข<b>สูงกว่า</b> = เพดานขาดทุนเดือนละเท่าไหร่ก่อนจะตกลงไปถึง (รวม รพ.ระดับ 0 ที่อยากรู้ระยะปลอดภัย)</div>

  document.getElementById('svNi').oninput=projSurv;
