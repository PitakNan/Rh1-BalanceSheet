<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สาเหตุวิกฤต — เขตสุขภาพที่ 1</title>
<script>(function(){const t=localStorage.getItem('rh1-theme');if(t)document.documentElement.setAttribute('data-theme',t)})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--blue:#3b82f6;--gold:#d97706;--orange:#ea580c;--red:#dc2626;--green:#16a34a;
  --hd1:#0f172a;--hd2:#1e293b;--th-bg:#f8fafc;--row-strip:#f1f5f9;--hover:#eff6ff;
  --good-bg:#f0fdf4;--good-bd:#bbf7d0;--good-ink:#166534;
  --bad-bg:#fef2f2;--bad-bd:#fecaca;--bad-ink:#991b1b;
  --mid-bg:#eff6ff;--mid-bd:#bfdbfe;--mid-ink:#1e40af;
  --shadow:rgba(0,0,0,.04)}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1115;--card:#181b21;--ink:#e6e9ef;--mut:#96a0b2;--line:#2a2f3a;--blue:#5b9dff;--gold:#e0a840;--orange:#fb923c;--red:#f0685f;--green:#4ade80;
    --hd1:#0a0c10;--hd2:#151922;--th-bg:#1d2129;--row-strip:#1b1e25;--hover:#1c2635;
    --good-bg:#112016;--good-bd:#1f4a2c;--good-ink:#5fd989;
    --bad-bg:#2a1414;--bad-bd:#5a2222;--bad-ink:#f2a0a0;
    --mid-bg:#131c2a;--mid-bd:#26426b;--mid-ink:#8fb8f0;
    --shadow:rgba(0,0,0,.3)}
}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--ink:#e6e9ef;--mut:#96a0b2;--line:#2a2f3a;--blue:#5b9dff;--gold:#e0a840;--orange:#fb923c;--red:#f0685f;--green:#4ade80;
  --hd1:#0a0c10;--hd2:#151922;--th-bg:#1d2129;--row-strip:#1b1e25;--hover:#1c2635;
  --good-bg:#112016;--good-bd:#1f4a2c;--good-ink:#5fd989;
  --bad-bg:#2a1414;--bad-bd:#5a2222;--bad-ink:#f2a0a0;
  --mid-bg:#131c2a;--mid-bd:#26426b;--mid-ink:#8fb8f0;
  --shadow:rgba(0,0,0,.3)}
:root[data-theme="light"]{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--blue:#3b82f6;--gold:#d97706;--orange:#ea580c;--red:#dc2626;--green:#16a34a;
  --hd1:#0f172a;--hd2:#1e293b;--th-bg:#f8fafc;--row-strip:#f1f5f9;--hover:#eff6ff;
  --good-bg:#f0fdf4;--good-bd:#bbf7d0;--good-ink:#166534;
  --bad-bg:#fef2f2;--bad-bd:#fecaca;--bad-ink:#991b1b;
  --mid-bg:#eff6ff;--mid-bd:#bfdbfe;--mid-ink:#1e40af;
  --shadow:rgba(0,0,0,.04)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden;transition:background .15s,color .15s}
header{background:linear-gradient(135deg,var(--hd1) 0%,var(--hd2) 50%,var(--hd1) 100%);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex-shrink:0}
header h1{font-size:16px;font-weight:700}
header .sub{font-size:11.5px;color:#cbd5e1}
#themeBtn{background:none;border:1px solid #ffffff33;color:#fff;border-radius:99px;width:30px;height:30px;font-size:14px;cursor:pointer;flex-shrink:0}
#themeBtn:hover{background:#ffffff22}
#menuBtn{display:none;background:none;border:1px solid #ffffff33;color:#fff;border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer;flex-shrink:0}
#menuBtn:hover{background:#ffffff22}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
.backdrop.show{display:block}
.drawer-close{display:none}
.main{display:flex;flex:1;overflow:hidden}
/* LEFT: hospital list */
.left{width:340px;min-width:260px;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--card);flex-shrink:0;transition:width .18s ease,min-width .18s ease}
/* ── ยุบแถบรายชื่อ รพ. ด้านซ้าย (เจ้าของงานสั่ง 6 ส.ค. 69 — เอาพื้นที่ไปให้ตารางกว้างขึ้น) ── */
.main.lcol .left{width:0;min-width:0;overflow:hidden;border-right:none}
.lcolbtn{position:absolute;top:50%;transform:translateY(-50%);left:0;z-index:6;width:18px;height:74px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;font-weight:800;
  border:1px solid var(--line);border-left:none;border-radius:0 8px 8px 0;background:var(--card);color:var(--blue);
  box-shadow:2px 0 6px rgba(0,0,0,.10);padding:0;font-family:inherit}
.lcolbtn:hover{background:var(--blue);color:#fff}
.main{position:relative}
@media(max-width:900px){.lcolbtn{display:none}.main.lcol .left{width:86vw;min-width:0}}
.lfilt{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.lfilt select,.lfilt input{font-family:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
.lfilt .row{display:flex;gap:6px}
.lfilt .row>*{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font-family:inherit;font-size:11.5px;font-weight:600;padding:5px 8px;border:none;background:var(--card);color:var(--mut);cursor:pointer;flex:1}
.seg button.on{background:var(--ink);color:var(--bg)}
/* 🟡 ไฮไลต์ช่องที่ "คลิกเลือก / คลิกกรอก" ได้ ทั้งหน้า (เจ้าของงานสั่ง 7 ส.ค. 69)
   ── รอบแรกทาเฉพาะตัวกรอง แล้วเจ้าของงานสั่งขยายเป็น "ทุกกรอบที่คลิกได้" + หนาขึ้น (1.5px → 2px)
   ขอบเขต = ของที่ "มีกรอบอยู่แล้วและคลิกเลือก/กรอกได้":
     • <select> ทุกตัว (10 จุด — dropdown ทุกที่ในหน้า)
     • <input> ชนิด text / number / search ทุกตัว (16 จุด — ช่องค้นหา + ช่องกรอกตัวเลข .exnum)
     • .seg = ปุ่มสลับแบบกลุ่ม (Risk สูงสุด/แย่ลงเร็วสุด · วิกฤต 6-7/ทุกระดับ)
     • .filt-grp = กลุ่ม checkbox ประเภท รพ. (ตัวมันไม่มีกรอบเอง จึงห่อกรอบให้)
   ⛔ ไม่ทา: range slider · checkbox/radio เดี่ยว ๆ · ปุ่มสั่งงาน (พิมพ์ PDF/จัดสรรอัตโนมัติ/✎/โยกช่วย)
      และ .lvlbtn (ปุ่มเป้าระดับ 0-7) เพราะ border:none อยู่แล้ว = ไม่ใช่ "กรอบ"
   🪤 ต้องมี !important — .lfilt select,.lfilt input / .seg / .exctl select / .exnum / #acpMonthSel
      (อันหลังเป็น inline style ด้วย) ตั้ง border ไว้หมดแล้วและ specificity สูงกว่า
      ถ้าลืม เส้นจะไม่ขึ้นเงียบ ๆ แบบเดียวกับบั๊ก style ซ้ำใน 7.10
   ⚠️ ตั้งแต่ border สีอย่างเดียว ไม่แตะ border-radius — ปล่อยให้แต่ละตัวคงความโค้งเดิมของมัน */
select,input[type=text],input[type=number],input[type=search],.seg,.filt-grp{
  border:2px solid var(--gold)!important}
.filt-grp{display:inline-flex;align-items:center;gap:10px;padding:3px 8px;border-radius:8px}
.filt-grp label{margin:0}
.llist{flex:1;overflow-y:auto}
.lrow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--row-strip);cursor:pointer}
.lrow:hover{background:var(--hover)}
.lrow.actv{background:var(--mid-bg)}
.lrow .rk{width:20px;font-size:11px;color:var(--mut);flex-shrink:0}
.lrow .nm{flex:1;min-width:0}
.lrow .nm .n1{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .nm .n2{font-size:10.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;border-radius:7px;font-size:12px;font-weight:700;color:#fff;padding:0 5px;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:2px}
.trend-arrow{font-size:11px;flex-shrink:0;width:16px;text-align:center}
/* RIGHT: detail */
.right{flex:1;overflow-y:auto;min-width:0}
.hint-empty{padding:60px 20px;text-align:center;color:var(--mut);font-size:14px}
.dwrap{max-width:980px;margin:0 auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
/* ยุบแถบซ้ายแล้ว → ขยายเนื้อหาเกือบเต็มจอ (เจ้าของงานสั่ง 6 ส.ค. 69)
   ใช้ !important เพราะ .dwrap หลายตัวใส่ max-width มาแบบ inline style (1200px) ซึ่งชนะ CSS ปกติ */
.main.lcol .dwrap{max-width:none!important;padding-left:26px;padding-right:26px}
.main.lcol #exTblWrap{max-height:82vh}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dhead h2{font-size:18px;font-weight:700;flex:1;min-width:200px}
.dhead .meta{font-size:12px;color:var(--mut)}
#headline{padding:10px 14px;border-radius:10px;font-size:14px;font-weight:600;line-height:1.55}
#headline.good{background:var(--good-bg);border:1px solid var(--good-bd);color:var(--good-ink)}
#headline.bad{background:var(--bad-bg);border:1px solid var(--bad-bd);color:var(--bad-ink)}
#headline.mid{background:var(--mid-bg);border:1px solid var(--mid-bd);color:var(--mid-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 11px;border-radius:99px;font-weight:600;border:1px solid var(--line);color:var(--mut);background:var(--card)}
.chip.on{background:var(--bad-bg);border-color:var(--bad-bd);color:var(--bad-ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h3{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.panel h3::before{content:'';width:4px;height:16px;border-radius:99px;background:linear-gradient(180deg,#f59e0b,#d97706)}
.panel h3 .sp{flex:1}
.tip{position:relative;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--line);color:var(--mut);font-size:10px;font-weight:700;font-family:Georgia,serif;cursor:help;flex-shrink:0;vertical-align:middle}
.tip:hover,.tip:focus,.tip.show{background:var(--blue);color:#fff;outline:none}
.tip .tip-box{display:none;position:absolute;z-index:90;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);width:max-content;max-width:min(300px,80vw);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:11.5px;font-weight:400;line-height:1.6;color:var(--ink);white-space:pre-line;text-align:left;box-shadow:0 10px 28px var(--shadow);cursor:auto}
.tip:hover .tip-box,.tip:focus .tip-box,.tip.show .tip-box{display:block}
.tip .tip-box::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--card)}
.tip .tip-box b{color:var(--blue)}
h3 .tip{margin:0 2px}
.metric-tabs{display:flex;gap:4px}
.mtab{font-family:inherit;font-size:11.5px;font-weight:600;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--mut);cursor:pointer}
.mtab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.peer-tabs{display:flex;gap:4px}
.chartbox{position:relative;height:260px}
.decomp-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dcard .lbl{font-size:12px;color:var(--mut);font-weight:600}
.dcard .tot{font-size:19px;font-weight:700;margin:4px 0}
.dcard .brk{font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.dcard .brk b{font-variant-numeric:tabular-nums}
@media(max-width:640px){.decomp-row{grid-template-columns:1fr}}
.wf-toggle{display:flex;justify-content:flex-end;margin-bottom:8px}
.wf-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.wf-cols{grid-template-columns:1fr}}
.wf-title{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.wf-row{padding:6px 0;border-bottom:1px solid var(--row-strip)}
.wf-row .top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.wf-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.wf-row .dl{font-weight:700;white-space:nowrap}
.wf-bar{height:5px;border-radius:3px;background:var(--row-strip);overflow:hidden;margin-top:3px;position:relative}
.wf-bar>i{display:block;height:100%;border-radius:3px;position:absolute;top:0}
table.acctbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.acctbl th{background:var(--th-bg);color:var(--mut);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.acctbl th:nth-child(1),table.acctbl th:nth-child(2){text-align:left}
table.acctbl td{padding:5px 8px;border-bottom:1px solid var(--row-strip);text-align:right;white-space:nowrap}
table.acctbl td:nth-child(1),table.acctbl td:nth-child(2){text-align:left;white-space:normal}
.clstag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px}
.clstag.CA,.clstag.REV{background:var(--good-bg);color:var(--good-ink)}
.clstag.CL,.clstag.EXP{background:var(--bad-bg);color:var(--bad-ink)}
.note{font-size:11.5px;color:var(--mut)}
.src-note{font-size:11px;color:var(--mut);background:var(--th-bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;line-height:1.5;margin-bottom:10px}
.acctbl-wrap{max-height:340px;overflow-y:auto}
.nibridge-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
@media(max-width:640px){.nibridge-row{grid-template-columns:1fr}}
table.wltbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.wltbl th{background:var(--th-bg);color:var(--mut);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.wltbl th.exsortth{cursor:pointer;user-select:none}
table.wltbl th.exsortth:hover{color:var(--ink)}
table.wltbl th.exsortth.on{color:var(--blue)}
table.wltbl td{padding:8px;border-bottom:1px solid var(--row-strip);vertical-align:top}
/* ตารางผลจำลอง #exec (14 คอลัมน์ กว้างเกินจอมือถือ): ตรึงคอลัมน์ "โรงพยาบาล" ไว้ตอนปัดแนวนอน
   → ปัดไปดูคอลัมน์ขวาสุดแล้วยังรู้ว่าเป็นแถวของ รพ. ไหน (เดิมหลุดบริบททันทีที่ปัด)
   ช่องแรก (จังหวัด) ยอมให้เลื่อนลอดใต้ไป — ยังกรองจังหวัดจาก dropdown เหนือตารางได้อยู่
   ⚠️ พื้นหลังต้องทึบ (var) ไม่งั้นเนื้อคอลัมน์อื่นทะลุขึ้นมาซ้อนตอนเลื่อน · ถูกทั้ง light/dark
   ── เพิ่ม 5 ส.ค. 69: ตรึงหัวตารางแนวตั้งด้วย (เลื่อนลงดูแถวล่างแล้วยังเห็นชื่อคอลัมน์) ──
   ⚠️ sticky top ทำงานได้ต่อเมื่อกรอบที่ครอบมี max-height จริง (เกิดการเลื่อนในกรอบ)
      ถ้ากรอบเป็น max-height:none กรอบนั้นไม่เคยเลื่อนแนวตั้ง หัวตารางจะไม่ติดตามเลย — ดู #exTblWrap
   ⚠️ ขอบล่างหัวตารางใช้ box-shadow ไม่ใช้ border เพราะ border ของเซลล์ sticky หายตอนเลื่อนในบางเบราว์เซอร์
   ⚠️ z-index: หัวมุมซ้าย (ชื่อ รพ. × หัวตาราง) ต้องสูงสุด ไม่งั้นถูกทับตอนเลื่อนสองแกนพร้อมกัน */
table.wltbl.ex-sticky th{position:sticky;top:0;z-index:3;box-shadow:0 1px 0 var(--line)}
table.wltbl.ex-sticky td:nth-child(2){position:sticky;left:0;z-index:2;background:var(--card);box-shadow:1px 0 0 var(--line)}
table.wltbl.ex-sticky th:nth-child(2){left:0;z-index:5;background:var(--th-bg);box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
/* 💰 กลุ่มคอลัมน์ "เงินที่ต้องสนับสนุนให้ผ่านเกณฑ์รายตัว" (เจ้าของงานสั่ง 11 ส.ค. 69)
   ทำเป็น "แถบสีอ่อน + ป้ายเล็กในหัวคอลัมน์ทุกช่อง" ไม่ใช้หัวตาราง 2 ชั้น (<tr> หัวกลุ่ม + colspan) โดยตั้งใจ:
   หัวตารางนี้ sticky top:0 อยู่ (ex-sticky) ถ้ามี 2 แถว แถวที่สองต้องตั้ง top เป็นความสูงแถวแรกแบบ hardcode
   ซึ่งพังทันทีที่ข้อความหัวตารางตัดบรรทัดต่างจากที่คาดบนจอแคบ → สองแถวจะทับกัน
   ⚠️ th ต้องทึบเพราะ sticky (ไม่งั้นเนื้อแถวทะลุขึ้นมา) จึงทาสีทับด้วย background-image ไม่ใช้ rgba เดี่ยว
   ⚠️ ใช้สีเดียวทั้ง light/dark โดยตั้งใจ — เป็น rgba ทับพื้นเดิม จึงอ่านออกทั้งสองธีม */
:root{--exneed:rgba(99,160,255,.10)}
table.wltbl th.exneed{background-color:var(--th-bg);background-image:linear-gradient(var(--exneed),var(--exneed))}
table.wltbl td.exneed{background-image:linear-gradient(var(--exneed),var(--exneed))}
/* 📂 แผงยุบ/ขยายในแท็บผู้บริหาร (12 ส.ค. 69) — เนื้อในยังเรนเดอร์อยู่ แค่ซ่อนด้วย CSS */
.exsec-h{display:flex;align-items:flex-start;gap:8px;cursor:pointer;user-select:none;border-radius:8px;margin:-4px -6px 0;padding:4px 6px}
.exsec-h:hover{background:var(--hover)}
.exsec-ar{color:var(--blue);font-size:13px;line-height:1.5;flex-shrink:0}
.exsec-t{flex:1;min-width:0}
.exsec-t h3{margin-bottom:0!important}
.exsec-b{display:none;margin-top:6px}
.exsec.on .exsec-b{display:block}
table.wltbl td.ndcell{cursor:pointer}
table.wltbl td.ndcell:hover{outline:1px solid var(--blue);outline-offset:-1px}
.ndgrp{display:block;font-size:9.5px;font-weight:700;color:var(--blue);letter-spacing:.2px}
.thsub{font-size:10px;font-weight:600;opacity:.75}
table.wltbl tr.click{cursor:pointer}
table.wltbl tr.click:hover{background:var(--hover)}
table.wltbl .bullets{margin:0;padding-left:14px}
table.wltbl .bullets li{margin-bottom:2px}
.backlink{font-size:12.5px;color:var(--blue);cursor:pointer;text-decoration:none}
.backlink:hover{text-decoration:underline}
details.refpanel{border:1px solid var(--line);border-radius:12px;background:var(--card)}
details.refpanel summary{padding:12px 16px;font-weight:700;font-size:13.5px;cursor:pointer;list-style:none}
details.refpanel summary::-webkit-details-marker{display:none}
details.refpanel summary::before{content:'▶ ';font-size:11px}
details.refpanel[open] summary::before{content:'▼ '}
.refbody{padding:0 16px 16px}
.wl-panel summary{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.wl-panel summary .meta{font-weight:400}
.pillar-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(max-width:720px){.pillar-grid{grid-template-columns:1fr}}
.pillar-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pillar-card h4{font-size:12.5px;margin-bottom:6px}
.pillar-card ul{padding-left:16px;font-size:12px;color:var(--mut);line-height:1.6}
table.systbl{width:100%;border-collapse:collapse;font-size:12px}
table.systbl th{background:var(--th-bg);padding:6px 8px;border:1px solid var(--line);text-align:left}
table.systbl td{padding:8px;border:1px solid var(--line);vertical-align:top;line-height:1.6}
table.systbl td ul{padding-left:16px;margin:0}
.eff-tbl{width:100%;border-collapse:collapse;font-size:13px}
.eff-tbl th{background:var(--th-bg);color:var(--mut);padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
.eff-tbl td{padding:7px 8px;border-bottom:1px solid var(--row-strip)}
.eff-pass{color:var(--green);font-weight:700}
.eff-fail{color:var(--red);font-weight:700}
/* ── Gap-to-Target Solver ─────────────────────────────── */
table.gaptbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.gaptbl th{background:var(--th-bg);color:var(--mut);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.gaptbl th:first-child,table.gaptbl td:first-child{text-align:left}
table.gaptbl th.l,table.gaptbl td.l{text-align:left}
table.gaptbl td{padding:6px 8px;border-bottom:1px solid var(--row-strip);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.gaptbl td.opt{text-align:left;white-space:normal;font-size:11.5px;color:var(--mut);line-height:1.5}
table.gaptbl tr.pass-row td{opacity:.72}
.lvchip{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap}
.lvchip.flow{background:var(--good-bg);color:var(--good-ink)}
.lvchip.stock{background:var(--mid-bg);color:var(--mid-ink)}
.gp-pass{color:var(--green);font-weight:700}
.gp-fail{color:var(--red);font-weight:700}
.ladder{display:flex;flex-direction:column;margin-top:4px}
.ladder .rung{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--row-strip)}
.ladder .rung:last-child{border-bottom:none}
.rung .rbadge{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;flex-shrink:0}
.rung .rmain .rl{font-size:13px;font-weight:600}
.rung .rmain .rs{font-size:11.5px;color:var(--mut);line-height:1.45}
.rung .rcost{text-align:right;font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rung .rcost .cf{color:var(--good-ink);font-weight:700}
.rung .rcost .cs{color:var(--mid-ink);font-weight:700}
.rung .rcost .cl{font-size:10px;color:var(--mut);display:block}
.gap-note{font-size:11.5px;color:var(--mut);background:var(--th-bg);border:1px solid var(--line);border-radius:8px;padding:8px 11px;line-height:1.55;margin-top:8px}
.gap-note b{color:var(--ink)}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:20px;vertical-align:-5px}
.spark i{width:5px;border-radius:1px;display:block;min-height:1px}
.gap-hl{padding:9px 13px;border-radius:9px;font-size:13px;font-weight:600;line-height:1.5;margin-bottom:10px}
.gap-hl.flow{background:var(--good-bg);border:1px solid var(--good-bd);color:var(--good-ink)}
.gap-hl.stock{background:var(--mid-bg);border:1px solid var(--mid-bd);color:var(--mid-ink)}
.gap-hl.done{background:var(--good-bg);border:1px solid var(--good-bd);color:var(--good-ink)}
/* ── NI Bridge (สะพานกำไร 3 ชั้น) ─────────────────────── */
.ni-bridge{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:stretch;gap:8px;margin:2px 0 4px}
.ni-tier{border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:center}
.ni-tier .lbl{font-size:11.5px;font-weight:600;line-height:1.35}
.ni-tier .lbl span{font-size:10px;color:var(--mut);font-weight:400}
.ni-tier .val{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.ni-tier.pos{background:var(--good-bg);border-color:var(--good-bd)}
.ni-tier.pos .val{color:var(--good-ink)}
.ni-tier.neg{background:var(--bad-bg);border-color:var(--bad-bd)}
.ni-tier.neg .val{color:var(--bad-ink)}
.ni-op{display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:11px;color:var(--mut);white-space:nowrap;padding:0 2px;font-weight:600}
.ni-op b{color:var(--ink);font-variant-numeric:tabular-nums}
.ni-verdict{padding:10px 13px;border-radius:9px;font-size:13px;line-height:1.55;margin-top:10px}
.ni-verdict.good{background:var(--good-bg);border:1px solid var(--good-bd);color:var(--good-ink)}
.ni-verdict.mid{background:var(--mid-bg);border:1px solid var(--mid-bd);color:var(--mid-ink)}
.ni-verdict.bad{background:var(--bad-bg);border:1px solid var(--bad-bd);color:var(--bad-ink)}
@media(max-width:640px){.ni-bridge{grid-template-columns:1fr}.ni-op{flex-direction:row;gap:6px;padding:2px 0}}
/* ── Payables Stress (เจ้าหนี้การค้ารายหมวด) ───────────── */
.mo-chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mo-chip.hi{background:var(--bad-bg);color:var(--bad-ink)}
.mo-chip.warn{background:var(--th-bg);color:var(--gold)}
.mo-chip.ok{background:var(--good-bg);color:var(--good-ink)}
.mo-chip.na{color:var(--mut)}
.pay-recon{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.5}
.pay-sub{font-size:12px;font-weight:700;color:var(--mut);margin:14px 0 4px;text-transform:none}
/* ── D: Survival Simulator ─────────────────────────────── */
.surv-ctrl{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin-bottom:12px}
@media(max-width:560px){.surv-ctrl{grid-template-columns:1fr}}
.surv-ctrl .fld{display:flex;flex-direction:column;gap:3px}
.surv-ctrl label{font-size:12.5px;color:var(--mut)}
.surv-ctrl label b{color:var(--ink);font-variant-numeric:tabular-nums}
.surv-ctrl input[type=range]{width:100%;accent-color:var(--blue);cursor:pointer}
.surv-sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.surv-pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12.5px;background:var(--card)}
.surv-pill .rb{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.surv-pill.out{background:var(--bad-bg);border-color:var(--bad-bd);color:var(--bad-ink);font-weight:600}
.surv-pill.down{background:var(--good-bg);border-color:var(--good-bd)}
.surv-pill.up{background:var(--bad-bg);border-color:var(--bad-bd);color:var(--bad-ink);font-weight:600}
.surv-base{display:block;font-size:10.5px;color:var(--mut);margin-top:3px;line-height:1.4}
.surv-base b{color:var(--ink);font-variant-numeric:tabular-nums}
.surv-base a{color:var(--blue);text-decoration:none}.surv-base a:hover{text-decoration:underline}
.surv-chartbox{position:relative;height:170px}
.surv-now{font-size:12.5px;color:var(--mut);margin-bottom:8px}
.surv-now b{color:var(--ink);font-variant-numeric:tabular-nums}
.surv-now b.neg{color:var(--red)}.surv-now b.pos{color:var(--green)}
.surv-cash-cap{font-size:11px;color:var(--mut);margin:10px 0 4px}
/* เป้าหมายระดับวิกฤตภายใน ก.ย. (Target Solver — แก้สมการย้อนกลับ) */
.tgt-box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;background:var(--bg)}
.tgt-title{font-size:12.5px;font-weight:700;margin-bottom:10px}
.tgt-title b{color:var(--blue)}
.lvlbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;margin-bottom:18px}
.lvlbtn{width:36px;height:36px;border-radius:10px;border:none;color:#fff;font-weight:800;font-size:15px;font-family:inherit;cursor:pointer;opacity:.45;transition:opacity .12s,transform .12s;position:relative}
.lvlbtn:hover{opacity:.85}
.lvlbtn.cur{opacity:1;outline:2.5px solid var(--ink);outline-offset:2px}
.lvlbtn.cur::after{content:'ปัจจุบัน';position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:8.5px;font-weight:600;color:var(--mut);margin-top:5px;white-space:nowrap}
.lvlbtn.on{opacity:1;transform:scale(1.12);box-shadow:0 3px 10px rgba(0,0,0,.35)}
.tgt-legend{font-size:10.5px;color:var(--mut);margin-bottom:8px;line-height:1.5}
.tgt-card{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 12px}
.tgt-card h4{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tgt-rb{display:inline-flex;width:24px;height:24px;border-radius:7px;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
.tgt-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line);font-size:12.5px;flex-wrap:wrap;line-height:1.55}
.tgt-row:first-of-type{border-top:none}
.tgt-row b{font-variant-numeric:tabular-nums}
.tgt-delta{font-weight:700;font-variant-numeric:tabular-nums;border-radius:6px;padding:1px 8px;font-size:11.5px;white-space:nowrap}
.tgt-delta.pos{background:var(--good-bg);color:var(--good-ink)}
.tgt-delta.neg{background:var(--bad-bg);color:var(--bad-ink)}
.tgt-apply{margin-left:auto;font-family:inherit;font-size:11px;font-weight:600;padding:4px 11px;border:1px solid var(--blue);border-radius:7px;background:var(--card);color:var(--blue);cursor:pointer;white-space:nowrap;flex-shrink:0}
.tgt-apply:hover{background:var(--blue);color:#fff}
.tgt-live{margin-top:8px;padding:8px 11px;border-radius:8px;background:var(--bg);font-size:12px;border:1px dashed var(--line);line-height:1.55}
.tgt-note{font-size:10.5px;color:var(--mut)}
.tgt-warn{color:var(--bad-ink);font-weight:600}
/* Overview Allocation Planner */
.ovm{display:flex;flex-direction:column;gap:2px;font-size:11.5px;white-space:nowrap}
.ovm label{cursor:pointer;display:flex;align-items:center;gap:4px}
.ovm input[type=radio]{margin:0;accent-color:var(--blue)}
.ovlink{font-size:10.5px;color:var(--blue);text-decoration:none;white-space:nowrap}
.ovlink:hover{text-decoration:underline}
.ovtgl{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 8px;font-size:11px;font-family:inherit;cursor:pointer;white-space:nowrap}
.ovbulk-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:2px}
.ovbulk{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ovbulkbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:11.5px;font-family:inherit;cursor:pointer;white-space:nowrap}
.ovbulkbtn:hover{background:var(--hover);border-color:var(--blue)}
/* แถบยกแผนข้ามงวด — ขึ้นหัวแท็บ #exec เท่านั้น ไม่ติดไปกับ PDF (no-print) */
.excarry{border:1px solid var(--gold);border-left:4px solid var(--gold);background:var(--th-bg);border-radius:9px;padding:10px 13px;margin-bottom:12px;font-size:12.5px;line-height:1.6}
.excarry.done{border-color:var(--green);border-left-color:var(--green);display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.excarry.done>div:first-child{flex:1 1 100%}
.excarry-d{color:var(--mut);font-size:11.5px;margin-top:4px}
.excarry-u{margin:5px 0 0;padding-left:18px}
.excarry-u li{margin-bottom:3px}
.excarry-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.excarry-b .tgt-apply{margin-left:0;font-size:12px;padding:5px 13px}
.ovtgl:hover{background:var(--hover)}
tr.ovbad td{background:rgba(220,60,60,.06)}
tr.ovsub td{background:var(--hover);padding:10px 14px}
.ovsub-box{display:flex;flex-direction:column;gap:10px}
.ovsub-box .fld{display:flex;flex-direction:column;gap:3px}
.ovsub-box .fld label{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.ovsub-box input[type=range]{width:100%;max-width:520px;accent-color:var(--blue);cursor:pointer}
.ovsub-box select{font-family:inherit;font-size:11.5px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 4px}
/* ── แผงเจาะเกณฑ์ 7 คะแนน (คลิก badge คอลัมน์ "ระดับ ก.ย.69 หลังช่วย") ── */
.badge.brkbadge{cursor:pointer;transition:transform .1s,box-shadow .1s}
.badge.brkbadge:hover{transform:scale(1.12);box-shadow:0 2px 8px var(--shadow)}
.badge.brkbadge.on{outline:2.5px solid var(--ink);outline-offset:2px}
.brk-head{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.brk-lvl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
table.brktbl th:nth-child(2),table.brktbl td:nth-child(2){text-align:center;color:var(--mut);font-size:11.5px}
table.brktbl th:nth-child(3),table.brktbl td:nth-child(3){border-left:1px solid var(--line)}
table.brktbl th:nth-child(5),table.brktbl td:nth-child(5){background:var(--mid-bg)}
table.brktbl th:nth-child(6),table.brktbl td:nth-child(6){border-left:1px solid var(--line);font-size:11.5px;white-space:nowrap}
table.brktbl .brk-ok{color:var(--green);font-weight:600}
table.brktbl .brk-no{color:var(--red);font-weight:600}
table.brktbl .brk-d{display:block;font-size:10.5px;font-weight:400;color:var(--mut)}
table.brktbl tr.brk-tot td{border-top:1.5px solid var(--line);border-bottom:none;font-size:13px}
/* แถวเงินสดสำรอง MOE — ไม่ใช่เกณฑ์คะแนน จึงคุมโทนให้ต่างจากแถวเกณฑ์ */
table.brktbl tr.brk-res td{border-top:1px dashed var(--line);font-size:12px;color:var(--mut)}
table.brktbl tr.brk-res td b{color:var(--ink)}
/* ตาราง "ปัจจัยที่จะทำให้ตกระดับ" — คนละชุดคอลัมน์กับตารางเกณฑ์ จึงล้าง override ของ brktbl ทิ้ง */
table.risktbl th,table.risktbl td{text-align:right}
table.risktbl th:nth-child(n),table.risktbl td:nth-child(n){border-left:none;background:none;white-space:nowrap}
table.risktbl th:first-child,table.risktbl td:first-child{text-align:center}
table.risktbl td.l,table.risktbl th.l{text-align:left;white-space:normal}
table.risktbl th{font-size:11.5px;line-height:1.35;vertical-align:bottom}
table.risktbl td:last-child{font-size:11.5px;white-space:normal}
/* ── Executive tab (แนวทางสำหรับผู้บริหาร) ── */
.extbl input[type=range]{width:150px;max-width:38vw;accent-color:var(--blue);cursor:pointer;vertical-align:middle}
.exchip{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.exchip.op{color:var(--blue);border-color:var(--blue)}
.exchip.ip{color:var(--orange);border-color:var(--orange)}
.exchip.pp{color:var(--green);border-color:var(--green)}
.exchip.warn{color:var(--red);border-color:var(--red)}
.exctl{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.exctl label{display:flex;align-items:center;gap:5px;cursor:pointer}
.exctl select{font-family:inherit;font-size:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.optgrp{border:1px solid var(--line);border-radius:10px;padding:6px 12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--bg)}
.optgrp-lbl{font-weight:700;color:var(--mut);font-size:11px;white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
.hubchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:7px;padding:3px 4px 3px 9px}
.hubchip b{cursor:pointer;color:var(--red);font-weight:700;padding:0 3px}
/* 🔄 โยกเงินช่วยกัน: ปุ่มในเซลล์ + ป้ายบอกที่มาของเงินที่รับโยกมา */
.xfbtn{font-family:inherit;font-size:10.5px;font-weight:600;padding:1px 6px;border:1px solid var(--blue);border-radius:6px;background:var(--card);color:var(--blue);cursor:pointer;white-space:nowrap;margin-top:2px}
.xfbtn.on{background:var(--blue);color:#fff}
/* ป้ายผู้สนับสนุน: เรียง "ลงล่าง" ทีละบรรทัด ไม่ต่อไปทางขวา (ไม่งั้นตารางยืดจนบังคอลัมน์อื่น) */
.xfin{display:flex;align-items:center;justify-content:space-between;gap:3px;font-size:10px;font-weight:600;color:var(--green);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 3px 1px 6px;margin:2px 0 0 0;max-width:190px}
.xfin b{cursor:pointer;color:var(--red);padding:0 2px;flex-shrink:0}
.arbtn{font-family:inherit;font-size:10px;padding:0 4px;border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--mut);cursor:pointer;margin-left:3px}
.arbtn:hover{border-color:var(--blue);color:var(--blue)}
/* โหมดกว้าง: คอลัมน์ชื่อ รพ. แคบลง ตัดคำ + ซ่อนคอลัมน์จังหวัดไปเลย */
table.wltbl.ex-sticky td.wide-name{max-width:120px;white-space:normal;line-height:1.25}
/* โหมดกว้างซ่อนคอลัมน์จังหวัด → ชื่อ รพ. กลายเป็นคอลัมน์ที่ 1 ต้องย้าย sticky มาที่ 1 ไม่งั้นตรึงผิดคอลัมน์ */
table.wltbl.ex-sticky.ex-wide td:nth-child(2){position:static;background:transparent;box-shadow:none}
table.wltbl.ex-sticky.ex-wide th:nth-child(2){left:auto;z-index:3;box-shadow:0 1px 0 var(--line)}
table.wltbl.ex-sticky.ex-wide td:nth-child(1){position:sticky;left:0;z-index:2;background:var(--card);box-shadow:1px 0 0 var(--line)}
table.wltbl.ex-sticky.ex-wide th:nth-child(1){left:0;z-index:5;background:var(--th-bg);box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
/* บรรทัดย่อยในเซลล์ตาราง (เช่น "พอจ่าย MOE X เดือน" ใต้ยอดเงินสด) */
.cellsub{display:block;font-size:10.5px;font-weight:400;color:var(--mut);white-space:nowrap}
.cellsub.warn{color:var(--red)}
/* เซลล์ที่กดดูรายชื่อ รพ. ได้ ในตารางสรุปรายจังหวัด (คอลัมน์เงินช่วย + ส่วนขาด) */
.provcap{cursor:pointer}
.provcap:hover{outline:2px solid var(--gold);outline-offset:-2px}
.exhist{display:inline-flex;gap:3px;align-items:center;flex-wrap:wrap}
.exhist .b{min-width:26px;text-align:center;border-radius:7px;color:#fff;font-weight:800;font-size:11.5px;padding:3px 4px}
.exnum{font-family:inherit;font-size:12px;width:90px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
/* ปุ่ม + ป็อปอัปประมาณการ NI รายหมวด (แนว Planfin) */
.planfin-btn{font-family:inherit;font-size:11px;font-weight:600;padding:2px 9px;border:1px solid var(--blue);border-radius:7px;background:var(--card);color:var(--blue);cursor:pointer;margin-left:8px;white-space:nowrap;vertical-align:middle}
.planfin-btn:hover{background:var(--blue);color:#fff}
.nip-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
.nip-modal{background:var(--card);border:1px solid var(--line);border-radius:14px;width:100%;max-width:780px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.nip-head{padding:14px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.nip-head h3{font-size:15px;font-weight:700}
.nip-head .note{margin-top:5px;font-size:11.5px;line-height:1.5}
.nip-body{padding:12px 18px;overflow-y:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 24px;align-content:start}
.nip-col{min-width:0}
@media(max-width:620px){.nip-body{grid-template-columns:1fr}}
.nip-col h4{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:2px 0 6px;position:sticky;top:0;background:var(--card);padding-bottom:3px;z-index:1}
.nip-col h4 .nip-100{font-weight:400;text-transform:none;font-size:10.5px;letter-spacing:0}
.nip-stack{display:flex;height:14px;border-radius:4px;overflow:hidden;margin-bottom:8px;background:var(--bg)}
.nip-seg{height:100%;flex-shrink:0}
.nip-row{display:flex;align-items:center;gap:6px;padding:3px 0}
.nip-row label{flex:1 1 32%;font-size:11.5px;line-height:1.25;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nip-row .nip-sl{flex:1 1 54px;min-width:42px;accent-color:var(--blue);cursor:pointer}
.nip-row .nip-num{width:64px;font-family:inherit;font-size:12.5px;text-align:right;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;flex-shrink:0}
.nip-row .nip-num:focus{outline:none;border-color:var(--blue)}
.nip-row .u{font-size:10px;color:var(--mut);flex-shrink:0}
.nip-row.nip-lockrow label{color:var(--mut)}
.nip-row .nip-slgap{flex:1 1 54px;min-width:42px}   /* กันคอลัมน์ให้ตรงกับแถวที่มีสไลด์บาร์ */
.nip-row .nip-lockv{width:64px;font-size:12.5px;text-align:right;padding:3px 6px;border:1px dashed var(--line);border-radius:6px;color:var(--mut);font-variant-numeric:tabular-nums;flex-shrink:0;background:var(--th-bg)}
.nip-lockmsg{font-size:11px;color:var(--mut);background:var(--th-bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;margin-top:6px;line-height:1.5}
.nip-row .nip-pct{width:28px;text-align:right;font-size:10.5px;color:var(--mut);font-variant-numeric:tabular-nums;flex-shrink:0}
.nip-row .nip-mbar{width:34px;height:8px;background:var(--bg);border-radius:3px;overflow:hidden;flex-shrink:0}
.nip-row .nip-mbar-f{display:block;height:100%;border-radius:3px}
@media(max-width:400px){.nip-row .nip-mbar{display:none}}
.nip-foot{padding:12px 18px;border-top:1px solid var(--line);flex-shrink:0}
.nip-totline{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.nip-totline b{font-variant-numeric:tabular-nums;color:var(--ink)}
.nip-ni{margin-left:auto;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.nip-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:11px}
.nip-btns button{font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 15px;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.nip-btns button:hover{background:var(--hover)}
.nip-btns .primary{background:var(--blue);border-color:var(--blue);color:#fff}
.nip-btns .primary:hover{filter:brightness(1.1)}
.dp-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.dp-row .dp-lab{flex:1 1 42%;min-width:0}
.dp-row .dp-lab .nm{font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-row .dp-lab .ctx{font-size:10px;color:var(--mut)}
.dp-row input[type=range]{flex:1 1 90px;min-width:56px;accent-color:var(--blue);cursor:pointer}
.dp-row .dp-num,.dp-row .acp-num{width:70px;font-family:inherit;font-size:12.5px;text-align:right;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;flex-shrink:0}
.dp-row .u{font-size:10px;color:var(--mut);flex-shrink:0}
.dp-net{font-size:12.5px;line-height:1.55}
.dp-net b{font-variant-numeric:tabular-nums}
.cl-panel-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.cl-panel-tbl th,.cl-panel-tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.cl-panel-tbl th{color:var(--mut);font-weight:600;font-size:11px}
.cl-panel-tbl td.l,.cl-panel-tbl th.l{text-align:left}
.cl-panel-tbl .clbar{height:7px;border-radius:3px;background:var(--blue);display:inline-block;vertical-align:middle}
.cl-panel-tbl tfoot td{font-weight:700;border-top:2px solid var(--line)}
.panel{overflow-x:auto}
.acctbl-wrap{overflow-x:auto}
@media(max-width:768px){
  #menuBtn{display:inline-flex;align-items:center;justify-content:center}
  header h1{font-size:14.5px}
  header .sub{font-size:10.5px}
  .left{position:fixed;top:0;left:0;bottom:0;width:86vw;max-width:360px;z-index:50;
    transform:translateX(-100%);transition:transform .25s ease;box-shadow:4px 0 24px var(--shadow)}
  .left.open{transform:translateX(0)}
  .drawer-close{display:flex;justify-content:flex-end;padding:8px 12px 0}
  .drawer-close button{font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;
    border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
  .dwrap{padding:14px 12px}
  .dhead h2{font-size:16px}
  .decomp-row,.nibridge-row,.pillar-grid{grid-template-columns:1fr}
  /* Watchlist: ตาราง 8 คอลัมน์ → การ์ดต่อ รพ. (ไม่ต้องปัดซ้าย-ขวา) — เฉพาะ .wl-card เท่านั้น
     ตาราง .wltbl อื่น (แท็บผู้บริหาร: ผลจำลอง/Option/MOE/รายรับ) คงเป็นตารางปกติ เลื่อนแนวนอนใน wrap */
  table.wltbl.wl-card{display:block}
  table.wltbl.wl-card tbody{display:block}
  table.wltbl.wl-card tr:first-child{display:none}
  table.wltbl.wl-card tr.click{display:flex;flex-direction:column;position:relative;
    border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:10px 52px 10px 12px;background:var(--card)}
  table.wltbl.wl-card tr.click:hover{background:var(--hover)}
  table.wltbl.wl-card td{display:block;border:none;padding:2px 0;white-space:normal}
  table.wltbl.wl-card td:nth-child(1){order:2;font-size:11.5px;color:var(--mut)}
  table.wltbl.wl-card td:nth-child(1)::before{content:'จ.'}
  table.wltbl.wl-card td:nth-child(2){order:1;font-size:14px}
  table.wltbl.wl-card td:nth-child(3){position:absolute;top:10px;right:12px;padding:0}
  table.wltbl.wl-card td:nth-child(4){order:3;font-size:12.5px}
  table.wltbl.wl-card td:nth-child(4)::before{content:'Cash ratio: ';color:var(--mut);font-size:11.5px}
  table.wltbl.wl-card td:nth-child(5){order:4;font-size:12.5px}
  table.wltbl.wl-card td:nth-child(5)::before{content:'เงินบำรุงสุทธิ: ';color:var(--mut);font-size:11.5px}
  table.wltbl.wl-card td:nth-child(6){order:5;font-size:12.5px}
  table.wltbl.wl-card td:nth-child(6)::before{content:'เงินสดพอจ่าย MOE: ';color:var(--mut);font-size:11.5px}
  table.wltbl.wl-card td:nth-child(6) .cellsub{display:inline;font-size:11.5px}
  table.wltbl.wl-card td:nth-child(7){order:6;margin-top:6px}
  table.wltbl.wl-card td:nth-child(7)::before{content:'สาเหตุ/ประเด็นชี้ปัญหา';display:block;font-weight:700;font-size:11.5px;color:var(--mut);margin-bottom:2px}
  table.wltbl.wl-card td:nth-child(8){order:7;margin-top:6px}
  table.wltbl.wl-card td:nth-child(8)::before{content:'คำแนะนำเฉพาะ รพ.';display:block;font-weight:700;font-size:11.5px;color:var(--mut);margin-bottom:2px}
  /* ตาราง .wltbl ที่เหลือบนมือถือ: เลื่อนแนวนอนได้ ไม่ล้นจอ */
  .acctbl-wrap{overflow-x:auto}
  /* คอลัมน์ที่ตรึงต้องไม่กินจอ — จำกัดความกว้างแล้วให้ชื่อ รพ. ตัดบรรทัดแทน */
  table.wltbl.ex-sticky td:nth-child(2){max-width:124px}
  table.wltbl.ex-sticky td:nth-child(2) .ovlink{font-size:10.5px}
  /* Gap-to-Target: ตาราง 6 คอลัมน์ → การ์ดต่อเกณฑ์ (ไม่ต้องปัดซ้าย-ขวา) */
  table.gaptbl{display:block}
  table.gaptbl tbody{display:block}
  table.gaptbl tr:first-child{display:none}
  table.gaptbl tr{display:block;position:relative;border:1px solid var(--line);border-radius:10px;
    margin:0 0 8px;padding:9px 40px 9px 11px;background:var(--card)}
  table.gaptbl tr.pass-row{opacity:1}
  table.gaptbl tr.pass-row td{opacity:1}
  table.gaptbl td{display:block;border:none;padding:1px 0;text-align:left!important;white-space:normal}
  table.gaptbl td:nth-child(1){font-size:13.5px;font-weight:600}
  table.gaptbl td:nth-child(2){font-size:12.5px;display:inline-block;margin-right:12px}
  table.gaptbl td:nth-child(2)::before{content:'ค่า: ';color:var(--mut);font-weight:400}
  table.gaptbl td:nth-child(3){font-size:12px;display:inline-block;color:var(--mut)}
  table.gaptbl td:nth-child(3)::before{content:'เกณฑ์ '}
  table.gaptbl td:nth-child(4){font-size:12px;margin-top:3px}
  table.gaptbl td:nth-child(5){margin-top:4px}
  table.gaptbl td:nth-child(6){position:absolute;top:9px;right:11px;font-size:15px;padding:0}
}
/* ── Print / บันทึก PDF (แท็บผู้บริหาร) — ซ่อน chrome+ตัวปรับแต่ง เก็บตาราง/ค่า แล้ว window.print() ── */
.print-head{display:none}
/* ── ผังที่มาข้อมูล (#data) — SVG node-link + การ์ดอธิบายรายขั้น ── */
.lin-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 2px 2px}
/* SVG ย่อ/ขยายตามความกว้างกรอบ (viewBox คงที่) — จอกว้างเห็นครบ 7 ขั้นไม่ต้องเลื่อน
   min-width กันไม่ให้ตัวอักษรเล็กจนอ่านไม่ออกบนมือถือ (เลื่อนแนวนอนแทน) */
.lin-wrap svg{display:block;width:100%;height:auto;min-width:1080px}
.lin-node{cursor:pointer}
.lin-node rect{fill:var(--card);stroke:var(--line);stroke-width:1.5;rx:7}
.lin-node:hover rect,.lin-node.on rect{stroke-width:2.5}
.lin-node text{fill:var(--ink);font-size:11px;font-weight:600;pointer-events:none}
.lin-node text.sub{fill:var(--mut);font-size:9.5px;font-weight:400}
.lin-link{fill:none;stroke:var(--mut);stroke-width:1.2;opacity:.28}
.lin-link.hot{stroke:var(--blue);stroke-width:2.4;opacity:1}
.lin-col{fill:var(--mut);font-size:10px;font-weight:700;letter-spacing:.2px}
.lin-colbg{fill:var(--th-bg);opacity:.5;rx:6}
.lin-dim{opacity:.22}
.lin-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin:6px 2px 0;align-items:center}
.lin-legend b{color:var(--ink)}
.lin-sw{display:inline-block;width:11px;height:11px;border-radius:3px;border:1.5px solid;vertical-align:-1px;margin-right:3px}
.lin-card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:10px 12px;margin:8px 0;scroll-margin-top:12px}
.lin-card.on{box-shadow:0 0 0 2px var(--blue)}
.lin-card h4{margin:0 0 2px;font-size:14px}
.lin-card .who{font-size:11px;color:var(--mut);margin-bottom:6px;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.lin-card p{margin:5px 0;font-size:12.5px;line-height:1.75}
.lin-card ul{margin:4px 0 4px 18px;font-size:12.5px;line-height:1.75}
.lin-plain{background:var(--mid-bg);border:1px solid var(--mid-bd);color:var(--mid-ink);border-radius:6px;padding:7px 10px;margin:6px 0;font-size:12.5px;line-height:1.7}
.lin-trap{background:var(--bad-bg);border:1px solid var(--bad-bd);color:var(--bad-ink);border-radius:6px;padding:7px 10px;margin:6px 0;font-size:12px;line-height:1.7}
.lin-out{background:var(--good-bg);border:1px solid var(--good-bd);color:var(--good-ink);border-radius:6px;padding:7px 10px;margin:6px 0;font-size:12px;line-height:1.7}
.lin-gloss{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.lin-gloss th,.lin-gloss td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.lin-gloss th{background:var(--th-bg);white-space:nowrap}
.lin-gloss td:first-child{white-space:nowrap;font-weight:600}
@media(max-width:640px){.lin-card p,.lin-card ul{font-size:12px}}
@media print{
  header,.left,#menuBtn{display:none!important}
  /* 📂 แผงที่ยุบไว้ต้องกางออกตอนพิมพ์/บันทึก PDF ไม่งั้นรายงานจะขาดตาราง (12 ส.ค. 69) */
  .exsec-b{display:block!important}
  .exsec-ar{display:none!important}
  .exsec-h{background:none!important;margin:0!important;padding:0!important}
  .main{display:block!important;overflow:visible!important;height:auto!important}
  .right{overflow:visible!important;height:auto!important}
  .dwrap{max-width:100%!important;padding:0!important;gap:10px!important}
  .panel{overflow:visible!important;box-shadow:none!important;break-inside:avoid;page-break-inside:avoid}
  .acctbl-wrap{max-height:none!important;overflow:visible!important}
  /* ตอนพิมพ์ต้องคลาย sticky ออก ไม่งั้นหัวตาราง/คอลัมน์ที่ตรึงลอยทับเนื้อในหน้าที่ 2 ขึ้นไป */
  table.wltbl.ex-sticky th,table.wltbl.ex-sticky td{position:static!important;box-shadow:none!important}
  table.wltbl{min-width:0!important;font-size:9.5px!important}
  input[type=range],.ovbulkbtn,.ovtgl,.tgt-apply,.exnum,.colinfo,.no-print,select,#themeBtn,.lvlbtns{display:none!important}
  details:not([open])>summary{display:none}
  body{background:#fff!important}
  .print-head{display:block!important;margin-bottom:8px;border-bottom:2px solid #333;padding-bottom:6px}
  @page{size:A4 landscape;margin:9mm}
}
</style>

<body>

<header>
  <button id="menuBtn" onclick="toggleDrawer()" title="เปิดรายชื่อ รพ.">☰</button>
  <h1>🔎 สาเหตุวิกฤต</h1>
  <div class="sub">ไล่สาเหตุ Risk Score จากงบทดลอง — เขตสุขภาพที่ 1 · <span id="hPeriod">-</span> · <span id="hNHosp">-</span> รพ.</div>
  <nav style="margin-left:auto;display:flex;gap:14px;font-size:13px;flex-wrap:wrap;align-items:center">
    <a href="index.html" style="color:#cbd5e1;text-decoration:none">← Balance Sheet</a>
    <a href="#exec" style="color:#6ee7b7;text-decoration:none;font-weight:600">🧭 ผู้บริหาร</a>
    <a href="explorer.html" style="color:#fbbf24;text-decoration:none;font-weight:600">🔍 Explorer</a>
    <a href="https://pitaknan.github.io/Risk-Score-Rh1/" target="_blank" style="color:#cbd5e1;text-decoration:none">🎯 Risk Score</a>
    <a href="#data" style="color:#a5b4fc;text-decoration:none;font-weight:600" title="ผังที่มาของข้อมูล — เลขบนหน้านี้มาจากไหน ผ่านอะไรมาบ้าง">🗺️ ที่มาข้อมูล</a>
    <button id="themeBtn" onclick="toggleTheme()" title="สลับโหมดมืด/สว่าง">🌙</button>
  </nav>
</header>

<div class="main">
  <!-- LEFT -->
  <div class="left">
    <div class="drawer-close"><button onclick="closeDrawer()">✕ ปิด</button></div>
    <div class="lfilt">
      <input id="qSearch" type="text" placeholder="ค้นหาชื่อ รพ. / จังหวัด..." oninput="renderList()">
      <div class="row">
        <select id="fLevel" onchange="renderList()"><option value="">ทุกระดับ</option></select>
        <select id="fProv" onchange="renderList()"><option value="">ทุกจังหวัด</option></select>
      </div>
      <div class="seg">
        <button id="sRisk" class="on" onclick="setSort('risk')">Risk สูงสุด</button>
        <button id="sDelta" onclick="setSort('delta')">แย่ลงเร็วสุด</button>
      </div>
    </div>
    <div class="llist" id="llist"></div>
  </div>

  <!-- ปุ่มยุบ/กางแถบรายชื่อ รพ. — ติดขอบแถบซ้าย เห็นตลอด (เดสก์ท็อป) -->
  <button type="button" class="lcolbtn" id="lcolBtn" onclick="toggleLeftCol()"
    title="ยุบ/กางแถบรายชื่อโรงพยาบาลด้านซ้าย เพื่อเพิ่มพื้นที่ให้ตารางด้านขวา">◀</button>

  <!-- RIGHT -->
  <div class="right" id="right">
    <div class="hint-empty">กำลังโหลด...</div>
  </div>
</div>
<div class="backdrop" id="backdrop" onclick="closeDrawer()"></div>

<script>
// ── เดสก์ท็อป: ยุบ/กางแถบรายชื่อ รพ. ด้านซ้าย (เจ้าของงานสั่ง 6 ส.ค. 69) ──────────
// เอาพื้นที่ 340px ไปให้ตารางด้านขวา · จำสถานะไว้ใน localStorage (แยกคีย์ ไม่ปนกับ state ของแท็บ #exec)
const LCOL_KEY='rd_leftcol';
function applyLeftCol(on){
  const m=document.querySelector('.main'), b=document.getElementById('lcolBtn');
  if(m) m.classList.toggle('lcol', !!on);
  if(b){ b.textContent = on?'▶':'◀';
    b.title = (on?'กางแถบรายชื่อโรงพยาบาลกลับมา':'ยุบแถบรายชื่อโรงพยาบาลด้านซ้าย เพื่อเพิ่มพื้นที่ให้ตารางด้านขวา'); }
}
function toggleLeftCol(){
  const on=!document.querySelector('.main').classList.contains('lcol');
  applyLeftCol(on);
  try{ localStorage.setItem(LCOL_KEY, on?'1':'0'); }catch(e){}
}
try{ if(localStorage.getItem(LCOL_KEY)==='1') document.addEventListener('DOMContentLoaded',()=>applyLeftCol(true)); }catch(e){}
// ── มือถือ/แท็บเล็ต: drawer สำหรับรายชื่อ รพ. ────────────────
function toggleDrawer(){
  const open=!document.querySelector('.left').classList.contains('open');
  document.querySelector('.left').classList.toggle('open',open);
  document.getElementById('backdrop').classList.toggle('show',open);
}
function closeDrawer(){
  document.querySelector('.left').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}
// ── โหมดมืด/สว่าง ─────────────────────────────────────────
function isDarkNow(){const t=document.documentElement.getAttribute('data-theme');if(t)return t==='dark';return window.matchMedia('(prefers-color-scheme: dark)').matches}
function syncThemeBtn(){document.getElementById('themeBtn').textContent=isDarkNow()?'☀️':'🌙'}
function toggleTheme(){const next=isDarkNow()?'light':'dark';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('rh1-theme',next);syncThemeBtn();if(CUR)renderDetail(CUR)}
syncThemeBtn();

// ── Config / State ──────────────────────────────────────────
const D='data/risk/';
let SUMMARY=null, CUR=null, HDATA=null;
let sortMode='risk';
let periodMode='mom';   // mom | yoy
let ratioMetric='cr';   // cr | qr | cash
let peerDim='grp';      // grp | level | prov
let bandMode='p10';     // p25 = แถบ P25-P75 อย่างเดียว | p10 = +P10-P90 (ค่าเริ่มต้น) | mm = +Min-Max
let ratioChart=null;
const H_CACHE={};

const TH_M=['ต.ค.','พ.ย.','ธ.ค.','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.'];
// ป้ายงวด: t = ปีงบ(พ.ศ.)*100 + เดือนงบ (1=ต.ค. … 12=ก.ย.)
// ⚠️ เดือนงบ 1-3 (ต.ค./พ.ย./ธ.ค.) อยู่ใน "ปีปฏิทินก่อนหน้าปีงบ" จึงต้องลบ 1
//    เช่น 257003 = ธ.ค. ของปีงบ 2570 = ธันวาคม 2569 → "ธ.ค.69" ไม่ใช่ "ธ.ค.70"
//    (สูตรเดียวกับ index.html และ explorer.html ที่แก้ไว้ก่อนแล้ว — หน้านี้ตกขบวน แก้ 5 ส.ค. 69)
function tLab(t){const fy=Math.floor(t/100),fm=t%100;const by=fm<=3?fy-1:fy;
  return TH_M[fm-1]+String(by%100).padStart(2,'0');}
// ทศนิยม: B และ M = 2 ตำแหน่ง (เจ้าของงานกำหนด 9 ส.ค. 69) · K คงเป็นจำนวนเต็มตามเดิม
// ⚠️ ต้องตรงกับ fmtM ใน explorer.html — สองหน้านี้แสดงยอดเดียวกัน ถ้าไม่ตรงจะอ่านเป็นคนละเลข
function fmtM(v){if(v==null)return '—';const a=Math.abs(v);if(a>=1e9)return(v/1e9).toFixed(2)+'B';if(a>=1e6)return(v/1e6).toFixed(2)+'M';if(a>=1e3)return(v/1e3).toFixed(0)+'K';return Math.round(v).toLocaleString()}
function fmtR(v){return v==null?'—':v.toFixed(2)}
// ── ไอคอน ⓘ tooltip: ความหมาย/สูตร/ที่มาข้อมูล — hover (desktop) หรือแตะ (มือถือ ผ่าน tabindex+click toggle) ──
function tip(text){ return `<span class="tip" tabindex="0" onclick="event.stopPropagation();this.classList.toggle('show')">ⓘ<span class="tip-box">${text}</span></span>`; }
document.addEventListener('click', ()=>document.querySelectorAll('.tip.show').forEach(el=>el.classList.remove('show')));
function riskColor(r){
  if(r==null)return '#94a3b8';
  if(r<=1)return getCss('--green'); if(r<=3)return getCss('--gold'); if(r<=5)return getCss('--orange'); return getCss('--red');
}
function getCss(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()}

// ── Init ──────────────────────────────────────────────────
async function init(){
  try{ SUMMARY = await fetch(D+'summary.json').then(r=>r.json()); }
  catch(e){ document.getElementById('llist').innerHTML='<div style="padding:16px;color:var(--mut)">โหลดข้อมูลไม่ได้ — ยังไม่ได้รัน export_risk_link.py หรือ path ผิด</div>'; return; }

  document.getElementById('hPeriod').textContent=SUMMARY.periodLabel+' '+SUMMARY.period;
  document.getElementById('hNHosp').textContent=SUMMARY.nHosp;

  const levels=[...new Set(SUMMARY.hospitals.map(h=>h.level).filter(Boolean))].sort();
  const provs=[...new Set(SUMMARY.hospitals.map(h=>h.prov).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'th'));
  const fL=document.getElementById('fLevel'), fP=document.getElementById('fProv');
  for(const l of levels){const o=document.createElement('option');o.value=l;o.textContent=l;fL.appendChild(o)}
  for(const p of provs){const o=document.createElement('option');o.value=p;o.textContent=p;fP.appendChild(o)}

  renderList();

  // deep link: #h/{hcode} — ไม่มี hash หรือ hash ไม่ตรง = หน้า Watchlist (ค่าเริ่มต้น)
  window.addEventListener('hashchange',applyHash);
  applyHash();
}

function applyHash(){
  const m=location.hash.match(/^#h\/(\w+)/);
  if(m && SUMMARY.hospitals.find(h=>h.hcode===m[1])) selectHosp(m[1]);
  else if(location.hash.startsWith('#exec')) { CUR=null; renderList(); closeDrawer(); renderExec(); }
  else if(location.hash.startsWith('#data')) { CUR=null; renderList(); closeDrawer(); renderLineage(); }
  else { CUR=null; renderList(); renderWatchlist(); }
}

// ── List (L0) ───────────────────────────────────────────────
function setSort(s){sortMode=s;document.getElementById('sRisk').classList.toggle('on',s==='risk');document.getElementById('sDelta').classList.toggle('on',s==='delta');renderList()}

function renderList(){
  const q=document.getElementById('qSearch').value.trim().toLowerCase();
  const lv=document.getElementById('fLevel').value, pv=document.getElementById('fProv').value;
  let rows=SUMMARY.hospitals.filter(h=>
    (!lv||h.level===lv)&&(!pv||h.prov===pv)&&
    (!q||h.name.toLowerCase().includes(q)||(h.prov||'').toLowerCase().includes(q))
  );
  if(sortMode==='risk') rows=rows.slice().sort((a,b)=>(b.risk||0)-(a.risk||0));
  else rows=rows.slice().sort((a,b)=>((b.risk||0)-(b.riskPrev3||0))-((a.risk||0)-(a.riskPrev3||0)));

  document.getElementById('llist').innerHTML = rows.map((h,i)=>{
    const d=(h.risk||0)-(h.riskPrev3??h.risk??0);
    const arrow = d>0?`<span class="trend-arrow" style="color:var(--red)" title="แย่ลง ${d} จุด ใน 3 เดือน">▲</span>`
                : d<0?`<span class="trend-arrow" style="color:var(--green)" title="ดีขึ้น ${-d} จุด ใน 3 เดือน">▼</span>`
                : `<span class="trend-arrow" style="color:var(--mut)">–</span>`;
    return `<div class="lrow${CUR===h.hcode?' actv':''}" onclick="location.hash='h/${h.hcode}'">
      <span class="rk">${i+1}</span>
      <span class="badge" style="background:${riskColor(h.risk)}">${h.risk!=null?h.risk:'–'}</span>
      ${arrow}
      <span class="nm"><span class="n1">${h.name}</span><span class="n2">${h.prov||''} · ${h.grp||''}</span></span>
    </div>`;
  }).join('') || '<div style="padding:16px;color:var(--mut)">ไม่พบโรงพยาบาล</div>';
}

// ── Select hospital → load detail (L1-L4) ───────────────────
async function selectHosp(hcode){
  CUR=hcode;
  renderList();
  closeDrawer();
  document.getElementById('right').innerHTML='<div class="hint-empty">กำลังโหลด...</div>';
  try{
    if(!(hcode in H_CACHE)) H_CACHE[hcode]=await fetch(`${D}h/${hcode}.json`).then(r=>r.json());
    HDATA=H_CACHE[hcode];
  }catch(e){
    document.getElementById('right').innerHTML='<div class="hint-empty">โหลดรายละเอียดของ รพ.นี้ไม่ได้</div>';
    return;
  }
  ratioMetric='cr'; periodMode='mom';
  renderDetail(hcode);
}

function summaryOf(hcode){ return SUMMARY.hospitals.find(h=>h.hcode===hcode) }

// ── Watchlist: สาเหตุ + คำแนะนำ อัตโนมัติ (map จากกรอบ "4 เสาหลัก") ──────
function causeBullets(h){
  const b=[];
  if((h.triggers||[]).includes('cash')) b.push(`Cash ratio ต่ำ ${fmtR(h.cash)}`);
  if((h.triggers||[]).includes('qr')) b.push(`Quick ratio ต่ำ ${fmtR(h.qr)}`);
  if((h.triggers||[]).includes('cr')) b.push(`Current ratio ต่ำ ${fmtR(h.cr)}`);
  if(h.nwc<0) b.push(`NWC ติดลบ ${fmtM(h.nwc)}`);
  if(h.reserve<0) b.push(`เงินบำรุงคงเหลือสุทธิติดลบ ${fmtM(h.reserve)}`);
  if((h.triggers||[]).includes('ni')) b.push(`ขาดทุนสะสม ${fmtM(h.ni)}`);
  const tc=h.topCause||{};
  if(tc.exp && tc.exp.name && tc.exp.delta>0) b.push(`${tc.exp.name} เพิ่ม ${fmtM(tc.exp.delta)}`);
  if(tc.ca && tc.ca.name && tc.ca.delta<0) b.push(`${tc.ca.name} ลด ${fmtM(Math.abs(tc.ca.delta))}`);
  if(tc.cl && tc.cl.name && tc.cl.delta>0) b.push(`${tc.cl.name} เพิ่ม ${fmtM(tc.cl.delta)}`);
  return b.slice(0,4);
}
function recommendFor(h){
  const rec=[]; const tc=h.topCause||{};
  const isPersonnel = tc.exp && tc.exp.name && /เงินเดือน|ค่าจ้าง|ค่าตอบแทน/.test(tc.exp.name);
  const trig=h.triggers||[];
  if(trig.includes('cash')||trig.includes('ni'))
    rec.push('เร่งปิด gap รายได้: ตรวจ claim ค้าง/ถูกปฏิเสธ, coding/DRG, เร่งรัดลูกหนี้ค้างจ่าย');
  if(isPersonnel && (trig.includes('ni')||h.nwc<0))
    rec.push('Lean จัดกำลังคนตามภาระงานจริง คุมสัดส่วนค่าใช้จ่ายบุคลากรต่อรายได้ไม่เกิน 50-60%');
  if(trig.includes('qr'))
    rec.push('ทำ Lean Inventory / เข้าร่วมจัดซื้อร่วมระดับเขต ลด safety stock ยา-เวชภัณฑ์');
  if((trig.includes('cr')||h.nwc<0) && !isPersonnel)
    rec.push('คุมสภาพคล่องผ่านสัปดาห์ แยกงบลงทุนออกจากเงินหมุนเวียน รักษาวินัยแผนเงินบำรุง/Planfin');
  if(h.ebitda!=null && h.ebitda<0 && !rec.length)
    rec.push('ทำ EBITDA recovery plan: เพิ่มรายได้ที่เรียกเก็บได้จริง ลดต้นทุนที่ไม่กระทบบริการ');
  if(!rec.length) rec.push('ติดตามต่อเนื่อง ยังอยู่ในเกณฑ์ควบคุมได้');
  return rec.slice(0,2);
}

// ── เงินสดพอจ่าย MOE: เงินสดที่มีจ่ายค่าใช้จ่ายจำเป็น (MOE) ได้กี่เดือน ──────────
// ใช้ตัวเลขชุดเดียวกับแท็บผู้บริหาร (#exec) เป๊ะ — summary.json ให้มาสองฟิลด์จาก export_risk_link.py:
//   cn    = เงินสดและรายการเทียบเท่าเงินสด (1003X ตัวเดียวกับ EX.hosp[].bs.cn)
//   moeMo = MOE ทางการ/เดือน — ชุด MOE.Ver69 59 บัญชี (นิยาม MOE_ACC ชุดเดียวกับ export_exec.py)
//           ⚠️ หน้านี้ตรึงไว้ที่ Ver69 (สลับเวอร์ชันได้เฉพาะแท็บ #exec) ตามกติกาเหล็ก 3.6
// เส้นเทียบ = 3 เดือน คงที่ (ไม่ใช่เพดาน · ค่าจริงเกินได้ เช่น ฮอด 7.8 เดือน)
// ที่มาของเลข 3 — เจ้าของงานกำหนด 29 ก.ค. 69: ตรงกับเกณฑ์ SU (อัตราความอยู่รอด) ของ Risk Score
//   ที่ให้ผ่านเมื่ออยู่รอดได้ ≥ 3 เดือน (ดูหัวข้อ 1: s=NWC÷(|NI|/mo) · s<3 = 2 คะแนน)
//   และตรงคำถามที่ต้องตอบ: "จากงวดนี้ไปอีก 3 เดือน จะมีเงินจ่ายค่าใช้จ่ายขั้นต่ำหรือไม่"
// ⚠️ เดิม (28 ก.ค.) ใช้ (12 − เดือนงวด) = เดือนที่เหลือถึงสิ้นปีงบ — เลิกใช้แล้วเพราะงวด ก.ย.
//    จะได้ 0 ทำให้ชิป/บรรทัดสรุปหายทั้งแผง และเกณฑ์ 3 เดือนไม่ควรผูกกับปฏิทินปีงบ
// ⚠️ เงินสำรองใน exSimPath ใช้ MOE_MIN_MO ตัวเดียวกัน (29 ก.ค. 69) — นิยาม "อยู่รอด" ชุดเดียว
//    แต่ **ฐานที่คูณต่างกันโดยเจตนา**: ตัวชี้วัดนี้ใช้ MOE ทั้งก้อน (ตอบคำถาม "ถ้ารายรับสะดุด
//    จะอยู่ได้กี่เดือน" — ต้องรวมค่ายาด้วย) · เงินสำรองในเส้นจำลองใช้เฉพาะส่วนที่ยืดไม่ได้
//    + คชจ.ค้างจ่าย (ตอบคำถาม "ควักเงินสดไปทำอย่างอื่นได้เท่าไหร่" — ค่ายาซื้อด้วยเครดิตได้)
//    ดู RISK_EXEC_MODEL.md หัวข้อ 3.5/3.6/3.12/3.13
// ⚠️ อ่านให้ถูก: ต่ำกว่าเส้น = "ไม่ได้กันเงินไว้ล่วงหน้า ต้องพึ่งรายรับที่เข้ามาระหว่างทาง"
//    ไม่ใช่ "จ่าย MOE ไม่ได้" (ส่วนใหญ่กระแสเงินสด/เดือนเป็นบวก) — ดู RISK_EXEC_MODEL.md หัวข้อ 3.6
const MOE_MIN_MO=3;                                 // เกณฑ์ขั้นต่ำตาม SU — ค่าคงที่ ไม่ผูกกับงวด
function wlMoeLeft(){ return MOE_MIN_MO; }
function wlMoeBuf(h){ return (h && h.moeMo>0 && h.cn!=null) ? h.cn/h.moeMo : null; }
function wlMoeShort(list){ const left=wlMoeLeft(); return list.filter(h=>{ const rw=wlMoeBuf(h); return rw!=null && rw<left; }); }
function wlMoeCell(h){
  const rw=wlMoeBuf(h);
  if(rw==null) return '<span class="note">–</span>';
  const left=wlMoeLeft(), short=rw<left;
  return `<b style="color:${short?'var(--red)':'var(--green)'}">${rw.toFixed(1)} เดือน${short?' ⚠️':''}</b>`+
    `<span class="cellsub${short?' warn':''}">${short?'ขาด '+fmtM(h.moeMo*left-h.cn):'ผ่านเกณฑ์ '+left+' เดือน'}</span>`;
}
// ชิปในหัวแผง (เห็นได้ทั้งที่ยังไม่กดขยาย) + บรรทัดอธิบายเต็มในตัวแผง
function wlMoeChip(rows){
  const n=wlMoeShort(rows).length;
  if(!n) return '';
  return `<span class="exchip warn">💧 เงินสดพอจ่าย MOE ไม่ถึง ${wlMoeLeft()} เดือน (เกณฑ์ขั้นต่ำ): ${n}/${rows.length} แห่ง</span>`;
}
function wlMoeNote(rows){
  const left=wlMoeLeft(), inList=wlMoeShort(rows), all=wlMoeShort(SUMMARY.hospitals);
  if(!all.length) return '';
  const gap=all.reduce((s,h)=>s+(h.moeMo*left-h.cn),0);
  const worst=all.map(h=>({n:h.name,rw:wlMoeBuf(h)})).sort((a,b)=>a.rw-b.rw).slice(0,4);
  return `<div class="note" style="margin-top:6px">💧 <b>เงินสดพอจ่าย MOE</b> (เงินสด ÷ MOE ต่อเดือน) — กลุ่มวิกฤตนี้ <b>${inList.length}</b> จาก ${rows.length} แห่ง ·
    ทั้งเขต <b>${all.length}</b> จาก ${SUMMARY.nHosp} แห่ง จ่ายได้<b>ไม่ถึง ${left} เดือน</b> ซึ่งเป็นเกณฑ์ขั้นต่ำตามหลักอัตราความอยู่รอด (SU) ของ Risk Score (ขาดรวม ${fmtM(gap)})
    <br>น้อยสุด: ${worst.map(w=>w.n+' '+w.rw.toFixed(1)+' เดือน').join(' · ')} — อ่านว่า <b>"ไม่ได้กันเงินไว้ล่วงหน้า ต้องพึ่งรายรับที่เข้ามาระหว่างทาง"</b>
    ไม่ใช่จ่าย MOE ไม่ได้ ถ้ารายรับสะดุดกลุ่มนี้กระทบก่อน · <a class="ovlink" href="#exec">เจาะรายแห่งในมุมมองผู้บริหาร →</a></div>`;
}

function renderWatchlist(){
  const rows=SUMMARY.hospitals.filter(h=>(h.risk||0)>=6).sort((a,b)=>(b.risk||0)-(a.risk||0));
  document.getElementById('right').innerHTML=`
  <div class="dwrap" style="max-width:1200px">
    <details class="refpanel wl-panel">
      <summary>🚨 Watchlist — โรงพยาบาลวิกฤต 6-7 คะแนน <span class="meta">งวด ${SUMMARY.periodLabel} ${SUMMARY.period} · ${rows.length} แห่ง จาก ${SUMMARY.nHosp}</span>${wlMoeChip(rows)}</summary>
      <div class="refbody">
        <div class="note">คลิกแถวเพื่อดูรายละเอียดสาเหตุเต็มรูปแบบ (เทรนด์/waterfall/บัญชี GL) ของ รพ.นั้น</div>
        ${wlMoeNote(rows)}
        <div class="panel">
          <div class="acctbl-wrap" style="max-height:none">
            <table class="wltbl wl-card">

let OV_CTX=null, OV_TGT=null, OV_OPEN={}, OV_PLAN={}, OV_TSV='';
let OV_CARRY=null;   // แผนงวดก่อนหน้าที่พบตอนโหลด (รอผู้ใช้กดยืนยัน) — ดู carryFindPrev

function svSepLabelFor(ctx){ return tLab(Math.floor(ctx.startT/100)*100+12); }
// ค่าแนะนำ "เร่งเก็บลูกหนี้": ส่วนเกินเป้า ACP ทางการรายกองทุน (UC/CSMBS ≤60 วัน, SSS ≤90 วัน — จาก note)
function arSuggest(ctx){
  if(!ctx.recv) return 0;
  let s=0;
  for(const r of ctx.recv){
    const m=(r.note||'').match(/(\d+)/); const tgt=m?+m[1]:60;
    if(r.acp>tgt && r.ar>0) s+=r.ar*(1-tgt/r.acp);
  }
  return Math.round(s/SV_STEP)*SV_STEP;
}
function ovDefaultPlan(ctx){ return {method:'auto', alpha:50, acp:arSuggest(ctx), acpMonth:2, debt:0}; }
function ovPlanOf(hc, ctx){ let p=OV_PLAN[hc]; if(!p){ p=ovDefaultPlan(ctx); OV_PLAN[hc]=p; } return p; }
function ovStoreKey(){ return 'rh1-ovplan-'+((SUMMARY&&SUMMARY.period)||''); }
// นับเฉพาะแถวที่ทีม "แก้เอง" จริง ๆ — ovSavePlan เซฟค่า default ที่ระบบสร้างเองลงไปด้วย
// จึงนับจำนวน plans เฉย ๆ ไม่ได้ (จะเด้งแถบเสนอทั้งที่ไม่มีใครแตะอะไรเลย)
// method!=='auto' และ debt>0 เกิดจากการกดของผู้ใช้เท่านั้น (ovDefaultPlan ให้ 'auto'/0)
function ovCarryWork(s){
  const p=(s&&s.plans)||{};
  return Object.keys(p).filter(k=>p[k] && (p[k].method!=='auto' || +p[k].debt>0)).length;
}
function ovLoadPlan(){
  OV_CARRY=null;
  let raw=null; try{ raw=localStorage.getItem(ovStoreKey()); }catch(e){}
  if(raw){ try{ const s=JSON.parse(raw||'null'); if(s){ OV_PLAN=s.plans||{}; OV_TGT=(s.tgt!=null?s.tgt:null); } }catch(e){} }
  else OV_CARRY=carryFindPrev('rh1-ovplan-', +((SUMMARY&&SUMMARY.period)||0), ovCarryWork);
}
function ovCarryHtml(){

// เลือกตัวเลขตามวิธีที่ผู้ใช้ติ๊ก — 'auto' = วิธีที่ใช้เงินก้อนภายนอกน้อยสุดที่ยังถึงเป้า (💪→⚖️→💰)
function ovChoose(o){
  const p=ovPlanOf(o.h.hcode, o.ctx);
  const opts={alpha:p.alpha/100, acpFreed:p.acp, acpMonth:p.acpMonth, debtNetMo:p.debt};
  const r=solveTargetFor(o.ctx, OV_TGT, opts);
  const run=r.run;
  if(r.status!=='ok') return {p, opts, r, m:r.status, ni:run, inj:0, ok:true, sep:r.status==='atlevel'?null:evalPlanFor(o.ctx,opts,run,0)};
  let m=p.method;
  if(m==='auto') m = r.niReq!=null?'ni' : (r.injMid!=null?'mix' : (r.injOnly!=null?'inj':'ni'));
  let ni=run, inj=0, ok=true;
  if(m==='ni'){ if(r.niReq!=null){ni=r.niReq;} else ok=false; }
  else if(m==='inj'){ if(r.injOnly!=null){inj=r.injOnly;} else ok=false; }
  else { if(r.injMid!=null){ni=Math.max(r.niMid,run); inj=r.injMid;} else {ni=Math.max(r.niMid||run,run); ok=false;} }
  return {p, opts, r, m, auto:p.method==='auto', ni, inj, ok, sep:evalPlanFor(o.ctx,opts,ni,inj)};
}

function ovBuildTSV(items, L, sepLab){
  const M=v=>(v/1e6).toFixed(2);
  const head=['จังหวัด','โรงพยาบาล','ระดับปัจจุบัน','เป้า','วิธี','เงินก้อนจากเขต(ลบ.)','กำไรเป้าหมาย/เดือน(ลบ.)','กำไรเพิ่มจากปัจจุบัน(ลบ./เดือน)','เร่งเก็บลูกหนี้(ลบ.)','เงินลูกหนี้เข้าเดือนที่','ชำระหนี้สุทธิ/เดือน(ลบ.)','ผลจำลอง ณ '+sepLab].join('\t');
  const lines=items.map(({o,c})=>{
    const mm=c.m==='atlevel'?'อยู่ในระดับนี้พอดี'
      :c.m==='safe'?'ปลอดภัย (ไม่ตกแม้ขาดทุนหนักสุด)'
      :c.m==='ceiling'?`เพดานขาดทุน (ห้ามต่ำกว่า)`
      :c.m==='already'?'ถึงเป้าเอง'
      :((c.auto?'อัตโนมัติ→':'')+(OV_MLAB[c.m]||c.m)+(c.ok?'':' (ไม่ถึงเป้า)'));
    const niOut=c.m==='ceiling'?c.r.floor:(c.ni||0);
    const niDelta=c.m==='ceiling'?(c.r.floor-c.r.run):Math.max(0,(c.ni||0)-(c.r.run||0));
    return [o.h.prov||'',o.h.name,o.ctx.official,L,mm,M(c.inj||0),M(niOut),M(niDelta),M(c.p.acp||0),c.p.acp>0?c.p.acpMonth:'-',M(c.p.debt||0),c.sep!=null?c.sep:'-'].join('\t');
  });
  const act=items.filter(x=>!['atlevel','already','safe','ceiling'].includes(x.c.m)&&x.c.ok);
  const tot=['รวม','', '', '', '', M(act.reduce((s,x)=>s+x.c.inj,0)), '', M(act.reduce((s,x)=>s+Math.max(0,x.c.ni-x.c.r.run),0)), M(items.filter(x=>x.c.m!=='atlevel').reduce((s,x)=>s+(x.c.p.acp||0),0)), '', '', ''].join('\t');
  return [head,...lines,tot].join('\n');
}

function ovCopyTSV(){

function linChain(id){
  const up=new Set([id]), dn=new Set([id]);
  for(let i=0;i<9;i++){
    LIN_LINKS.forEach(([a,b])=>{ if(dn.has(a)) dn.add(b); if(up.has(b)) up.add(a); });

  return new Set([...up,...dn]);
}

const LIN_CARD_OF_COL=['hfo','mdb','bs','pq','erl','sum','wl'];

function linSvg(){
  // ขนาดคุมให้ความกว้างรวม ≈ 1120 = พอดีกรอบ .dwrap (max-width 1200) บนจอเดสก์ท็อป
  // ถ้าเพิ่มคอลัมน์ในอนาคตต้องลด CS ลงด้วย ไม่งั้นผังจะล้นต้องเลื่อนแนวนอน
  const NW=148,NH=54,CS=160,RS=68,PX=6,PY=34;
  const W=PX*2+CS*(LIN_COLS.length-1)+NW, H=PY+RS*4+6;
  const pos={}; LIN_NODES.forEach(n=>{ pos[n.id]={x:PX+n.c*CS,y:PY+n.r*RS}; });
  const chain=LIN_SEL?linChain(LIN_SEL):null;
  const inCh=id=>!chain||chain.has(id);
  const heads=LIN_COLS.map((t,i)=>
    `<rect class="lin-colbg" x="${PX+i*CS-4}" y="6" width="${NW+8}" height="${H-10}"></rect>
     <text class="lin-col" x="${PX+i*CS}" y="22">${t}</text>`).join('');
  const links=LIN_LINKS.map(([a,b])=>{
    const s=pos[a],d=pos[b]; if(!s||!d) return '';
    const x1=s.x+NW,y1=s.y+NH/2,x2=d.x,y2=d.y+NH/2,mx=(x1+x2)/2;
    const hot=chain&&chain.has(a)&&chain.has(b);
    return `<path class="lin-link${hot?' hot':''}${chain&&!hot?' lin-dim':''}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"></path>`;
  }).join('');
  const nodes=LIN_NODES.map(n=>{
    const p=pos[n.id], on=LIN_SEL===n.id;
    // ตัดชื่อยาวให้พอกับกล่อง (กันข้อความล้นออกนอกกรอบบนจอแคบ)

    return `<g class="lin-node${on?' on':''}${inCh(n.id)?'':' lin-dim'}" onclick="linSelect('${n.id}')">

      <text class="sub" x="${p.x+9}" y="${p.y+38}">${s}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet" role="img"

}

function exMoeTargetLab(){ return tLab(addMo(EX.hosp[0].bs.t, exMoeMonths())); }

function exPayIn(h){ return (h.tj&&h.tj.payIn)||0; }
// ── ลูกหนี้ตามจ่าย: ปรับลดได้ (เจ้าของงานสั่ง 6 ส.ค. 69) ─────────────────────────────
// เหตุผล: ฝั่ง "เจ้าหนี้" เคลียร์เป็น 0 ได้แน่นอนทั้งเขต เพราะเป็นหนี้กันเองในเครือข่าย สป.สธ.
// แต่ฝั่ง "ลูกหนี้" เกินมา 189 ลบ. ซึ่งบางส่วนน่าจะเป็นกรมอื่น/นอกเขต = อาจเรียกเก็บไม่ได้
// และยังไม่รู้ว่าที่ไหนเก็บไม่ได้ → ให้ปรับ % รวมทั้งเขต และ/หรือ แก้เป็นรายแห่งด้วยมือ
function exArRaw(h){ return (h.tj&&h.tj.arIn)||0; }
function exArPct(){ const v=+EXST.arPct; return (v>=0&&v<=100)?v:100; }   // % ที่คาดว่าเก็บได้ (ค่าเริ่มต้น 100)
// ══ 📥 การเกลี่ยลูกหนี้ที่คาดว่าเก็บได้ — 3 ชั้น (เจ้าของงานเคาะ 7 ส.ค. 69) ═══════════════════
// 🪤 ของเดิม (6 ส.ค. 69) ตัด % เท่ากันทุกแห่ง → **ผิดเจตนา** เพราะจังหวัดที่ลูกหนี้สูงกว่าเจ้าหนี้อยู่แล้ว
//    ยังคงสูงกว่าหลังตัด (เชียงใหม่ +19.5M · เชียงราย +9.6M) = มีเงินไหลเข้าเกินจริง ทำให้สถานะดูดีผิดปกติ
//    ส่วนจังหวัดที่ลูกหนี้ต่ำกว่าเจ้าหนี้ก็ยิ่งติดลบหนัก (ลำปาง −21.2M)
// ✅ วิธีใหม่ — เกลี่ย "ยอดที่เหลือ" ไม่ใช่ "ยอดที่ตัด":
//    ① ทั้งเขต: ยอดที่คาดว่าเก็บได้รวม = Σลูกหนี้ดิบทั้งเขต × %
//    ② รายจังหวัด: โควตา = ยอดรวม① × (เจ้าหนี้จังหวัดนั้น ÷ เจ้าหนี้ทั้งเขต)  ← สัดส่วน "เจ้าหนี้"
//       แล้ว **ตัดเพดานไม่ให้เกินลูกหนี้ดิบที่จังหวัดนั้นมีจริง** (เก็บเกินยอดในบัญชีไม่ได้)
//    ③ ราย รพ.: แบ่งโควตาจังหวัดตามสัดส่วน "ลูกหนี้ดิบของ รพ." ในจังหวัดเดียวกัน
//    ผลลัพธ์: ทุกจังหวัดได้อัตราส่วน ลูกหนี้:เจ้าหนี้ เท่ากันหมด → สุทธิ ≈ 0 ทุกจังหวัด ไม่มีใครได้เงินเข้าเกิน
// ⚠️ ส่วนที่ล้นเพดานของจังหวัดที่ลูกหนี้ไม่พอ (เช่น แพร่) **ไม่เอาไปเกลี่ยต่อให้จังหวัดอื่น** โดยตั้งใจ
//    เพราะจะทำให้จังหวัดอื่นเกินเจ้าหนี้ = กลับไปเป็นปัญหาเดิม · ยอดรวมจึงต่ำกว่าเป้า % เล็กน้อย (ถูกต้องแล้ว)
// ⚠️ คำนวณจาก EX.hosp **ทั้ง 103 แห่งเสมอ** ห้ามผูกกับตัวกรองจังหวัด/ประเภท —
//    ไม่งั้นกรองจังหวัดแล้วตัวเลขของ รพ. เดิมจะเปลี่ยนไปเอง (ยอดต้องนิ่งไม่ว่าดูมุมไหน)
let _arAllocCache={sig:null, map:null};
function exArAlloc(){
  const sig=String(exArPct());
  if(_arAllocCache.sig===sig && _arAllocCache.map) return _arAllocCache.map;
  const map={};
  const payAll=EX.hosp.reduce((s,h)=>s+exPayIn(h),0);
  const arAll=EX.hosp.reduce((s,h)=>s+exArRaw(h),0);
  const keepAll=arAll*exArPct()/100;
  if(!(payAll>0)){   // ไม่มีเจ้าหนี้เลยทั้งเขต (ไม่ควรเกิด) → ถอยกลับไปใช้ % เท่ากันทุกแห่งแบบเดิม
    EX.hosp.forEach(h=>{ map[h.hcode]=exArRaw(h)*exArPct()/100; });
  } else {
    const byProv={};
    EX.hosp.forEach(h=>{ const p=byProv[h.prov]||(byProv[h.prov]={pay:0,ar:0,hs:[]});
      p.pay+=exPayIn(h); p.ar+=exArRaw(h); p.hs.push(h); });
    const pvs=Object.keys(byProv);
    // ── ชั้นที่ 1: เกลี่ยตามสัดส่วน "เจ้าหนี้" — ใช้ได้ถึงเพดานเจ้าหนี้รวมทั้งเขตเท่านั้น ──
    const base=Math.min(keepAll, payAll);
    const q={}; let alloc=0;
    pvs.forEach(pv=>{ const p=byProv[pv];
      q[pv]=Math.min(p.ar, base*(p.pay/payAll)); alloc+=q[pv]; });
    // ── ชั้นที่ 2: ส่วนที่เกินเจ้าหนี้รวม เกลี่ยตาม "ลูกหนี้ที่ยังเหลือ" ของแต่ละจังหวัด ──
    // 🪤 จำเป็น ไม่ใช่ของแถม: ถ้าเกลี่ยตามสัดส่วนเจ้าหนี้ล้วน ๆ แล้วตั้ง 100% จะ **ไม่คืนยอดดิบ**
    //    (เชียงใหม่เหลือ 169M จากยอดจริง 200.7M) = ค่าเริ่มต้น 100% ของทุกคนเปลี่ยนไปเงียบ ๆ
    //    ทั้งที่ "ไม่ได้ปรับลดอะไรเลย" ซึ่งจะทำให้ Risk Score ฐานเดิมเพี้ยนทั้งกระดาน
    //    สองชั้นนี้ทำให้: ≤ จุดสมดุล = เกลี่ยตามเจ้าหนี้เป๊ะ (ตามที่เจ้าของงานสั่ง) · 100% = ยอดดิบเป๊ะ
    // ⚠️ เงื่อนไขต้องเป็น keepAll > payAll (เหนือจุดสมดุล) — **ห้ามใช้ keepAll > alloc**
    //    ไม่งั้นเศษที่เหลือจากจังหวัดที่ติดเพดาน (แพร่ 0.7M) จะถูกเกลี่ยต่อให้จังหวัดอื่น
    //    ทำให้จังหวัดอื่นเกินเจ้าหนี้ตัวเอง = กลับไปเป็นปัญหาเดิมที่เจ้าของงานสั่งให้แก้พอดี
    //    (เจอตอนตรวจ 7 ส.ค. 69: อัตราส่วนเด้งจาก 0.999 เป็น 1.002 ทุกจังหวัด)
    if(keepAll>payAll){
      const room={}; let roomAll=0;
      pvs.forEach(pv=>{ room[pv]=Math.max(0, byProv[pv].ar-q[pv]); roomAll+=room[pv]; });
      if(roomAll>0){ const extra=Math.min(keepAll-alloc, roomAll);
        pvs.forEach(pv=>{ q[pv]+=extra*room[pv]/roomAll; }); }
    }
